<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบ HR 7-Eleven</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--green:#16a34a;--green-d:#15803d;--orange:#ea580c;--ink:#1f2937;--bg:#eef0f2}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Anuphan',system-ui,sans-serif;background:#fff;color:var(--ink);min-height:100vh;display:flex;justify-content:center}
  .app{background:#fff;width:100%;max-width:460px;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.06);display:flex;flex-direction:column}
  .topbar{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;padding:22px 20px 28px;display:flex;align-items:center;gap:12px}
  .tlogo{width:46px;height:46px;border-radius:11px;background:#fff;padding:3px;flex:none}
  .ttext .tt1{font-size:19px;font-weight:700;line-height:1.2}
  .ttext .tt2{font-size:12.5px;opacity:.9;margin-top:2px}
  .hero{padding:0 16px;margin-top:-16px}
  .herobtn{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;border-radius:18px;padding:18px;text-decoration:none;box-shadow:0 10px 22px rgba(37,99,235,.28);transition:transform .1s}
  .herobtn:active{transform:scale(.99)}
  .hicon{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:25px;flex:none}
  .htxt{flex:1}
  .hh1{font-size:17px;font-weight:700}
  .hh2{font-size:12.5px;opacity:.92;margin-top:2px}
  .harrow{font-size:26px;opacity:.85}
  .secttl{font-size:14px;font-weight:700;color:#374151;margin:22px 18px 10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
  .tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:#fff;border:1px solid #eceef1;border-radius:16px;padding:16px;text-decoration:none;color:var(--ink);cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.04);transition:transform .1s}
  .tile:active{transform:scale(.98)}
  .tic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px}
  .tlabel{font-size:14.5px;font-weight:600;text-align:left;line-height:1.25}
  .menu{display:flex;flex-direction:column;gap:8px;padding:0 14px 0;margin-top:-14px}
  .bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:0}
  .banner{display:block;width:100%;border:0;background:none;padding:0;cursor:pointer;transition:transform .12s, filter .12s}
  .banner:active{transform:scale(.98)}
  .banner img{width:100%;height:auto;display:block;filter:drop-shadow(0 5px 12px rgba(20,40,30,.18))}
  .banner:active img{filter:drop-shadow(0 2px 5px rgba(20,40,30,.16))}
  .foot{margin:24px 18px 28px;font-size:12px;color:#9ca3af;text-align:center}
  .ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
  .ovl.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:22px;text-align:left}
  .modal h2{font-size:18px;margin-bottom:12px}
  .modal label{display:block;font-size:13px;font-weight:600;margin:8px 0 4px}
  .modal input,.modal select{width:100%;padding:11px;border:1.5px solid #e5e7eb;border-radius:10px;font:inherit}
  .modal .row{display:flex;gap:10px}
  .mbtn{margin-top:14px;background:var(--green);color:#fff;border:0;border-radius:11px;padding:13px;width:100%;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
  .mx{float:right;border:0;background:none;font-size:22px;cursor:pointer;color:#9ca3af;margin-top:-4px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
  .toast.show{opacity:1}.toast.err{background:#dc2626}.toast.ok{background:#16a34a}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./shared/config.js"></script>
<script src="./shared/supabase.js"></script>
<script>
const $=id=>document.getElementById(id);
function toast(kind,msg){const t=$('toast');t.className='toast show '+kind;t.textContent=msg;setTimeout(()=>t.classList.remove('show'),3500);}
const ovl=$('leaveOvl');
let LRULES=null, LUSAGE={};
async function ensureRules(){ if(!LRULES){ try{ LRULES=await HR.getLeaveRules(); }catch(e){ LRULES=[]; } } }
function updateRule(){
  const t=$('lvType').value; const r=(LRULES||[]).find(x=>x.type===t);
  if(!r){ $('lvRule').innerHTML=''; return; }
  const parts=[];
  if(r.allow_backdate) parts.push('ลาย้อนหลังได้');
  else if(r.advance_days>0) parts.push('ต้องลาล่วงหน้า ≥ '+r.advance_days+' วัน');
  if(r.quota_per_year!=null){ const used=LUSAGE[t]||0; parts.push('โควตา '+r.quota_per_year+' วัน/เดือน (เดือนนี้เหลือ '+Math.max(0,r.quota_per_year-used)+')'); }
  if(r.require_doc) parts.push('ต้องแนบเอกสาร');
  $('lvRule').innerHTML = parts.length ? '<span style="color:#6b7280">เงื่อนไข: '+parts.join(' · ')+'</span>' : '';
  $('lvDocWrap').style.display = r.require_doc ? 'block' : 'none';
}
let LDOC=null;
$('lvDoc').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f){ LDOC=null; return; }
  const rd=new FileReader(); rd.onload=()=>{ LDOC=rd.result; const p=$('lvDocPrev'); p.src=rd.result; p.style.display='block'; }; rd.readAsDataURL(f);
});
$('leaveBtn').onclick=async()=>{ if(!$('lvStart').value)$('lvStart').value=HR.bangkokDate(); if(!$('lvEnd').value)$('lvEnd').value=HR.bangkokDate(); ovl.classList.add('show'); await ensureRules(); myLeaves(); };
$('lvClose').onclick=()=>ovl.classList.remove('show');
ovl.addEventListener('click',e=>{ if(e.target===ovl) ovl.classList.remove('show'); });
$('lvEmp').addEventListener('change', myLeaves);
$('lvType').addEventListener('change', updateRule);
async function myLeaves(){
  const id=$('lvEmp').value.trim(); if(!id){ $('lvMine').innerHTML=''; LUSAGE={}; updateRule(); return; }
  try{ LUSAGE = await HR.getLeaveUsage(id); }catch(e){ LUSAGE={}; }
  updateRule();
  try{ const rows=await HR.myLeaves(id);
    $('lvMine').innerHTML = rows.length ? '<b>คำขอล่าสุด</b>'+rows.map(r=>{
      const st=r.status==='approved'?'<span style="color:#16a34a">✓ อนุมัติ</span>':r.status==='rejected'?'<span style="color:#dc2626">✗ ปฏิเสธ</span>':'<span style="color:#d97706">⏳ รออนุมัติ</span>';
      const range=(r.end_date&&r.end_date!==r.start_date)?(r.start_date+' – '+r.end_date):r.start_date;
      const why=(r.status==='rejected'&&r.hr_note)?(' <span style="color:#dc2626">('+r.hr_note+')</span>'):'';
      return `<div style="padding:2px 0">• ${range} · ${r.type||''} — ${st}${why}</div>`;
    }).join('') : '<span style="color:#9ca3af">ยังไม่มีคำขอ</span>';
  }catch(e){ $('lvMine').innerHTML=''; }
}
$('lvSubmit').onclick=async()=>{
  const id=$('lvEmp').value.trim();
  if(!id){ toast('err','กรอกรหัสพนักงาน'); return; }
  const start=$('lvStart').value, end=$('lvEnd').value, type=$('lvType').value, reason=$('lvReason').value.trim();
  if(!start){ toast('err','เลือกวันที่เริ่มลา'); return; }
  if(end&&end<start){ toast('err','วันสิ้นสุดต้องไม่ก่อนวันเริ่ม'); return; }
  $('lvSubmit').disabled=true; $('lvSubmit').textContent='กำลังส่ง…';
  try{ await HR.requestLeave({ empId:id, start_date:start, end_date:end||start, type, reason, doc:LDOC });
    toast('ok','ส่งคำขอลาแล้ว รอ HR อนุมัติ'); $('lvReason').value=''; LDOC=null; $('lvDoc').value=''; $('lvDocPrev').style.display='none'; myLeaves();
  }catch(e){ toast('err', e.message||'ส่งไม่สำเร็จ'); }
  $('lvSubmit').disabled=false; $('lvSubmit').textContent='ส่งคำขอลา';
};
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
