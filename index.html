<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบ HR 7-Eleven</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--green:#16a34a;--orange:#ea580c;--ink:#1f2937;--bg:#f3f4f6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Anuphan',system-ui,sans-serif;background:var(--bg);color:var(--ink);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.08);
        padding:40px 32px;max-width:420px;width:100%;text-align:center}
  h1{font-size:24px;font-weight:700;margin-bottom:4px}
  p.sub{color:#6b7280;font-size:14px;margin-bottom:28px}
  a.btn{display:block;text-decoration:none;color:#fff;font-weight:600;font-size:17px;
        padding:18px;border-radius:14px;margin-bottom:14px;transition:transform .1s}
  a.btn:active{transform:scale(.98)}
  .emp{background:var(--green)}
  .hr{background:var(--orange)}
  .ico{font-size:22px;margin-right:8px}
  .foot{margin-top:18px;font-size:12px;color:#9ca3af}
</style>
</head>
<body>
  <div class="card">
    <h1>ระบบบริหารบุคลากร</h1>
    <p class="sub">7-Eleven HR System</p>
    <a class="btn emp" href="./employee/"><span class="ico">📍</span>พนักงาน — ลงเวลา</a>
    <a class="btn hr" href="./hr/"><span class="ico">🗂️</span>ฝ่าย HR — จัดการ</a>
    <div class="foot">กล้องและ GPS ทำงานบน HTTPS เท่านั้น</div>
  </div>
</body>
</html>
