<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00703c">
<title>งานผลัด · 7-Eleven</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--green:#00703c;--green-d:#00582f;--green-soft:#e7f3ec;--orange:#f5821f;--red:#e11f26;--bg:#eef1ec;--line:#dbe2dc;--muted:#6b756d;--txt:#1b2a20;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Anuphan',sans-serif;background:var(--bg);color:var(--txt);min-height:100dvh;}
  .wrap{max-width:480px;margin:0 auto;min-height:100dvh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.06);}
  .top{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;padding:18px;display:flex;align-items:center;gap:12px;}
  .top .ic{font-size:24px;} .top h1{font-size:18px;font-weight:600;flex:1;}
  .home{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.15);padding:6px 11px;border-radius:9px;}
  .body{padding:18px;flex:1;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 2px;font-weight:500;}
  input[type=text],textarea,select{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:11px;padding:12px 13px;background:#fff;color:var(--txt);}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
  textarea{resize:vertical;min-height:48px;}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:transform .08s;}
  .btn:active{transform:scale(.98);}
  .btn-pri{background:var(--green);color:#fff;} .btn-sec{background:#fff;color:var(--txt);border:1.5px solid var(--line);}
  .btn-danger{background:#fff;color:var(--red);border:1.5px solid #f1bcbe;} .btn-warn{background:#fff7ed;color:#9a3412;border:1.5px solid #fed7aa;}
  .btn-sm{padding:9px 12px;font-size:14px;width:auto;}
  .row2{display:flex;gap:8px;} .row2>*{flex:1;}
  .who{display:flex;align-items:center;gap:12px;background:var(--green-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;}
  .who .nm{font-weight:600;font-size:16px;} .who .sub{font-size:12.5px;color:var(--green-d);}
  .who .ch{margin-left:auto;font-size:12.5px;color:var(--green-d);background:#fff;border:1px solid var(--green-soft);padding:5px 10px;border-radius:8px;cursor:pointer;}
  h3.sec{font-size:13px;color:var(--green-d);font-weight:700;margin:16px 2px 8px;}
  .pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;}
  .ok{background:var(--green-soft);color:var(--green-d);} .bad{background:#fdeaea;color:var(--red);} .warn{background:#fff4e0;color:#a06515;} .muted2{background:#eef0ec;color:var(--muted);}
  .photo{width:100%;border-radius:11px;border:1px solid var(--line);margin-top:8px;display:none;}
  .thumbs{display:flex;gap:6px;overflow-x:auto;padding:2px 0;margin-top:6px;-webkit-overflow-scrolling:touch;}
  .thumbs img{height:66px;border-radius:8px;flex:none;border:1px solid var(--line);cursor:pointer;}
  .listrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:8px;}
  .listrow .t{flex:1;font-size:14.5px;}
  .muted{color:var(--muted);font-size:13.5px;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:12px 18px;border-radius:11px;color:#fff;font-weight:500;font-size:14.5px;display:none;z-index:50;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.18);text-align:center;}
  .toast.ok{background:var(--green);} .toast.err{background:var(--red);} .toast.show{display:block;}
  .hide{display:none;} .spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .mainbtn{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;font-size:16px;font-weight:600;width:100%;text-align:left;}
  .mainbtn .e{font-size:22px;} .mainbtn .d{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px;}
  .mainbtn.pri{background:var(--green);color:#fff;border-color:var(--green);} .mainbtn.pri .d{color:#d7e7dd;}
  .imgbtn{display:block;width:100%;padding:0;margin:0 0 12px;border:none;background:none;cursor:pointer;border-radius:14px;}
  .imgbtn img{display:block;width:100%;height:auto;border-radius:14px;}
  .imgbtn:active{transform:scale(.99);}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="ic">🔄</span><h1>งานผลัด</h1><a class="home" href="../">🏠 หน้าแรก</a></div>
  <div class="body">

    <div id="step_id">

      <div id="m1_gate"></div>

          <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-weight:400;font-size:13px;cursor:pointer"><input type="checkbox" id="l_addx" style="width:auto"> เพิ่มคนข้ามสาขา (มาช่วยจากสาขาอื่น)</label>
        </div>
        <h3 class="sec">แจกงานให้คนในผลัด</h3>
        <div id="l_board"></div>
      </div>
    </div>

    <!-- menu2: my assignments -->
    <div id="step_m2" class="hide">
      <div class="who"><div><div class="nm" id="my_nm">—</div><div class="sub" id="my_sub"></div></div><span class="ch" id="my_back">‹ เมนู</span></div>
      <div id="my_body"><div class="card muted">กำลังโหลด…</div></div>

    <!-- menu3: review previous shift -->
    <div id="step_m3" class="hide">
      <div class="who"><div><div class="nm" id="pv_nm">—</div><div class="sub" id="pv_sub"></div></div><span class="ch" id="pv_back">‹ เมนู</span></div>
      <div id="pv_body"><div class="card muted">กำลังโหลด…</div></div>
    </div>

    <!-- goods receiving -->
    <div id="step_goods" class="hide">
      <div class="who"><div><div class="nm" id="gd_nm">—</div><div class="sub" id="gd_sub"></div></div><span class="ch" id="gd_back">‹ เมนู</span></div>
      <div id="gd_body"><div class="card muted">กำลังโหลด…</div></div>
    </div>

    <!-- report -->
    <div id="step_report" class="hide">
      <div class="who"><div><div class="nm">รายงานรับส่งผลัด</div><div class="sub" id="rp_branch"></div></div><span class="ch" id="rp_back">‹ เมนู</span></div>
      <div class="card" style="padding:12px"><label>วันที่</label><input id="rp_date" type="date"><div style="height:8px"></div><button class="btn btn-pri btn-sm" id="rp_go" style="width:100%">ดูรายงาน</button></div>

<script>
const $=id=>document.getElementById(id);
function toast(t,m){const e=$('toast');e.textContent=m;e.className='toast show '+(t||'ok');setTimeout(()=>e.className='toast',3000);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function show(id){['step_id','step_menu','step_m1','step_m2','step_m3','step_goods','step_report'].forEach(s=>$(s).classList.add('hide'));$(id).classList.remove('hide');}
function fmt(t){try{return new Date(t).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'});}catch(e){return '';}}
function ST(s){return s==='approved'?['ผ่านแล้ว','ok']:s==='submitted'?['รอตรวจ','warn']:s==='sent_back'?['ตีกลับ','bad']:['มอบหมายแล้ว','muted2'];}
// ★ ย่อรูป + ปั๊มวันเวลาก่อนอัปโหลด
//   เดิม: ถ้าเครื่องถอดรหัสรูปไม่ได้ (HEIC จากไอโฟน / ไฟล์ใหญ่เกิน / แรมไม่พอ) img.onload จะไม่ยิงเลย
//   → Promise ค้างตลอดกาล → รูปหายเงียบ ๆ โดยไม่มี error (พนักงานคิดว่าแนบแล้ว แต่ในระบบไม่มีรูป)
//   ใหม่: มี onerror + timeout + fallback ใช้ไฟล์ต้นฉบับ · ถอดรหัสไม่ได้จริง ๆ จะคืน null เพื่อให้ฟ้องได้
function resizeFile(file){
  return new Promise(res=>{
    let done=false;
    const finish=(v)=>{ if(done) return; done=true; res(v); };
    const to=setTimeout(()=>finish(null), 15000);          // กันค้างถาวร

    const r=new FileReader();
    r.onerror=()=>{ clearTimeout(to); finish(null); };
    r.onload=ev=>{
      const raw=ev.target.result;
      const img=new Image();
      // ถอดรหัสรูปไม่ได้ → ใช้ไฟล์ต้นฉบับไปเลย ถ้าเป็น jpeg/png (ถ้าเป็น HEIC จะคืน null ให้ฟ้อง)
      img.onerror=()=>{ clearTimeout(to); finish(/^data:image\/(jpeg|jpg|png)/i.test(String(raw))?raw:null); };
      img.onload=()=>{
        clearTimeout(to);
        try{
          const max=1000,sc=Math.min(1,max/Math.max(img.width,img.height));
          const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
          const x=c.getContext('2d'); x.drawImage(img,0,0,c.width,c.height);
          // ปั๊มวันเวลา + สาขา + ผู้ถ่าย ลงบนรูป (กันใช้รูปซ้ำ/รูปเก่า)
          try{
            const now=new Date();
            const ts=now.toLocaleString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' น.';
            const sub=(typeof EMP!=='undefined'&&EMP)?((EMP.nickname||EMP.name||'')+' · '+branchName(EMP.branch_id)):'';
            const pad=Math.round(c.width*0.022), fs=Math.max(13,Math.round(c.width*0.033));
            const bh=fs*2+pad*2.4;
            x.fillStyle='rgba(0,0,0,.5)'; x.fillRect(0,c.height-bh,c.width,bh);
            x.textBaseline='alphabetic'; x.fillStyle='#fff';
            x.font='700 '+fs+'px Anuphan,Sarabun,sans-serif'; x.fillText(ts, pad, c.height-fs-pad*0.6);
            if(sub){ x.font='400 '+Math.round(fs*0.8)+'px Anuphan,Sarabun,sans-serif'; x.fillText(sub, pad, c.height-pad*0.7); }
          }catch(e){}
          const out=c.toDataURL('image/jpeg',0.85);         // ★ บังคับเป็น JPEG เสมอ (LINE ไม่รองรับ HEIC/WebP)
          finish(/^data:image\/jpeg/i.test(out) ? out : (/^data:image\/(jpeg|jpg|png)/i.test(String(raw))?raw:null));
        }catch(e){ finish(/^data:image\/(jpeg|jpg|png)/i.test(String(raw))?raw:null); }
      };
      img.src=raw;
    };
    r.readAsDataURL(file);
  });
}
// ★ คืนเฉพาะรูปที่แปลงสำเร็จ + ฟ้องทันทีถ้ามีรูปที่ใช้ไม่ได้ (เดิมหายเงียบ)
async function filesToData(files){
  const out=[]; let failed=0;
  for(const f of files){
    const d=await resizeFile(f);
    if(d) out.push(d); else failed++;
  }
  if(failed){
    toast('err', failed+' รูปใช้ไม่ได้ (ไฟล์เสีย หรือเป็นไฟล์ HEIC จากไอโฟน) — ให้ถ่ายใหม่ด้วยกล้องในแอป หรือตั้งกล้องไอโฟนเป็น "รูปแบบที่เข้ากันได้มากที่สุด"');
  }
  return out;
}
function thumbsHtml(photos){if(!photos||!photos.length)return '';return '<div class="thumbs">'+photos.map(u=>'<img src="'+esc(u)+'" onclick="lightbox(this)">').join('')+'</div>';}
// กล่องขยายรูป (lightbox) แบบ gallery — เลื่อนซ้าย-ขวา / ปัดนิ้ว / ลูกศร / ตัวนับ
let LB={imgs:[],idx:0};
function ensureLightbox(){
  if(document.getElementById('lightbox')) return;
  const o=document.createElement('div'); o.id='lightbox';
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99999;display:none;align-items:center;justify-content:center;touch-action:pan-y';
  o.innerHTML='<button id="lbClose" style="position:absolute;top:14px;right:16px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:22px;cursor:pointer">×</button>'
    +'<button id="lbPrev" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:28px;cursor:pointer">‹</button>'
    +'<img id="lightboxImg" style="max-width:92%;max-height:88%;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5)">'
    +'<button id="lbNext" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:28px;cursor:pointer">›</button>'
    +'<div id="lbCount" style="position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;padding:5px 14px;border-radius:999px;font-size:13px"></div>';
  document.body.appendChild(o);
  o.addEventListener('click',e=>{ if(e.target===o) o.style.display='none'; });
  document.getElementById('lbClose').onclick=()=>{ o.style.display='none'; };
  document.getElementById('lbPrev').onclick=e=>{ e.stopPropagation(); lbStep(-1); };
  document.getElementById('lbNext').onclick=e=>{ e.stopPropagation(); lbStep(1); };
  document.addEventListener('keydown',e=>{ if(o.style.display!=='flex') return; if(e.key==='ArrowLeft') lbStep(-1); else if(e.key==='ArrowRight') lbStep(1); else if(e.key==='Escape') o.style.display='none'; });
  let sx=0; o.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true});
  o.addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40) lbStep(dx<0?1:-1); });
}
function lbStep(d){ if(!LB.imgs.length) return; LB.idx=(LB.idx+d+LB.imgs.length)%LB.imgs.length; showLB(); }
function showLB(){
  document.getElementById('lightboxImg').src=LB.imgs[LB.idx];
  const multi=LB.imgs.length>1;
  document.getElementById('lbPrev').style.display=multi?'':'none';
  document.getElementById('lbNext').style.display=multi?'':'none';
  const c=document.getElementById('lbCount'); c.style.display=multi?'':'none'; c.textContent=(LB.idx+1)+' / '+LB.imgs.length;
}
function lightbox(imgEl){
  ensureLightbox();
  const cont=imgEl.parentElement;
  LB.imgs=[...cont.querySelectorAll('img')].map(i=>i.src);
  LB.idx=Math.max(0, LB.imgs.indexOf(imgEl.src));
  showLB();
  document.getElementById('lightbox').style.display='flex';
}
// ===== ร่างงานค้าง (WIP) — กันรูป/หมายเหตุหายเวลาสลับแอป/รีโหลด/คนอื่นหยิบมือถือไปใช้ =====
//   เก็บลง IndexedDB (รองรับรูปขนาดใหญ่) · กลับมาทำต่อได้โดยไม่ต้องถ่ายใหม่ · ลบเมื่อส่งงานสำเร็จ
const WIP_DB='hr_wip', WIP_ST='drafts';
function wipOpen(){ return new Promise((res,rej)=>{ let r; try{ r=indexedDB.open(WIP_DB,1);}catch(e){ return rej(e); } r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains(WIP_ST)) db.createObjectStore(WIP_ST); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function wipSave(key,val){ try{ const db=await wipOpen(); await new Promise((res,rej)=>{ const tx=db.transaction(WIP_ST,'readwrite'); tx.objectStore(WIP_ST).put({...val,at:Date.now()},key); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }catch(e){} }
async function wipGet(key){ try{ const db=await wipOpen(); return await new Promise(res=>{ const tx=db.transaction(WIP_ST,'readonly'); const g=tx.objectStore(WIP_ST).get(key); g.onsuccess=()=>res(g.result||null); g.onerror=()=>res(null); }); }catch(e){ return null; } }
async function wipDel(key){ try{ const db=await wipOpen(); await new Promise(res=>{ const tx=db.transaction(WIP_ST,'readwrite'); tx.objectStore(WIP_ST).delete(key); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} }
async function wipCleanup(maxAgeMs){ try{ const db=await wipOpen(); const tx=db.transaction(WIP_ST,'readwrite'); const st=tx.objectStore(WIP_ST); st.openCursor().onsuccess=e=>{ const c=e.target.result; if(!c) return; const v=c.value; if(!v||!v.at||(Date.now()-v.at)>maxAgeMs) st.delete(c.key); c.continue(); }; }catch(e){} }
function taskDraftSave(id){ wipSave('t:'+id,{ photos:TASK_PHOTOS[id]||[], note:($('mn_'+id)||{}).value||'' }); }
try{ wipCleanup(3*86400000); }catch(e){}   // ล้างร่างเก่าเกิน 3 วัน

// ===== แนบรูปงานแบบหลายรูป (ถ่ายทีละรูปสะสม / เลือกหลายรูปได้) =====
let TASK_PHOTOS={};
function renderTaskThumbs(id){
  const arr=TASK_PHOTOS[id]||[]; const t=$('mt_'+id); const c=$('mc_'+id);
  if(t) t.innerHTML=arr.map((u,i)=>'<span style="position:relative;display:inline-block;margin:0 6px 6px 0"><img src="'+esc(u)+'" style="width:56px;height:56px;object-fit:cover;border-radius:8px;display:block"><button type="button" onclick="rmTaskPhoto('+id+','+i+')" style="position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;cursor:pointer">×</button></span>').join('');
  if(c) c.textContent = arr.length ? ('แนบแล้ว '+arr.length+' รูป') : 'ยังไม่ได้แนบรูป';
}
function rmTaskPhoto(id,i){ if(TASK_PHOTOS[id]){ TASK_PHOTOS[id].splice(i,1); renderTaskThumbs(id); taskDraftSave(id); } }
function wireTaskInput(inpId, taskId){
  const inp=$(inpId); if(!inp) return;
  inp.addEventListener('change',async()=>{
    if(!inp.files||!inp.files.length) return;
    const added=await filesToData(inp.files);
    TASK_PHOTOS[taskId]=(TASK_PHOTOS[taskId]||[]).concat(added);
    inp.value='';            // เคลียร์เพื่อให้ถ่าย/เลือกเพิ่มได้อีก
    renderTaskThumbs(taskId);
    taskDraftSave(taskId);   // ★ เก็บร่างทันทีหลังถ่ายรูป — สลับแอปแล้วกลับมาได้
  });
}

let EMP=null, BRANCHES={};
async function loadBranches(){ try{ const c=await window.HR.loadConfig(); (c.branches||[]).forEach(b=>BRANCHES[b.branch_id]=b.name); }catch(e){} }
function branchName(id){ return BRANCHES[id]||id||'(ไม่มีสาขาประจำ)'; }

// ======================================================================
// ประตูรับทราบ "การดำเนินการทางวินัย" — ตักเตือนวาจา / ลายลักษณ์อักษร / ใบเตือน
// ต้องอ่านและกดรับทราบก่อนใช้งาน (เก็บเวลา + อุปกรณ์เป็นหลักฐาน)
// ======================================================================
let DISC_QUEUE=[], DISC_IDX=0, DISC_RESOLVE=null;
const DISC_LABEL={ verbal:'ตักเตือนด้วยวาจา', written:'ตักเตือนลายลักษณ์อักษร', warning:'ใบเตือน', coaching:'คุยปรับพฤติกรรม', note:'บันทึกเพิ่มเติม' };
const DISC_COLOR={ verbal:['#fef3c7','#92400e'], written:['#ffedd5','#c2410c'], warning:['#fee2e2','#b91c1c'], coaching:['#e0f2fe','#0369a1'], note:['#f1f5f9','#334155'] };

function ensureDiscOverlay(){
  if(document.getElementById('discOverlay')) return;
  const o=document.createElement('div'); o.id='discOverlay';
  o.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.97);z-index:100003;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px';
  o.innerHTML=
    '<div style="max-width:520px;width:100%;background:var(--card,#fff);border-radius:16px;padding:18px;margin:auto;box-shadow:0 10px 40px rgba(0,0,0,.45)">'
    +'<div id="discStep" style="font-size:12.5px;color:#64748b;font-weight:600;margin-bottom:6px"></div>'
    +'<div id="discBadge" style="display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:800;margin-bottom:10px"></div>'
    +'<div id="discBox" style="border:1px solid var(--line,#e2e8f0);border-radius:12px;padding:12px;margin-bottom:12px">'
      +'<div style="font-size:12px;color:#64748b;font-weight:700;margin-bottom:4px">สาเหตุ</div>'
      +'<div id="discReason" style="font-size:15px;line-height:1.6;white-space:pre-wrap;font-weight:600"></div>'
      +'<div id="discDetail" style="font-size:13.5px;line-height:1.6;white-space:pre-wrap;color:#475569;margin-top:8px"></div>'
      +'<div id="discStats" style="font-size:12.5px;color:#475569;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line,#e2e8f0)"></div>'
      +'<div id="discPhotos" class="thumbs" style="margin-top:8px"></div>'
    +'</div>'
    +'<div id="discBy" style="font-size:12px;color:#94a3b8;margin-bottom:12px"></div>'
    +'<textarea id="discNote" rows="2" placeholder="ความเห็นของคุณ (ไม่บังคับ)" style="width:100%;padding:9px 11px;border:1.5px solid var(--line,#e2e8f0);border-radius:9px;font:inherit;font-size:14px;resize:vertical;margin-bottom:10px"></textarea>'
    +'<div id="discErr" style="display:none;color:#dc2626;font-size:13.5px;font-weight:600;margin-bottom:10px"></div>'
    +'<button id="discAckBtn" style="width:100%;padding:14px;border:0;border-radius:12px;background:#0f172a;color:#fff;font-size:16px;font-weight:800;cursor:pointer">✓ ข้าพเจ้ารับทราบแล้ว</button>'
    +'<div style="text-align:center;font-size:11.5px;color:#94a3b8;margin-top:10px">ระบบจะบันทึกวันเวลาและอุปกรณ์ที่กดรับทราบไว้เป็นหลักฐาน</div>'
    +'</div>';
  document.body.appendChild(o);
  document.getElementById('discAckBtn').onclick=discDoAck;
}

function discRender(){
  const a=DISC_QUEUE[DISC_IDX]; if(!a) return;
  const c=DISC_COLOR[a.action_type]||DISC_COLOR.note;
  document.getElementById('discStep').textContent='รายการที่ต้องรับทราบ '+(DISC_IDX+1)+' / '+DISC_QUEUE.length;
  const bd=document.getElementById('discBadge');
  bd.textContent = (a.action_type==='warning' ? '📄 ' : '⚠️ ') + (a.level_name || DISC_LABEL[a.action_type] || 'การดำเนินการทางวินัย') + (a.warning_id ? (' · เลขที่ '+a.warning_id) : '');
  bd.style.background=c[0]; bd.style.color=c[1];
  document.getElementById('discReason').textContent = a.reason || '—';
  const dt=document.getElementById('discDetail');
  dt.textContent = a.detail || ''; dt.style.display = a.detail ? 'block' : 'none';

  const bits=[];
  if(a.score!=null) bits.push('คะแนน '+a.score+(a.band_label?(' · '+a.band_label):''));
  if(a.late_count!=null) bits.push('สาย '+a.late_count+' ครั้ง'+(a.late_total?(' ('+a.late_total+' นาที)'):''));
  if(a.absent_count!=null) bits.push('ขาด '+a.absent_count+' วัน');
  const st=document.getElementById('discStats');
  st.textContent = bits.join(' · '); st.style.display = bits.length ? 'block' : 'none';

  const ph=Array.isArray(a.photos)?a.photos:[];
  document.getElementById('discPhotos').innerHTML = ph.length ? ph.map(u=>'<img src="'+esc(u)+'" onclick="lightbox(this)">').join('') : '';

  const who = a.performed_role==='mgr' ? 'ผู้จัดการ' : 'สำนักงาน';
  document.getElementById('discBy').textContent = 'โดย '+(a.performed_by||who)+' · '+fmt(a.performed_at);
  document.getElementById('discNote').value='';
  document.getElementById('discErr').style.display='none';
  const btn=document.getElementById('discAckBtn');
  btn.disabled=false; btn.textContent='✓ ข้าพเจ้ารับทราบแล้ว';
  const o=document.getElementById('discOverlay');
  o.style.display='flex'; o.scrollTop=0;
}

async function discDoAck(){
  const a=DISC_QUEUE[DISC_IDX]; if(!a) return;
  const btn=document.getElementById('discAckBtn'), err=document.getElementById('discErr');
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  const r=await window.HR.ackDiscAction(a.id, EMP.emp_id, document.getElementById('discNote').value.trim());
  if(!r.ok){
    err.textContent=r.error||'บันทึกไม่สำเร็จ'; err.style.display='block';
    btn.disabled=false; btn.textContent='✓ ข้าพเจ้ารับทราบแล้ว';
    return;
  }
  DISC_IDX++;
  if(DISC_IDX>=DISC_QUEUE.length){
    document.getElementById('discOverlay').style.display='none';
    const done=DISC_RESOLVE; DISC_RESOLVE=null;
    toast('ok','บันทึกการรับทราบแล้ว');
    if(done) done(true);
  } else discRender();
}

async function ensureDiscAcked(emp){
  let pend=[];
  try{ pend=await window.HR.getPendingDiscAcks(emp.emp_id); }catch(e){ return true; }
  if(!pend.length) return true;
  ensureDiscOverlay();
  DISC_QUEUE=pend; DISC_IDX=0;
  return new Promise(res=>{ DISC_RESOLVE=res; discRender(); });
}

// ======================================================================
// ประตูรับทราบประกาศ — ต้องอ่าน+กดรับทราบก่อนเข้าเมนูรับส่งผลัด
//   important  = กดรับทราบ
//   mandatory  = กดรับทราบ + ตอบคำถามยืนยันความเข้าใจให้ถูก
// ======================================================================
let ANN_QUEUE=[], ANN_IDX=0, ANN_RESOLVE=null;

function ensureAnnOverlay(){
  if(document.getElementById('annOverlay')) return;
  const o=document.createElement('div'); o.id='annOverlay';
  o.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.96);z-index:100001;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px';
  o.innerHTML=
    '<div style="max-width:520px;width:100%;background:var(--card,#fff);border-radius:16px;padding:18px;margin:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)">'
    +'<div id="annStep" style="font-size:12.5px;color:#64748b;font-weight:600;margin-bottom:6px"></div>'
    +'<div id="annBadge" style="display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;margin-bottom:8px"></div>'
    +'<div id="annTitle" style="font-size:18px;font-weight:800;line-height:1.4;margin-bottom:8px"></div>'
    +'<div id="annMsg" style="font-size:15px;line-height:1.65;white-space:pre-wrap;margin-bottom:14px"></div>'
    +'<div id="annQuiz" style="display:none;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;margin-bottom:12px">'
      +'<div style="font-weight:700;font-size:14px;margin-bottom:8px">❓ คำถามยืนยันความเข้าใจ</div>'
      +'<div id="annQuizQ" style="font-size:14.5px;margin-bottom:10px"></div>'
      +'<div id="annQuizOpts"></div>'
    +'</div>'
    +'<div id="annErr" style="display:none;color:#dc2626;font-size:13.5px;font-weight:600;margin-bottom:10px"></div>'
    +'<button id="annAckBtn" style="width:100%;padding:14px;border:0;border-radius:12px;background:#16a34a;color:#fff;font-size:16px;font-weight:800;cursor:pointer">✓ รับทราบแล้ว</button>'
    +'<div style="text-align:center;font-size:12px;color:#94a3b8;margin-top:10px">ต้องกดรับทราบก่อนจึงจะใช้งานหน้ารับส่งผลัดได้</div>'
    +'</div>';
  document.body.appendChild(o);
  document.getElementById('annAckBtn').onclick=annDoAck;
}

function annRender(){
  const a=ANN_QUEUE[ANN_IDX]; if(!a) return;
  const o=document.getElementById('annOverlay');
  const mand=a.priority==='mandatory';
  document.getElementById('annStep').textContent='ประกาศที่ต้องรับทราบ '+(ANN_IDX+1)+' / '+ANN_QUEUE.length;
  const bd=document.getElementById('annBadge');
  bd.textContent = mand ? '🔴 บังคับ — ต้องรับทราบ' : '🟠 สำคัญ — ต้องรับทราบ';
  bd.style.background = mand ? '#fee2e2' : '#ffedd5';
  bd.style.color      = mand ? '#b91c1c' : '#c2410c';
  document.getElementById('annTitle').textContent = a.title || 'ประกาศจากผู้จัดการ';
  document.getElementById('annMsg').textContent   = a.message || '';
  document.getElementById('annErr').style.display='none';

  const qz=document.getElementById('annQuiz');
  const choices=Array.isArray(a.quiz_choices)?a.quiz_choices:[];
  if(a.quiz_q && choices.length){
    qz.style.display='block';
    document.getElementById('annQuizQ').textContent=a.quiz_q;
    document.getElementById('annQuizOpts').innerHTML=choices.map((c,i)=>
      '<label style="display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--line,#e2e8f0);border-radius:9px;margin-bottom:6px;cursor:pointer;background:#fff">'
      +'<input type="radio" name="annq" value="'+i+'" style="margin-top:3px">'
      +'<span style="font-size:14.5px">'+esc(String(c))+'</span></label>').join('');
  } else { qz.style.display='none'; document.getElementById('annQuizOpts').innerHTML=''; }

  document.getElementById('annAckBtn').textContent='✓ รับทราบแล้ว';
  document.getElementById('annAckBtn').disabled=false;
  o.style.display='flex';
  o.scrollTop=0;
  // บันทึกว่าเปิดอ่านแล้ว (แยกจาก "กดรับทราบ")
  try{ window.HR.markAnnouncementOpened(a.id, EMP.emp_id, EMP.nickname||EMP.name, EMP.branch_id); }catch(_e){}
}

async function annDoAck(){
  const a=ANN_QUEUE[ANN_IDX]; if(!a) return;
  const btn=document.getElementById('annAckBtn');
  const err=document.getElementById('annErr');
  const sel=document.querySelector('input[name="annq"]:checked');
  const hasQuiz=!!(a.quiz_q && Array.isArray(a.quiz_choices) && a.quiz_choices.length);
  if(hasQuiz && !sel){ err.textContent='กรุณาเลือกคำตอบก่อน'; err.style.display='block'; return; }
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  const r=await window.HR.ackAnnouncement(a.id, EMP.emp_id, EMP.nickname||EMP.name, EMP.branch_id, sel?Number(sel.value):null);
  if(!r.ok){
    err.textContent=r.error||'บันทึกไม่สำเร็จ'; err.style.display='block';
    btn.disabled=false; btn.textContent='✓ รับทราบแล้ว';
    return;
  }
  ANN_IDX++;
  if(ANN_IDX>=ANN_QUEUE.length){
    document.getElementById('annOverlay').style.display='none';
    const done=ANN_RESOLVE; ANN_RESOLVE=null;
    toast('ok','รับทราบประกาศครบแล้ว');
    if(done) done(true);
  } else annRender();
}

// คืน true เมื่อรับทราบครบ (หรือไม่มีประกาศค้าง)
async function ensureAnnouncementsAcked(emp){
  let pend=[];
  try{ pend=await window.HR.getPendingAnnouncements(emp.emp_id, emp.branch_id); }catch(e){ return true; }  // โหลดไม่ได้ = ไม่บล็อก
  if(!pend.length) return true;
  ensureAnnOverlay();
  ANN_QUEUE=pend; ANN_IDX=0;
  return new Promise(res=>{ ANN_RESOLVE=res; annRender(); });
}

$('goBtn').onclick=async()=>{
  const id=$('empId').value.trim(); if(!id){ toast('err','กรอกรหัสพนักงาน'); return; }
  $('goBtn').innerHTML='<span class="spin"></span>';
  try{
    const emp=await window.HR.lookupEmployee(id);
    if(!emp){ toast('err','ไม่พบรหัสพนักงานนี้'); $('goBtn').textContent='เริ่ม'; return; }
    if(emp.active===false){ toast('err','รหัสนี้ถูกปิดใช้งาน'); $('goBtn').textContent='เริ่ม'; return; }
    EMP=emp;
    try{ HRSession.setEmp(emp.emp_id); }catch(_e){}   // จำรหัสข้ามหน้า
    $('m_nm').textContent=emp.nickname||emp.name;
    $('m_sub').textContent='รหัส '+emp.emp_id+' · '+branchName(emp.branch_id);
    $('goBtn').textContent='เริ่ม';
    // ★ ประตูที่ 1: การดำเนินการทางวินัย (ตักเตือน/ใบเตือน) — สำคัญที่สุด ต้องรับทราบก่อน
    await ensureDiscAcked(emp);
    // ★ ประตูที่ 2: ประกาศ (ข้อความ) — ต้องอ่าน+รับทราบให้ครบก่อนถึงจะเข้าเมนูได้
    await ensureAnnouncementsAcked(emp);
    // ★ ประกาศรูปภาพ — สไลด์ลอยขึ้นมา เลื่อนซ้าย-ขวาได้ ไม่ต้องกดรับทราบ (วันละครั้ง)
    try{ if(window.ANN) await window.ANN.show(emp); }catch(_e){}
    show('step_menu');
    refreshGoodsBtn();       // แสดงปุ่มรับสินค้าเฉพาะผู้คุมผลัด / ปุ่มกดรับตอนยังว่าง
    refreshSpBadge();        // นับงานพิเศษค้าง แสดง badge บนปุ่ม "งานที่ได้รับมอบหมาย"
    refreshCoCard();         // การ์ดเตือนกดออก/ควบกะ
    if(window.refreshNotifyBtn) window.refreshNotifyBtn();
  }catch(e){ toast('err','เกิดข้อผิดพลาด'); }
  $('goBtn').textContent='เริ่ม';
};

  let info; try{ info=await window.HR.leaderInfo(EMP.emp_id); }catch(e){ $('m1_gate').innerHTML='<div class="card muted">'+esc(e.message||'โหลดไม่สำเร็จ')+'</div>'; return; }
  $('l_nm').textContent=EMP.nickname||EMP.name;

    +(cur?('<div style="margin-bottom:8px">หัวหน้าผลัดวันนี้คือ <b>'+esc(cur.name)+'</b></div><div class="muted" style="margin-bottom:12px">ถ้าจะรับช่วงคุมผลัดแทน กดยืนยันด้านล่าง (คนในผลัดเปลี่ยนกันได้)</div>')
        :('<div style="margin-bottom:8px">กะนี้ยังไม่มีหัวหน้าผลัด</div><div class="muted" style="margin-bottom:12px">กดยืนยันเพื่อรับผิดชอบคุมผลัดทั้งหมดในกะนี้</div>'))
    +'<button class="btn btn-pri" id="l_confirm">'+(cur?'รับช่วงคุมผลัดแทน':'ยืนยันรับผิดชอบคุมผลัด')+'</button></div>';
  $('l_confirm').onclick=async()=>{
    if(!confirm('ยืนยันรับผิดชอบเป็นหัวหน้าผลัดกะนี้?')) return;
    try{ await window.HR.leaderConfirm(EMP.emp_id); toast('ok','รับเป็นหัวหน้าผลัดแล้ว'); $('m1_gate').innerHTML=''; openLeaderPanel(); }
    catch(e){ toast('err',(e.message||'ไม่สำเร็จ')); }
  };
}
let LBOARD=null;
async function openLeaderPanel(){
  $('m1_panel').classList.remove('hide');
  $('l_board').innerHTML='<div class="card muted">กำลังโหลด…</div>';
  let b; try{ b=await window.HR.getShiftBoard(EMP.emp_id, null); LBOARD=b; }catch(e){ $('l_board').innerHTML='<div class="card muted">'+esc(e.message||'')+'</div>'; return; }
  const inShift=new Set((b.members||[]).map(m=>m.emp_id));
  populateAddList();
  const memOpts=(b.members||[]).map(m=>'<option value="'+esc(m.emp_id)+'">'+esc(m.name)+'</option>').join('');
  if(!b.defs.length){ $('l_board').innerHTML='<div class="card muted">กะนี้ยังไม่มีรายการงาน (ผู้จัดการตั้งที่ "ตั้งค่ากะ")</div>'; return; }
  $('l_board').innerHTML=b.defs.map(d=>{
    const a=d.assignment; let body='<div style="font-weight:600;margin-bottom:6px">'+esc(d.title)+(d.require_photo?' <span class="pill muted2">📷</span>':'')+'</div>';
    if(a){ const s=ST(a.status); body+='<div style="margin-bottom:6px"><span class="pill '+s[1]+'">'+s[0]+'</span> <span class="muted">'+esc(a.emp_name||a.emp_id)+'</span></div>'; }
    if(!(b.members||[]).length) body+='<div class="muted">ยังไม่มีคนในกะ — เพิ่มคนด้านบนก่อน</div>';
    else body+='<div class="row2"><select id="lg_'+d.id+'">'+memOpts+'</select><button class="btn btn-sec btn-sm" style="flex:none" data-give="'+d.id+'">'+(a?'เปลี่ยน':'มอบ')+'</button></div>';
    return '<div class="card">'+body+'</div>';
  }).join('');
  document.querySelectorAll('[data-give]').forEach(btn=>btn.onclick=async()=>{

    if(a.status==='submitted') s=['รอผลัดถัดไปตรวจ','warn'];
    else if(a.status==='approved' && a.needs_mgr===true && !a.mgr_checked_at) s=['ผ่านผลัดถัดไป · รอ ผจก.','ok'];
    const min=(r.unassigned.find(x=>x.id===a.task_def_id)||{}).min_photos; // อาจ undefined → ใช้ require_photo
    let c='<div class="card"><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><div style="font-weight:600;flex:1">'+esc(a.title)+'</div><span class="pill '+s[1]+'">'+s[0]+'</span></div>';

    if(isEdit){ c+=flowStepsHTML(a); }
    if(!canDo) c+=flowStepsHTML(a)+thumbsHtml(a.photos);
    if(!canDo&&a.emp_note) c+='<div class="muted" style="margin-top:6px">หมายเหตุ: '+esc(a.emp_note)+'</div>';
    if(canDo){
      c+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">'

        +'<input type="text" id="mn_'+a.id+'" placeholder="หมายเหตุ (ถ้ามี)" value="'+esc(a.emp_note||'')+'" style="margin-bottom:8px">'
        +'<button class="btn btn-pri" data-sub="'+a.id+'">'+(isEdit?'อัปเดต / ส่งใหม่':'ส่งงาน')+'</button>';
    }

  }).join('');
  // งานที่ยังว่าง (รายการ)
  html+='<h3 class="sec">งานที่ยังว่าง (ดึงมาทำเองได้)</h3>';
  if(!r.unassigned.length) html+='<div class="muted" style="padding:4px 2px">ไม่มีงานว่าง</div>';
  else html+=r.unassigned.map(d=>'<div class="listrow"><div class="t">'+esc(d.title)+(d.min_photos>0?' <span class="pill muted2">📷'+d.min_photos+'</span>':'')+'</div><button class="btn btn-sec btn-sm" data-pull="'+d.id+'">ดึงมาทำ</button></div>').join('');
  // สถานะทีม
  html+='<h3 class="sec">สถานะทีมในผลัด</h3>';
  if(!r.team.length) html+='<div class="muted" style="padding:4px 2px">ยังไม่มีการมอบหมาย</div>';
  else html+='<div class="card">'+r.team.map(a=>{const s=ST(a.status);return '<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)"><div style="flex:1;font-size:13.5px">'+esc(a.title)+' <span class="muted">· '+esc(a.emp_name||a.emp_id)+'</span></div><span class="pill '+s[1]+'">'+s[0]+'</span></div>';}).join('')+'</div>';
  } else {

    html+='<h3 class="sec">งานของฉัน (ตามกะ)</h3><div class="card muted">'+esc(shiftErr||'วันนี้ยังไม่มีข้อมูลกะของคุณ')+'</div>';

  $('my_body').innerHTML=html;
  // สะสมรูป (ใช้ TASK_PHOTOS ร่วมกัน: งานตามกะใช้คีย์ตัวเลข, งานพิเศษใช้คีย์ 'sp_'+id)
  TASK_PHOTOS={};

  wireFixTasks(fx.rows||[]);
  // ===== wire งาน ผจก.มอบหมาย =====
  wireMgrTasks(mt.rows||[]);
  // ===== wire งานพิเศษ + badge =====
  wireSpecial(sp.rows||[]);
  updateSpBadge(sp.rows||[]);
  // ===== wire เชลฟ์ที่รับผิดชอบ =====
  wireMyShelves();

    r.mine.forEach(a=>{ if(a.status==='todo'||a.status==='sent_back'||a.status==='submitted'){

// ===== งานพิเศษจากผู้จัดการ: render + wire =====
function spST(s){ return s==='approved'?['ผ่านแล้ว','ok']:s==='submitted'?['รอตรวจ','warn']:s==='sent_back'?['ตีกลับ ต้องแก้','bad']:['ต้องทำ','muted2']; }
function fmtDeadline(dl){
  if(!dl) return '';
  const d=new Date(dl); const diff=d-new Date();
  const dtxt=d.toLocaleString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' น.';
  let tag='';
  if(diff<0) tag=' <span style="color:#dc2626;font-weight:700">· เลยกำหนดแล้ว</span>';
  else if(diff<24*3600*1000) tag=' <span style="color:#b45309;font-weight:700">· ใกล้ครบกำหนด</span>';
  return '<div class="muted" style="margin-top:2px">⏰ ครบกำหนด: '+dtxt+tag+'</div>';
}
function renderSpecialHTML(rows){
  if(!rows||!rows.length) return '';
  let h='<h3 class="sec">⭐ งานพิเศษจากผู้จัดการ</h3>';
  h+=rows.map(a=>{
    const s=spST(a.status); const canDo=(a.status==='todo'||a.status==='sent_back');
    let c='<div class="card" style="border-left:3px solid var(--green)"><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><div style="font-weight:700;flex:1">'+esc(a.title)+'</div><span class="pill '+s[1]+'">'+s[0]+'</span></div>';
    if(a.detail) c+='<div style="font-size:13.5px;margin-bottom:4px;white-space:pre-wrap">'+esc(a.detail)+'</div>';
    c+=fmtDeadline(a.deadline);
    if(a.hr_note) c+='<div class="muted" style="margin-top:4px">📝 หมายเหตุจากผู้จัดการ: '+esc(a.hr_note)+'</div>';
    if(a.hr_photos&&a.hr_photos.length) c+='<div style="margin-top:6px"><div class="muted" style="font-size:12px">รูปตัวอย่าง/อ้างอิงจากผู้จัดการ</div>'+thumbsHtml(a.hr_photos)+'</div>';
    if(a.status==='sent_back'&&a.review_note) c+='<div style="color:#b91c1c;font-size:13px;margin-top:8px">⚠️ ตีกลับ: '+esc(a.review_note)+(a.reviewer?(' (โดย '+esc(a.reviewer)+')'):'')+'</div>';
    if(a.status==='sent_back'&&Array.isArray(a.review_markup)&&a.review_markup.length) c+='<div style="color:#dc2626;font-size:12.5px;font-weight:700;margin:6px 0 4px">📍 จุดที่ต้องแก้ (ผู้ตรวจวาดชี้ไว้)</div>'+thumbsHtml(a.review_markup);
    if(!canDo){
      if(a.photos&&a.photos.length) c+='<div style="margin-top:8px"><div class="muted" style="font-size:12px">รูปที่คุณส่ง</div>'+thumbsHtml(a.photos)+'</div>';
      if(a.emp_note) c+='<div class="muted" style="margin-top:6px">หมายเหตุของคุณ: '+esc(a.emp_note)+'</div>';
      if(a.status==='submitted') c+='<div class="muted" style="margin-top:4px">⏳ รอผู้จัดการตรวจ'+(a.submitted_at?(' · ส่งเมื่อ '+fmt(a.submitted_at)):'')+'</div>';
    }
    if(canDo){
      c+='<div style="border-top:1px dashed var(--line);margin-top:10px;padding-top:10px">'
        +'<label class="btn btn-sec" style="font-size:13px;cursor:pointer">📷 ถ่ายรูปหลักฐาน<input type="file" accept="image/*" capture="environment" id="spfc_'+a.id+'" style="display:none"></label>'
        +'<div class="thumbs" id="spt_'+a.id+'" style="margin:6px 0 4px"></div>'
        +'<div class="muted" id="spc_'+a.id+'" style="margin-bottom:8px">ถ่ายรูปได้หลายรูป (บังคับกล้อง · สแตมป์ชื่อ/เวลา/สาขาอัตโนมัติ)</div>'
        +'<input type="text" id="spn_'+a.id+'" placeholder="หมายเหตุถึงผู้จัดการ (ถ้ามี)" style="margin-bottom:8px">'
        +'<button class="btn btn-pri" data-spsub="'+a.id+'">ส่งงาน</button>'
        +'</div>';
    }
    return c+'</div>';
  }).join('');
  return h;
}
function renderSpThumbs(id){
  const arr=TASK_PHOTOS['sp_'+id]||[]; const t=$('spt_'+id); const c=$('spc_'+id);
  if(t) t.innerHTML=arr.map((u,i)=>'<span style="position:relative;display:inline-block;margin:0 6px 6px 0"><img src="'+esc(u)+'" style="width:56px;height:56px;object-fit:cover;border-radius:8px;display:block"><button type="button" onclick="rmSpPhoto('+id+','+i+')" style="position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;cursor:pointer">×</button></span>').join('');
  if(c) c.textContent = arr.length ? ('แนบแล้ว '+arr.length+' รูป') : 'ถ่ายรูปได้หลายรูป (บังคับกล้อง · สแตมป์ชื่อ/เวลา/สาขาอัตโนมัติ)';
}
function rmSpPhoto(id,i){ if(TASK_PHOTOS['sp_'+id]){ TASK_PHOTOS['sp_'+id].splice(i,1); renderSpThumbs(id); } }
function wireSpInput(inpId, taskId){
  const inp=$(inpId); if(!inp) return;
  inp.addEventListener('change',async()=>{
    if(!inp.files||!inp.files.length) return;
    const added=await filesToData(inp.files);
    TASK_PHOTOS['sp_'+taskId]=(TASK_PHOTOS['sp_'+taskId]||[]).concat(added);
    inp.value='';
    renderSpThumbs(taskId);
  });
}
function wireSpecial(rows){
  (rows||[]).forEach(a=>{ if(a.status==='todo'||a.status==='sent_back'){ TASK_PHOTOS['sp_'+a.id]=[]; wireSpInput('spfc_'+a.id, a.id); } });
  document.querySelectorAll('[data-spsub]').forEach(b=>b.onclick=async()=>{
    const id=Number(b.dataset.spsub); const note=($('spn_'+id)||{}).value||'';
    b.innerHTML='<span class="spin"></span>';
    try{ const photos=TASK_PHOTOS['sp_'+id]||[]; await window.HR.submitSpecialTask({ assignee_id:id, empId:EMP.emp_id, photos, note }); toast('ok','ส่งงานพิเศษแล้ว'); openM2(); }
    catch(e){ toast('err',(e.message||'ไม่สำเร็จ')); b.textContent='ส่งงาน'; }
  });
}
function updateSpBadge(rows){
  const n=(rows||[]).filter(a=>a.status==='todo'||a.status==='sent_back').length;
  const b=$('spBadge'); if(!b) return;
  if(n>0){ b.textContent=n>99?'99+':n; b.style.display=''; } else b.style.display='none';
}
async function refreshSpBadge(){ try{ const sp=await window.HR.getSpecialTasks(EMP.emp_id); updateSpBadge(sp.rows||[]); }catch(e){} }

// ============================================================
// 🗄️ เชลฟ์ที่รับผิดชอบเดือนนี้ — แสดงในหน้า "งานของฉัน" (เดิมต้องเข้าอีกหน้าแยก)
//    ตรวจ + ถ่ายรูป + ส่งได้จากหน้านี้เลย
// ============================================================
let SHV_DATA=null;
function shvPill(c){
  if(!c) return '<span class="pill muted2">ยังไม่ตรวจวันนี้</span>';
  if(c.status==='approved')  return '<span class="pill ok">ผ่านแล้ว</span>';
  if(c.status==='sent_back') return '<span class="pill bad">ตีกลับ — ต้องแก้</span>';
  return '<span class="pill warn">รอตรวจ</span>';
}
function renderMyShelvesHTML(shv){
  SHV_DATA=shv;
  const rows=(shv&&shv.rows)||[];
  if(!rows.length) return '';
  const todo = rows.filter(r=>!r.today_check || r.today_check.status==='sent_back').length;
  let h='<h3 class="sec">🗄️ เชลฟ์ที่ฉันดูแล (เดือนนี้)'+(todo?(' <span class="pill bad">ยังไม่ตรวจ '+todo+'</span>'):' <span class="pill ok">ตรวจครบแล้ววันนี้</span>')+'</h3>';
  h+=rows.map(r=>{
    const c=r.today_check;
    const canDo = !c || c.status==='sent_back';
    let s='<div class="card" style="border-left:3px solid #7c3aed">'
      +'<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">'
        +'<div style="font-weight:700;flex:1">'+esc(r.name)+(r.shelf_code?(' <span class="muted" style="font-weight:400">['+esc(r.shelf_code)+']</span>'):'')+'</div>'
        +shvPill(c)
      +'</div>';
    if(r.detail) s+='<div class="muted" style="font-size:12.5px;margin-bottom:4px">'+esc(r.detail)+'</div>';
    if(c && c.status==='sent_back' && c.review_note) s+='<div style="color:#b91c1c;font-size:13px;margin:6px 0">⚠️ ตีกลับ: '+esc(c.review_note)+(c.reviewer?(' (โดย '+esc(c.reviewer)+')'):'')+'</div>';
    if(c && c.status==='sent_back' && Array.isArray(c.review_markup) && c.review_markup.length) s+=thumbsHtml(c.review_markup);
    if(!canDo){
      if(c && c.photos && c.photos.length) s+='<div class="muted" style="font-size:12px;margin-top:6px">รูปที่คุณส่ง</div>'+thumbsHtml(c.photos);
      if(c && c.status==='submitted') s+='<div class="muted" style="margin-top:4px">⏳ รอผู้จัดการ/HR ตรวจ</div>';
    } else {
      s+='<div style="border-top:1px dashed var(--line);margin-top:8px;padding-top:8px">'
        +(r.checklist||[]).map((it,i)=>'<label class="check" style="display:flex;gap:8px;align-items:flex-start;margin-bottom:5px;font-size:13.5px">'
          +'<input type="checkbox" class="shvck_'+r.shelf_id+'" data-label="'+esc(it)+'" style="margin-top:3px">'+esc(it)+'</label>').join('')
        +'<label class="btn btn-sec" style="font-size:13px;cursor:pointer;margin-top:6px;display:inline-block">📷 ถ่ายรูปหลักฐาน<input type="file" accept="image/*" capture="environment" multiple id="shvfc_'+r.shelf_id+'" style="display:none"></label>'
        +'<div class="thumbs" id="shvt_'+r.shelf_id+'" style="margin:6px 0 4px"></div>'
        +'<input type="text" id="shvn_'+r.shelf_id+'" placeholder="หมายเหตุ (ถ้ามี)" style="margin-bottom:8px">'
        +'<button class="btn btn-pri" data-shvsub="'+r.shelf_id+'">ส่งการตรวจเชลฟ์</button>'
        +'</div>';
    }
    return s+'</div>';
  }).join('');
  return h;
}
function renderShvThumbs(id){
  const arr=TASK_PHOTOS['shv_'+id]||[]; const t=$('shvt_'+id);
  if(t) t.innerHTML=arr.map((u,i)=>'<span style="position:relative;display:inline-block;margin:0 6px 6px 0"><img src="'+esc(u)+'" style="width:56px;height:56px;object-fit:cover;border-radius:8px;display:block"><button type="button" onclick="rmShvPhoto('+id+','+i+')" style="position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;cursor:pointer">×</button></span>').join('');
}
function rmShvPhoto(id,i){ if(TASK_PHOTOS['shv_'+id]){ TASK_PHOTOS['shv_'+id].splice(i,1); renderShvThumbs(id); } }
function wireMyShelves(){
  const rows=(SHV_DATA&&SHV_DATA.rows)||[];
  rows.forEach(r=>{
    const c=r.today_check;
    if(c && c.status!=='sent_back') return;
    TASK_PHOTOS['shv_'+r.shelf_id]=[];
    const inp=$('shvfc_'+r.shelf_id);
    if(inp) inp.addEventListener('change', async()=>{
      if(!inp.files||!inp.files.length) return;
      const picked=inp.files.length;
      const a=await filesToData(inp.files);
      TASK_PHOTOS['shv_'+r.shelf_id]=(TASK_PHOTOS['shv_'+r.shelf_id]||[]).concat(a);
      inp.value=''; renderShvThumbs(r.shelf_id);
      if(a.length) toast('ok','แนบรูปแล้ว '+a.length+'/'+picked+' รูป');
    });
  });
  document.querySelectorAll('[data-shvsub]').forEach(b=>b.onclick=async()=>{
    const id=Number(b.dataset.shvsub);
    const photos=TASK_PHOTOS['shv_'+id]||[];
    if(!photos.length){ toast('err','ต้องแนบรูปอย่างน้อย 1 รูป'); return; }
    const items=[...document.querySelectorAll('.shvck_'+id)].map(el=>({ label:el.dataset.label, done:el.checked }));
    const note=($('shvn_'+id)||{}).value||'';
    b.innerHTML='<span class="spin"></span>';
    try{ await window.HR.submitShelfCheck({ empId:EMP.emp_id, shelf_id:id, items, note, photos }); toast('ok','ส่งการตรวจเชลฟ์แล้ว'); openM2(); }
    catch(e){ toast('err', e.message||'ไม่สำเร็จ'); b.textContent='ส่งการตรวจเชลฟ์'; }
  });
}

// ============ ลำดับขั้นการตรวจงานในกะ (กันพนักงานเข้าใจผิดว่าไม่ต้องตรวจผลัดก่อนหน้า) ============
// ส่งงาน → หัวหน้าผลัดถัดไปตรวจ → (ถ้าเป็นงานที่ ผจก.ต้องตรวจ) ผู้จัดการตรวจซ้ำ
function flowStepsHTML(a){
  if(a.status!=='submitted' && a.status!=='approved') return '';
  const needMgr = (a.needs_mgr===true);
  const checked = !!a.checked_at || a.status==='approved';
  const mgrDone = !!a.mgr_checked_at;

  const step=(n,label,state,detail)=>{
    const col = state==='done' ? '#16a34a' : (state==='now' ? '#d97706' : '#9ca3af');
    const bg  = state==='now' ? '#fffbeb' : 'transparent';
    const icon= state==='done' ? '✓' : (state==='now' ? String(n) : String(n));
    return '<div style="display:flex;gap:8px;align-items:flex-start;padding:5px 7px;border-radius:8px;background:'+bg+'">'
      +'<span style="flex:none;width:20px;height:20px;border-radius:50%;background:'+col+';color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px">'+icon+'</span>'
      +'<span style="font-size:12.5px;line-height:1.45"><b style="color:'+col+'">'+label+'</b>'
      +(state==='now'?' <span style="color:#d97706">← ตอนนี้อยู่ขั้นนี้</span>':'')
      +(detail?('<div class="muted" style="font-size:11.5px">'+detail+'</div>'):'')+'</span></div>';
  };

  let h='<div style="border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:#fafafa">'
    +'<div style="font-size:12px;font-weight:700;color:#374151;margin-bottom:4px">ลำดับการตรวจงานนี้</div>';
  h+=step(1,'คุณส่งงานแล้ว','done', a.submitted_at?('ส่งเมื่อ '+fmt(a.submitted_at)):'');
  h+=step(2,'หัวหน้าผลัดถัดไปตรวจ', checked?'done':'now',
        checked ? ('ตรวจผ่านแล้ว'+(a.checked_by_name?(' โดย '+esc(a.checked_by_name)):''))
                : 'ยังไม่ถูกตรวจ — <b style="color:#b45309">งานนี้ต้องให้ผลัดถัดไปตรวจก่อน</b>');
  if(needMgr){
    h+=step(3,'ผู้จัดการตรวจซ้ำ', mgrDone?'done':(checked?'now':'wait'),
        mgrDone ? 'ผู้จัดการตรวจแล้ว' : (checked ? 'รอผู้จัดการตรวจซ้ำ' : 'จะเริ่มหลังผลัดถัดไปตรวจเสร็จ'));
  }
  if(a.status==='submitted'){
    h+='<div class="muted" style="font-size:11.5px;margin-top:5px;border-top:1px dashed var(--line);padding-top:5px">แก้ไข/เพิ่ม/ลบรูป แล้วส่งใหม่ได้เรื่อย ๆ จนกว่าจะถูกตรวจ (รูปเดิมอยู่ด้านล่าง)</div>';
  }
  return h+'</div>';
}

// ============ งานที่ ผจก.ตีกลับให้แก้ (อาจเป็นงานที่เรา "ตรวจผ่าน" ไม่ใช่งานที่เราส่ง) ============
function renderFixTasksHTML(rows){
  if(!rows||!rows.length) return '';
  let h='<h3 class="sec" style="color:#b91c1c">⚠️ งานที่ผู้จัดการตีกลับ — ต้องแก้ ('+rows.length+')</h3>';
  h+=rows.map(a=>{
    let c='<div class="card" style="border-left:4px solid #dc2626;background:#fef2f2">'
      +'<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><div style="font-weight:700;flex:1">'+esc(a.title)+'</div><span class="pill bad">ต้องแก้</span></div>'
      +'<div class="muted" style="font-size:12px">งานของกะ '+esc(a.shift_name||'-')+' · วันที่ '+esc(fmtD(a.work_date))+'</div>';
    if(a.i_was_checker) c+='<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:7px 9px;margin-top:6px;font-size:12.5px;color:#9a3412">'
      +'ℹ️ คุณเป็นผู้ <b>ตรวจผ่าน</b> งานนี้ในผลัดของคุณ เมื่อผู้จัดการตรวจซ้ำแล้วไม่ผ่าน <b>ผลัดที่ตรวจ (คุณ) เป็นผู้รับผิดชอบแก้ไข</b></div>';
    if(a.review_note) c+='<div style="color:#b91c1c;font-size:13px;margin-top:6px">⚠️ ผู้จัดการตีกลับ: '+esc(a.review_note)+'</div>';
    if(Array.isArray(a.review_markup)&&a.review_markup.length) c+='<div style="color:#dc2626;font-size:12.5px;font-weight:700;margin:6px 0 4px">📍 จุดที่ต้องแก้ (ผู้จัดการวาดชี้ไว้)</div>'+thumbsHtml(a.review_markup);
    c+='<div class="muted" style="font-size:12px;margin-top:8px">รูปของงานนี้ (รูปเดิมอยู่ครบ — ลบรูปที่ผิดออก แล้วถ่ายรูปที่แก้แล้วเพิ่ม)</div>'
      +'<div id="fxth_'+a.id+'" style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0"></div>'
      +'<div id="fxc_cnt_'+a.id+'" class="muted" style="font-size:12px;margin-bottom:6px"></div>'
      +'<label class="btn2" style="display:inline-block;cursor:pointer">📷 ถ่ายรูปที่แก้แล้ว<input type="file" accept="image/*" capture="environment" multiple id="fxc_'+a.id+'" style="display:none"></label>'
      +'<input type="text" id="fxn_'+a.id+'" placeholder="หมายเหตุถึงผู้จัดการ (ถ้ามี)" style="margin:8px 0">'
      +'<button class="btn" data-fixsub="'+a.id+'">ส่งงานที่แก้แล้ว</button></div>';
    return c;
  }).join('');
  return h;
}
function wireFixTasks(rows){
  (rows||[]).forEach(a=>{
    // โหลด "รูปเดิม" เข้าชุดแก้ไข → นับรวมกับรูปขั้นต่ำ ไม่ต้องถ่ายใหม่ทั้งหมด (ลบเฉพาะรูปที่ผิดได้)
    TASK_PHOTOS['fx_'+a.id]=(Array.isArray(a.photos)?a.photos.slice():[]);
    FIX_MIN['fx_'+a.id]=Number(a.min_photos||0);
    renderFixThumbs(a.id);
    const inp=document.getElementById('fxc_'+a.id);
    if(inp) inp.onchange=async e=>{
      if(!inp.files||!inp.files.length) return;
      try{
        const added=await filesToData(inp.files);      // ใช้ตัวอ่านรูปตัวเดียวกับงานในกะ (ย่อ+บีบอัดให้แล้ว)
        TASK_PHOTOS['fx_'+a.id]=(TASK_PHOTOS['fx_'+a.id]||[]).concat(added);
        renderFixThumbs(a.id);
      }catch(err){ toast('err','อ่านรูปไม่สำเร็จ: '+((err&&err.message)||'')); }
      inp.value='';
    };
  });
  document.querySelectorAll('[data-fixsub]').forEach(b=>b.onclick=async()=>{
    const id=Number(b.dataset.fixsub);
    const photos=TASK_PHOTOS['fx_'+id]||[];
    const min=FIX_MIN['fx_'+id]||0;
    if(!photos.length){ toast('err','ต้องมีรูปอย่างน้อย 1 รูป'); return; }
    if(min && photos.length<min){ toast('err','งานนี้ต้องมีรูปอย่างน้อย '+min+' รูป (ตอนนี้ '+photos.length+' รูป)'); return; }
    const note=(document.getElementById('fxn_'+id)||{}).value||'';
    b.innerHTML='<span class="spin"></span>';
    try{ await window.HR.submitTaskMulti({ id, empId:EMP.emp_id, photos, note }); toast('ok','ส่งงานที่แก้แล้ว — รอผู้จัดการตรวจซ้ำ'); openM2(); }
    catch(e){ toast('err',(e.message||'ไม่สำเร็จ')); b.textContent='ส่งงานที่แก้แล้ว'; }
  });
}
let FIX_MIN={};   // จำนวนรูปขั้นต่ำของงานที่ถูกตีกลับ (ต่อใบ)
function renderFixThumbs(id){
  const box=document.getElementById('fxth_'+id); if(!box) return;
  const arr=TASK_PHOTOS['fx_'+id]||[];
  box.innerHTML=arr.map((u,i)=>'<span style="position:relative;display:inline-block"><img src="'+esc(u)+'" style="width:56px;height:56px;object-fit:cover;border-radius:8px;display:block"><button type="button" onclick="TASK_PHOTOS[\'fx_'+id+'\'].splice('+i+',1);renderFixThumbs('+id+')" style="position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer">×</button></span>').join('');
  const cnt=document.getElementById('fxc_cnt_'+id);
  if(cnt){
    const min=FIX_MIN['fx_'+id]||0;
    const ok=!min || arr.length>=min;
    cnt.innerHTML='แนบแล้ว <b>'+arr.length+'</b> รูป'+(min?(' · ต้องมีอย่างน้อย '+min+' รูป '+(ok?'<span style="color:#16a34a">✓ ครบแล้ว</span>':'<span style="color:#dc2626">ยังขาดอีก '+(min-arr.length)+' รูป</span>')):'');
  }
}
function fmtD(d){ try{ return beDate(d); }catch(e){ return d||''; } }

// ============ งานที่ผู้จัดการมอบหมาย (mgr_tasks) ============
function mtEmpST(s){ return ({ todo:['มอบหมายใหม่','warn'], doing:['กำลังทำ','warn'], review:['ส่งแล้ว รอ ผจก.ตรวจ','ok'] })[s]||['มอบหมายใหม่','warn']; }
function renderMgrTasksHTML(rows){
  if(!rows||!rows.length) return '';
  let h='<h3 class="sec">📋 งานที่ผู้จัดการมอบหมาย</h3>';
  h+=rows.map(a=>{
    const s=mtEmpST(a.status);
    let c='<div class="card" style="border-left:3px solid #2563eb"><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><div style="font-weight:700;flex:1">'+esc(a.title)+'</div>'
      +(a.priority==='urgent'?'<span class="pill bad">ด่วน</span>':'')+'<span class="pill '+s[1]+'">'+s[0]+'</span></div>';
    if(a.detail) c+='<div style="font-size:13.5px;margin-bottom:4px;white-space:pre-wrap">'+esc(a.detail)+'</div>';
    if(a.due_date) c+='<div class="muted" style="font-size:12.5px">⏰ กำหนดส่ง: '+esc(String(a.due_date))+'</div>';
    if(a.hr_photos&&a.hr_photos.length) c+='<div style="margin-top:6px"><div class="muted" style="font-size:12px">รูปอ้างอิงจากผู้จัดการ</div>'+thumbsHtml(a.hr_photos)+'</div>';
    if(a.emp_photos&&a.emp_photos.length) c+='<div style="margin-top:8px"><div class="muted" style="font-size:12px">รูปที่คุณส่งล่าสุด'+(a.emp_submitted_at?(' · '+fmt(a.emp_submitted_at)):'')+'</div>'+thumbsHtml(a.emp_photos)+'</div>';
    if(a.emp_note) c+='<div class="muted" style="margin-top:6px">หมายเหตุล่าสุดของคุณ: '+esc(a.emp_note)+'</div>';
    c+='<div style="border-top:1px dashed var(--line);margin-top:10px;padding-top:10px">'
      +'<label class="btn btn-sec" style="font-size:13px;cursor:pointer">📷 ถ่ายรูปหลักฐาน<input type="file" accept="image/*" capture="environment" id="mgtfc_'+a.id+'" style="display:none"></label>'
      +'<div class="thumbs" id="mgtt_'+a.id+'" style="margin:6px 0 4px"></div>'
      +'<div class="muted" id="mgtc_'+a.id+'" style="margin-bottom:8px">ถ่ายรูปได้หลายรูป · ส่งความคืบหน้าให้ผู้จัดการเห็นได้หลายครั้ง</div>'
      +'<input type="text" id="mgtn_'+a.id+'" placeholder="หมายเหตุถึงผู้จัดการ (ถ้ามี)" style="margin-bottom:8px">'
      +'<button class="btn btn-pri" data-mgtsub="'+esc(a.id)+'">ส่งให้ผู้จัดการ</button>'
      +'</div>';
    return c+'</div>';
  }).join('');
  return h;
}
function renderMgtThumbs(id){
  const arr=TASK_PHOTOS['mgt_'+id]||[]; const t=$('mgtt_'+id); const c=$('mgtc_'+id);
  if(t) t.innerHTML=arr.map((u,i)=>'<span style="position:relative;display:inline-block;margin:0 6px 6px 0"><img src="'+esc(u)+'" style="width:56px;height:56px;object-fit:cover;border-radius:8px;display:block"><button type="button" onclick="rmMgtPhoto(\''+esc(id)+'\','+i+')" style="position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;cursor:pointer">×</button></span>').join('');
  if(c) c.textContent = arr.length ? ('แนบแล้ว '+arr.length+' รูป') : 'ถ่ายรูปได้หลายรูป · ส่งความคืบหน้าให้ผู้จัดการเห็นได้หลายครั้ง';
}
function rmMgtPhoto(id,i){ if(TASK_PHOTOS['mgt_'+id]){ TASK_PHOTOS['mgt_'+id].splice(i,1); renderMgtThumbs(id); } }
function wireMgtInput(inpId, taskId){
  const inp=$(inpId); if(!inp) return;
  inp.addEventListener('change',async()=>{
    if(!inp.files||!inp.files.length) return;
    const added=await filesToData(inp.files);
    TASK_PHOTOS['mgt_'+taskId]=(TASK_PHOTOS['mgt_'+taskId]||[]).concat(added);
    inp.value='';
    renderMgtThumbs(taskId);
  });
}
function wireMgrTasks(rows){
  (rows||[]).forEach(a=>{ TASK_PHOTOS['mgt_'+a.id]=[]; wireMgtInput('mgtfc_'+a.id, a.id); });
  document.querySelectorAll('[data-mgtsub]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.mgtsub; const note=($('mgtn_'+id)||{}).value||'';
    b.innerHTML='<span class="spin"></span>';
    try{ const photos=TASK_PHOTOS['mgt_'+id]||[]; await window.HR.submitMgrTaskByEmp({ task_id:id, empId:EMP.emp_id, photos, note }); toast('ok','ส่งให้ผู้จัดการแล้ว'); openM2(); }
    catch(e){ toast('err',(e.message||'ไม่สำเร็จ')); b.textContent='ส่งให้ผู้จัดการ'; }
  });
}

let PVTASKS={}, MK=null;
async function mkLoadBlob(url){
  try{ const m=url.match(/\/object\/(?:public|sign|authenticated)\/([^/]+)\/([^?]+)/); if(m&&window.HR&&window.HR.sb){ const {data,error}=await window.HR.sb.storage.from(decodeURIComponent(m[1])).download(decodeURIComponent(m[2])); if(!error&&data) return URL.createObjectURL(data); } }catch(e){}
  try{ const r=await fetch(url,{mode:'cors'}); if(r.ok) return URL.createObjectURL(await r.blob()); }catch(e){}
  return url;
}
function mkEnsureUI(){
  if(document.getElementById('mkOverlay')) return;
  const o=document.createElement('div'); o.id='mkOverlay';
  o.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.95);z-index:100000;display:none;flex-direction:column;padding:10px;gap:8px';
  o.innerHTML='<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:#fff">'
    +'<b style="font-size:14px;margin-right:4px">✏️ วาดชี้จุดที่ต้องแก้</b>'
    +'<button class="mkt on" data-tool="circle">⭕ วงกลม</button><button class="mkt" data-tool="rect">▭ กรอบ</button><button class="mkt" data-tool="pen">✎ ปากกา</button>'
    +'<button id="mkUndo" class="mkt">↶ ย้อน</button><button id="mkClear" class="mkt">🗑 ล้าง</button>'
    +'<span style="flex:1"></span><button id="mkPrev" class="mkt">‹</button><span id="mkNav" style="color:#e2e8f0;font-size:13px">1/1</span><button id="mkNext" class="mkt">›</button></div>'
    +'<div style="flex:1;display:flex;align-items:center;justify-content:center;overflow:auto"><canvas id="mkCanvas" style="max-width:100%;max-height:100%;background:#000;border-radius:8px;touch-action:none"></canvas></div>'
    +'<textarea id="mkNote" placeholder="ระบุสิ่งที่ต้องแก้…" style="width:100%;box-sizing:border-box;padding:9px 11px;border-radius:9px;border:0;font:inherit;font-size:14px;min-height:48px"></textarea>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end"><button id="mkCancel" class="btn btn-sec btn-sm">ยกเลิก</button><button id="mkSend" class="btn btn-warn btn-sm">⤴ ส่งกลับให้แก้</button></div>';
  document.body.appendChild(o);
  const st=document.createElement('style'); st.textContent='.mkt{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer}.mkt.on{background:#ef4444}'; document.head.appendChild(st);
  o.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{ MK.tool=b.dataset.tool; o.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on',x===b)); });
  document.getElementById('mkUndo').onclick=()=>{ MK.imgs[MK.cur].shapes.pop(); mkRedraw(); };
  document.getElementById('mkClear').onclick=()=>{ MK.imgs[MK.cur].shapes=[]; mkRedraw(); };
  document.getElementById('mkPrev').onclick=()=>{ if(MK.cur>0){ MK.cur--; mkLoadCur(); } };
  document.getElementById('mkNext').onclick=()=>{ if(MK.cur<MK.imgs.length-1){ MK.cur++; mkLoadCur(); } };
  document.getElementById('mkCancel').onclick=()=>{ o.style.display='none'; MK=null; };
  document.getElementById('mkSend').onclick=mkSend;
  const cv=document.getElementById('mkCanvas');
  const pos=e=>{ const r=cv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return {x:(p.clientX-r.left)/r.width,y:(p.clientY-r.top)/r.height}; };
  let drawing=false,cur=null;
  const down=e=>{ if(!MK)return; drawing=true; const p=pos(e); cur=MK.tool==='pen'?{t:'pen',pts:[p]}:{t:MK.tool,x:p.x,y:p.y,x2:p.x,y2:p.y}; MK.imgs[MK.cur].shapes.push(cur); e.preventDefault(); };
  const move=e=>{ if(!drawing||!MK)return; const p=pos(e); if(cur.t==='pen')cur.pts.push(p); else{cur.x2=p.x;cur.y2=p.y;} mkRedraw(); e.preventDefault(); };
  const up=()=>{ drawing=false;cur=null; };
  cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  cv.addEventListener('touchstart',down,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',up);
}
function mkShapes(ctx,shapes,W,H){ ctx.strokeStyle='#ef4444'; ctx.lineWidth=Math.max(3,Math.round(W*0.006)); ctx.lineJoin='round'; ctx.lineCap='round';
  shapes.forEach(s=>{ if(s.t==='rect') ctx.strokeRect(s.x*W,s.y*H,(s.x2-s.x)*W,(s.y2-s.y)*H);
    else if(s.t==='circle'){ ctx.beginPath(); ctx.ellipse((s.x+s.x2)/2*W,(s.y+s.y2)/2*H,Math.abs(s.x2-s.x)/2*W,Math.abs(s.y2-s.y)/2*H,0,0,Math.PI*2); ctx.stroke(); }
    else if(s.t==='pen'){ ctx.beginPath(); s.pts.forEach((p,i)=>i?ctx.lineTo(p.x*W,p.y*H):ctx.moveTo(p.x*W,p.y*H)); ctx.stroke(); } }); }
function mkRedraw(){ const im=MK.imgs[MK.cur]; if(!im||!im.el)return; const cv=document.getElementById('mkCanvas'); const maxW=Math.min(720,window.innerWidth-24),maxH=window.innerHeight-210; let W=im.el.naturalWidth,H=im.el.naturalHeight; const sc=Math.min(maxW/W,maxH/H,1); cv.width=Math.round(W*sc); cv.height=Math.round(H*sc); const ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height); ctx.drawImage(im.el,0,0,cv.width,cv.height); mkShapes(ctx,im.shapes,cv.width,cv.height); document.getElementById('mkNav').textContent=(MK.cur+1)+'/'+MK.imgs.length; }
async function mkLoadCur(){ const im=MK.imgs[MK.cur]; if(!im.el){ const src=/^https?:/i.test(im.src)?await mkLoadBlob(im.src):im.src; await new Promise(res=>{ const g=new Image(); g.onload=()=>{im.el=g;res();}; g.onerror=()=>res(); g.src=src; }); } mkRedraw(); }
async function openMarkupEditor(t){
  if(!t){ toast('err','ไม่พบงาน'); return; }
  const photos=(Array.isArray(t.photos)&&t.photos.length)?t.photos:(t.photo_url?[t.photo_url]:[]);
  if(!photos.length){ const note=prompt('งานนี้ไม่มีรูป — ระบุสิ่งที่ต้องแก้ (ส่งกลับ):'); if(note===null)return; doPrevReview(t.id,'sent_back',note); return; }
  mkEnsureUI(); MK={ task:t, tool:'circle', cur:0, imgs:photos.map(u=>({src:u,el:null,shapes:[]})) };
  document.querySelectorAll('#mkOverlay [data-tool]').forEach(x=>x.classList.toggle('on',x.dataset.tool==='circle'));
  document.getElementById('mkNote').value=''; document.getElementById('mkOverlay').style.display='flex'; await mkLoadCur();
}
async function mkSend(){
  if(!MK)return; const note=document.getElementById('mkNote').value.trim();
  const marked=MK.imgs.filter(im=>im.shapes.length&&im.el);
  if(!marked.length&&!note){ toast('err','วาดชี้จุด หรือพิมพ์สิ่งที่ต้องแก้ อย่างน้อยอย่างใดอย่างหนึ่ง'); return; }
  document.getElementById('mkSend').disabled=true;
  const out=[];
  for(const im of marked){ const W=Math.min(im.el.naturalWidth,1280),H=Math.round(im.el.naturalHeight*(W/im.el.naturalWidth)); const c=document.createElement('canvas'); c.width=W;c.height=H; const ctx=c.getContext('2d'); ctx.drawImage(im.el,0,0,W,H); mkShapes(ctx,im.shapes,W,H); out.push(c.toDataURL('image/jpeg',0.9)); }
  await doPrevReview(MK.task.id,'sent_back',note,out);
  document.getElementById('mkSend').disabled=false; document.getElementById('mkOverlay').style.display='none'; MK=null;
}

  GD_PHOTOS = (GD_EDIT && Array.isArray(GD_EDIT.in_photos)) ? GD_EDIT.in_photos.slice() : [];
  renderGdThumbs();
  const inp=$('gd_fc');
  if(inp) inp.addEventListener('change',async()=>{
    if(!inp.files||!inp.files.length) return;
    const picked=inp.files.length;
    toast('ok','กำลังเตรียมรูป '+picked+' รูป…');
    const a=await filesToData(inp.files);
    GD_PHOTOS=GD_PHOTOS.concat(a); inp.value=''; renderGdThumbs();
    if(a.length) toast('ok','แนบรูปแล้ว '+a.length+'/'+picked+' รูป');
  });
  const upd=()=>{ const wid=$('gd_wh').value; const exp=wid?(GOODS.outstanding[wid]||0):0; $('gd_exp').textContent=wid?('(ยอดคงค้างควรคืน '+exp+' ลัง)'):''; const ret=parseInt($('gd_ret').value)||0; const d=ret-exp; if($('gd_diff')){ $('gd_diff').textContent=wid?('ส่วนต่าง: '+(d>0?'+':'')+d+(d===0?' (ตรง)':' (ไม่ตรง — บันทึกเป็นออดิท)')):''; $('gd_diff').style.color=d===0?'var(--muted)':'#dc2626'; } };
  $('gd_wh').onchange=()=>{ const wid=$('gd_wh').value; if(wid && !GD_EDIT){ $('gd_ret').value=GOODS.outstanding[wid]||0; } upd(); };
  $('gd_ret').oninput=upd;
  if(GD_EDIT){ $('gd_ret').value=GD_EDIT.crates_return||0; } else if($('gd_wh').value){ $('gd_ret').value=GOODS.outstanding[$('gd_wh').value]||0; }
  upd();
  $('gd_cancel')&&($('gd_cancel').onclick=()=>{ GD_EDIT=null; renderGoods(); });
  document.querySelectorAll('[data-gedit]').forEach(b=>b.onclick=()=>{ GD_EDIT=GOODS.today.find(x=>String(x.id)===String(b.dataset.gedit))||null; renderGoods(); });
  $('gd_save').onclick=async()=>{
    const warehouse_id=$('gd_wh').value, ref_no=$('gd_ref').value.trim(), crates_in=$('gd_in').value, crates_return=$('gd_ret').value, note=$('gd_note').value;
    if(!warehouse_id){ toast('err','เลือกคลังก่อน'); return; }
    if(!/^\d{6}$/.test(ref_no)){ toast('err','เลขรันต้องเป็นตัวเลข 6 หลัก'); return; }
    // ★ กันเคส "คิดว่าแนบรูปแล้ว แต่จริง ๆ ไม่มีรูป" — ยืนยันก่อนบันทึก
    if(!(GD_PHOTOS||[]).length && !confirm('ยังไม่มีรูปแนบ (รูปลัง/บิล)\nยืนยันบันทึกโดยไม่มีรูป?')) return;
    $('gd_save').innerHTML='<span class="spin"></span>';
    try{ await window.HR.submitGoodsReceipt({ empId:EMP.emp_id, id:GD_EDIT?GD_EDIT.id:null, warehouse_id:Number(warehouse_id), ref_no, crates_in, crates_return, in_photos:GD_PHOTOS, note }); toast('ok','บันทึกรับสินค้าแล้ว'); GD_EDIT=null; openGoods(); }
    catch(e){ toast('err',e.message||'ไม่สำเร็จ'); $('gd_save').textContent=GD_EDIT?'อัปเดต':'บันทึก'; }
  };
}

        +'<div class="muted">ผู้ทำ: '+esc(a.emp_name||a.emp_id||'—')+(a.submitted_at?(' · ส่ง '+fmt(a.submitted_at)):'')+'</div>'
        +'<div class="muted">ตรวจโดย: '+esc(a.reviewer||'—')+(a.reviewed_at?(' · '+fmt(a.reviewed_at)):'')+'</div>'
        +((a.sent_back_count>0)?'<div style="color:#b45309;font-size:13px">มีการส่งแก้ไข '+a.sent_back_count+' ครั้ง</div>':'')
        +(a.review_note?'<div style="color:#b45309;font-size:13px">↳ '+esc(a.review_note)+'</div>':'')

// ===== การ์ดเตือนกดออก / ควบกะต่อ / ยื่นแก้ไขเวลาออก (แสดงในหน้ารับส่งผลัดด้วย) =====
const CO_GRACE_MIN=15;
function coEffEnd(row, shift){
  if(!shift || !shift.end_time) return null;
  const st=(shift.start_time||'').slice(0,5), en=shift.end_time.slice(0,5);
  const overnight = st && en <= st;
  const base=new Date(row.work_date+'T00:00:00');
  if(overnight) base.setDate(base.getDate()+1);
  const [h,m]=en.split(':').map(Number); base.setHours(h,m,0,0);
  return base;
}
async function refreshCoCard(){
  const box=$('hoCoCard'); if(!box) return;
  if(!EMP){ box.innerHTML=''; return; }
  let s; try{ s=await window.HR.getCheckoutState(EMP.emp_id); }catch(e){ box.innerHTML=''; return; }
  if(!s || s.none || !s.row){ box.innerHTML=''; return; }
  const row=s.row;
  if(row.check_out && row.auto_closed){
    box.innerHTML='<div style="background:#fff4e0;border:1px solid #f3d38a;border-radius:12px;padding:12px;font-size:13px;color:#a06515">'
      +'<div style="font-weight:600">ระบบบันทึกเวลาออกให้แล้ว</div>'
      +'<div style="margin-top:2px">ถ้าคุณออกจริงหลังเวลาเลิกกะ กดยื่นแก้ไขเวลาออกเพื่อให้หัวหน้า/ผู้จัดการ ตรวจสอบ</div>'
      +'<button class="btn btn-sec btn-sm" id="hoCorrBtn" style="margin-top:8px">ยื่นแก้ไขเวลาออกจริง</button></div>';
    $('hoCorrBtn').onclick=()=>openCorrForm(row);
    return;
  }
  if(!row.check_out){
    const eff=coEffEnd(row, s.shift);
    if(eff && Date.now() >= eff.getTime()+CO_GRACE_MIN*60000){
      const endTxt=s.shift?s.shift.end_time.slice(0,5):'';
      box.innerHTML='<div style="background:#fff4e0;border:1px solid #f3d38a;border-radius:12px;padding:12px;font-size:13px;color:#a06515">'
        +'<div style="font-weight:600">⏰ อย่าลืมกดออกงาน</div>'
        +'<div style="margin-top:2px">กะเลิก '+esc(endTxt)+' แล้ว — ถ้าเลิกแล้วไปกด "ออกงาน" ที่หน้าลงเวลา หรือถ้ายังทำต่อ (ควบกะ) เลือกด้านล่าง</div>'
        +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'
        +'<button class="btn btn-sec btn-sm" data-ext="2">ควบกะต่อ +2 ชม.</button>'
        +'<button class="btn btn-sec btn-sm" data-ext="4">+4 ชม.</button>'
        +'<button class="btn btn-sec btn-sm" data-ext="12">จนกว่าจะกดออกเอง</button>'
        +'</div></div>';
      box.querySelectorAll('[data-ext]').forEach(b=>b.onclick=async()=>{
        const hrs=Number(b.dataset.ext); const until=new Date(Date.now()+hrs*3600000).toISOString();
        try{ await window.HR.extendShift({ empId:EMP.emp_id, untilIso:until }); toast('ok','บันทึกควบกะต่อแล้ว — อย่าลืมกดออกงานเมื่อเลิกจริง'); refreshCoCard(); }
        catch(e){ toast('err', e.message||'ไม่สำเร็จ'); }
      });
      return;
    }
  }
  box.innerHTML='';
}
function openCorrForm(row){
  const box=$('hoCoCard');
  const def=new Date(); def.setSeconds(0,0);
  const local=new Date(def.getTime()-def.getTimezoneOffset()*60000).toISOString().slice(0,16);
  box.innerHTML='<div class="card" style="padding:12px">'
    +'<div style="font-weight:600;font-size:13.5px;margin-bottom:8px">ยื่นแก้ไขเวลาออกจริง</div>'
    +'<label style="font-size:12px;color:var(--muted)">เวลาออกจริง</label>'
    +'<input type="datetime-local" id="hoCorrTime" value="'+local+'" style="width:100%;margin:4px 0 8px;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px">'
    +'<label style="font-size:12px;color:var(--muted)">เหตุผล</label>'
    +'<input type="text" id="hoCorrReason" placeholder="เช่น ควบกะบ่ายฉุกเฉิน ลืมกดออก" style="width:100%;margin:4px 0 10px;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px">'
    +'<div style="display:flex;gap:8px"><button class="btn btn-pri btn-sm" id="hoCorrSend">ส่งคำขอ</button><button class="btn btn-sec btn-sm" id="hoCorrCancel">ยกเลิก</button></div></div>';
  $('hoCorrCancel').onclick=refreshCoCard;
  $('hoCorrSend').onclick=async()=>{
    const v=$('hoCorrTime').value; if(!v){ toast('err','เลือกเวลาออกจริง'); return; }
    try{ await window.HR.requestCheckoutCorrection({ empId:EMP.emp_id, actualIso:new Date(v).toISOString(), reason:$('hoCorrReason').value }); toast('ok','ส่งคำขอแล้ว รอหัวหน้า/ผู้จัดการอนุมัติ'); box.innerHTML=''; }
    catch(e){ toast('err', e.message||'ไม่สำเร็จ'); }
  };
}

// ===== แจ้งเตือนงานบนมือถือพนักงาน (Web Push) =====
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('../sw.js').catch(function(){}); }); }
(function(){
  const btn=$('bNotify'); if(!btn) return;
  const supported=('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);
  if(!supported){ btn.style.display='none'; return; }
  function b64ToU8(s){ const pad='='.repeat((4-s.length%4)%4); const b=(s+pad).replace(/-/g,'+').replace(/_/g,'/'); const raw=atob(b); const arr=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i); return arr; }
  async function cur(){ const reg=await navigator.serviceWorker.ready; return reg.pushManager.getSubscription(); }
  async function refresh(){ btn.style.display=''; try{ const s=await cur(); btn.textContent=s?'🔔 แจ้งเตือนงานเปิดอยู่ (แตะเพื่อปิด)':'🔔 เปิดแจ้งเตือนงานบนมือถือนี้'; }catch(e){} }
  window.refreshNotifyBtn=refresh;
  btn.onclick=async()=>{
    if(!EMP){ toast('err','กรอกรหัสพนักงานก่อน'); return; }
    if(typeof window.VAPID_PUBLIC!=='string' || window.VAPID_PUBLIC.length<20){ toast('err','ระบบยังไม่ตั้งค่าแจ้งเตือน'); return; }
    btn.disabled=true;
    try{
      const s=await cur();
      if(s){ try{ await window.HR.sb.from('push_subscriptions').delete().eq('endpoint',s.endpoint); }catch(e){} await s.unsubscribe(); toast('ok','ปิดแจ้งเตือนแล้ว'); }
      else{
        const perm=await Notification.requestPermission();
        if(perm!=='granted'){ toast('err','ไม่ได้รับอนุญาตแจ้งเตือน — เปิดสิทธิ์ในเบราว์เซอร์ก่อน'); btn.disabled=false; return; }
        const reg=await navigator.serviceWorker.ready;
        const sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToU8(window.VAPID_PUBLIC) });
        const j=sub.toJSON();
        const { error }=await window.HR.sb.from('push_subscriptions').upsert({ endpoint:sub.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, label:(EMP.nickname||EMP.name||'พนักงาน'), emp_id:EMP.emp_id, branch_id:EMP.branch_id||null }, { onConflict:'endpoint' });
        if(error){ toast('err','บันทึกไม่สำเร็จ: '+error.message); btn.disabled=false; return; }
        toast('ok','เปิดแจ้งเตือนงานแล้ว — จะเตือนเมื่อมีงานใหม่/ใกล้ครบกำหนด');
      }
      refresh();
    }catch(e){ toast('err','ทำรายการไม่สำเร็จ'); }
    btn.disabled=false;
  };
})();
</script>
