<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00703c">
<title>งานผลัด · 7-Eleven</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--green:#00703c;--green-d:#00582f;--green-soft:#e7f3ec;--orange:#f5821f;--red:#e11f26;--bg:#eef1ec;--line:#dbe2dc;--muted:#6b756d;--txt:#1b2a20;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Anuphan',sans-serif;background:var(--bg);color:var(--txt);min-height:100dvh;}
  .wrap{max-width:480px;margin:0 auto;min-height:100dvh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.06);}
  .top{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;padding:18px;display:flex;align-items:center;gap:12px;}
  .top .ic{font-size:24px;} .top h1{font-size:18px;font-weight:600;flex:1;}
  .home{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.15);padding:6px 11px;border-radius:9px;}
  .body{padding:18px;flex:1;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 2px;font-weight:500;}
  input[type=text],textarea,select{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:11px;padding:12px 13px;background:#fff;color:var(--txt);}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
  textarea{resize:vertical;min-height:48px;}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:transform .08s;}
  .btn:active{transform:scale(.98);}
  .btn-pri{background:var(--green);color:#fff;} .btn-sec{background:#fff;color:var(--txt);border:1.5px solid var(--line);}
  .btn-danger{background:#fff;color:var(--red);border:1.5px solid #f1bcbe;} .btn-warn{background:#fff7ed;color:#9a3412;border:1.5px solid #fed7aa;}
  .btn-sm{padding:9px 12px;font-size:14px;width:auto;}
  .row2{display:flex;gap:8px;} .row2>*{flex:1;}
  .who{display:flex;align-items:center;gap:12px;background:var(--green-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;}
  .who .nm{font-weight:600;font-size:16px;} .who .sub{font-size:12.5px;color:var(--green-d);}
  .who .ch{margin-left:auto;font-size:12.5px;color:var(--green-d);background:#fff;border:1px solid var(--green-soft);padding:5px 10px;border-radius:8px;cursor:pointer;}
  h3.sec{font-size:13px;color:var(--green-d);font-weight:700;margin:16px 2px 8px;}
  .pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;}
  .ok{background:var(--green-soft);color:var(--green-d);} .bad{background:#fdeaea;color:var(--red);} .warn{background:#fff4e0;color:#a06515;} .muted2{background:#eef0ec;color:var(--muted);}
  .photo{width:100%;border-radius:11px;border:1px solid var(--line);margin-top:8px;display:none;}
  .thumbs{display:flex;gap:6px;overflow-x:auto;padding:2px 0;margin-top:6px;-webkit-overflow-scrolling:touch;}
  .thumbs img{height:66px;border-radius:8px;flex:none;border:1px solid var(--line);cursor:pointer;}
  .listrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:8px;}
  .listrow .t{flex:1;font-size:14.5px;}
  .muted{color:var(--muted);font-size:13.5px;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:12px 18px;border-radius:11px;color:#fff;font-weight:500;font-size:14.5px;display:none;z-index:50;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.18);text-align:center;}
  .toast.ok{background:var(--green);} .toast.err{background:var(--red);} .toast.show{display:block;}
  .hide{display:none;} .spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .mainbtn{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;font-size:16px;font-weight:600;width:100%;text-align:left;}
  .mainbtn .e{font-size:22px;} .mainbtn .d{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px;}
  .mainbtn.pri{background:var(--green);color:#fff;border-color:var(--green);} .mainbtn.pri .d{color:#d7e7dd;}
  .imgbtn{display:block;width:100%;padding:0;margin:0 0 12px;border:none;background:none;cursor:pointer;border-radius:14px;}
  .imgbtn img{display:block;width:100%;height:auto;border-radius:14px;}
  .imgbtn:active{transform:scale(.99);}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="ic">🔄</span><h1>งานผลัด</h1><a class="home" href="../">🏠 หน้าแรก</a></div>
  <div class="body">

    <!-- step_id -->
    <div id="step_id">
      <div class="card">
        <label>รหัสพนักงาน</label>
        <input id="empId" type="text" inputmode="numeric" placeholder="กรอกรหัสพนักงาน">
        <div style="height:12px"></div>
        <button class="btn btn-pri" id="goBtn">เริ่ม</button>
        <div class="muted" style="text-align:center;margin-top:10px">ใช้รหัสเดียวกับลงเวลาเข้า-ออกงาน</div>
      </div>
    </div>

    <!-- step_menu -->
    <div id="step_menu" class="hide">
      <div class="who"><div><div class="nm" id="m_nm">—</div><div class="sub" id="m_sub"></div></div><span class="ch" id="changeBtn">เปลี่ยนรหัส</span></div>
      <button class="imgbtn" id="bMenu1"><img src="../01_shift_leader_assign.png?v=1" alt="หัวหน้าผลัด · มอบหมายงาน"></button>
      <button class="imgbtn" id="bMenu2"><img src="../02_my_tasks.png?v=1" alt="งานที่ได้รับมอบหมาย"></button>
      <button class="imgbtn" id="bMenu3"><img src="../03_shift_handover_review.png?v=1" alt="รับผลัด · ตรวจงานผลัดก่อนหน้า"></button>
      <button class="imgbtn" id="bReport"><img src="../04_shift_report.png?v=1" alt="รายงานรับส่งผลัด"></button>
    </div>

    <!-- menu1: leader -->
    <div id="step_m1" class="hide">
      <div class="who"><div><div class="nm" id="l_nm">—</div><div class="sub" id="l_sub"></div></div><span class="ch" id="l_back">‹ เมนู</span></div>
      <div id="m1_gate"></div>
      <div id="m1_panel" class="hide">
        <div class="card" style="padding:12px">
          <label>เพิ่มคนเข้ากะ (กรณียังไม่จัดเวร)</label>
          <div class="row2"><select id="l_addemp"></select><button class="btn btn-sec btn-sm" id="l_addbtn" style="flex:none">เพิ่ม</button></div>
        </div>
        <h3 class="sec">แจกงานให้คนในผลัด</h3>
        <div id="l_board"></div>
      </div>
    </div>

    <!-- menu2: my assignments -->
    <div id="step_m2" class="hide">
      <div class="who"><div><div class="nm" id="my_nm">—</div><div class="sub" id="my_sub"></div></div><span class="ch" id="my_back">‹ เมนู</span></div>
      <div id="my_body"><div class="card muted">กำลังโหลด…</div></div>
    </div>

    <!-- menu3: review previous shift -->
    <div id="step_m3" class="hide">
      <div class="who"><div><div class="nm" id="pv_nm">—</div><div class="sub" id="pv_sub"></div></div><span class="ch" id="pv_back">‹ เมนู</span></div>
      <div id="pv_body"><div class="card muted">กำลังโหลด…</div></div>
    </div>

    <!-- report -->
    <div id="step_report" class="hide">
      <div class="who"><div><div class="nm">รายงานรับส่งผลัด</div><div class="sub" id="rp_branch"></div></div><span class="ch" id="rp_back">‹ เมนู</span></div>
      <div class="card" style="padding:12px"><label>วันที่</label><input id="rp_date" type="date"><div style="height:8px"></div><button class="btn btn-pri btn-sm" id="rp_go" style="width:100%">ดูรายงาน</button></div>
      <div id="rp_body"></div>
    </div>

  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/config.js"></script>
<script src="../shared/supabase.js"></script>
<script>
const $=id=>document.getElementById(id);
function toast(t,m){const e=$('toast');e.textContent=m;e.className='toast show '+(t||'ok');setTimeout(()=>e.className='toast',3000);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function show(id){['step_id','step_menu','step_m1','step_m2','step_m3','step_report'].forEach(s=>$(s).classList.add('hide'));$(id).classList.remove('hide');}
function fmt(t){try{return new Date(t).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'});}catch(e){return '';}}
function ST(s){return s==='approved'?['ผ่านแล้ว','ok']:s==='submitted'?['รอตรวจ','warn']:s==='sent_back'?['ตีกลับ','bad']:['มอบหมายแล้ว','muted2'];}
function resizeFile(file){return new Promise(res=>{const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{const max=1000,sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.85));};img.src=ev.target.result;};r.readAsDataURL(file);});}
async function filesToData(files){const out=[];for(const f of files){out.push(await resizeFile(f));}return out;}
function thumbsHtml(photos){if(!photos||!photos.length)return '';return '<div class="thumbs">'+photos.map(u=>'<img src="'+esc(u)+'" onclick="lightbox(this)">').join('')+'</div>';}
// กล่องขยายรูป (lightbox) แบบ gallery — เลื่อนซ้าย-ขวา / ปัดนิ้ว / ลูกศร / ตัวนับ
let LB={imgs:[],idx:0};
function ensureLightbox(){
  if(document.getElementById('lightbox')) return;
  const o=document.createElement('div'); o.id='lightbox';
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99999;display:none;align-items:center;justify-content:center;touch-action:pan-y';
  o.innerHTML='<button id="lbClose" style="position:absolute;top:14px;right:16px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:22px;cursor:pointer">×</button>'
    +'<button id="lbPrev" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:28px;cursor:pointer">‹</button>'
    +'<img id="lightboxImg" style="max-width:92%;max-height:88%;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5)">'
    +'<button id="lbNext" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:28px;cursor:pointer">›</button>'
    +'<div id="lbCount" style="position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;padding:5px 14px;border-radius:999px;font-size:13px"></div>';
  document.body.appendChild(o);
  o.addEventListener('click',e=>{ if(e.target===o) o.style.display='none'; });
  document.getElementById('lbClose').onclick=()=>{ o.style.display='none'; };
  document.getElementById('lbPrev').onclick=e=>{ e.stopPropagation(); lbStep(-1); };
  document.getElementById('lbNext').onclick=e=>{ e.stopPropagation(); lbStep(1); };
  document.addEventListener('keydown',e=>{ if(o.style.display!=='flex') return; if(e.key==='ArrowLeft') lbStep(-1); else if(e.key==='ArrowRight') lbStep(1); else if(e.key==='Escape') o.style.display='none'; });
  let sx=0; o.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true});
  o.addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40) lbStep(dx<0?1:-1); });
}
function lbStep(d){ if(!LB.imgs.length) return; LB.idx=(LB.idx+d+LB.imgs.length)%LB.imgs.length; showLB(); }
function showLB(){
  document.getElementById('lightboxImg').src=LB.imgs[LB.idx];
  const multi=LB.imgs.length>1;
  document.getElementById('lbPrev').style.display=multi?'':'none';
  document.getElementById('lbNext').style.display=multi?'':'none';
  const c=document.getElementById('lbCount'); c.style.display=multi?'':'none'; c.textContent=(LB.idx+1)+' / '+LB.imgs.length;
}
function lightbox(imgEl){
  ensureLightbox();
  const cont=imgEl.parentElement;
  LB.imgs=[...cont.querySelectorAll('img')].map(i=>i.src);
  LB.idx=Math.max(0, LB.imgs.indexOf(imgEl.src));
  showLB();
  document.getElementById('lightbox').style.display='flex';
}
// ===== แนบรูปงานแบบหลายรูป (ถ่ายทีละรูปสะสม / เลือกหลายรูปได้) =====
let TASK_PHOTOS={};
function renderTaskThumbs(id){
  const arr=TASK_PHOTOS[id]||[]; const t=$('mt_'+id); const c=$('mc_'+id);
  if(t) t.innerHTML=arr.map((u,i)=>'<span style="position:relative;display:inline-block;margin:0 6px 6px 0"><img src="'+esc(u)+'" style="width:56px;height:56px;object-fit:cover;border-radius:8px;display:block"><button type="button" onclick="rmTaskPhoto('+id+','+i+')" style="position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;cursor:pointer">×</button></span>').join('');
  if(c) c.textContent = arr.length ? ('แนบแล้ว '+arr.length+' รูป') : 'ยังไม่ได้แนบรูป';
}
function rmTaskPhoto(id,i){ if(TASK_PHOTOS[id]){ TASK_PHOTOS[id].splice(i,1); renderTaskThumbs(id); } }
function wireTaskInput(inpId, taskId){
  const inp=$(inpId); if(!inp) return;
  inp.addEventListener('change',async()=>{
    if(!inp.files||!inp.files.length) return;
    const added=await filesToData(inp.files);
    TASK_PHOTOS[taskId]=(TASK_PHOTOS[taskId]||[]).concat(added);
    inp.value='';            // เคลียร์เพื่อให้ถ่าย/เลือกเพิ่มได้อีก
    renderTaskThumbs(taskId);
  });
}

let EMP=null, BRANCHES={};
async function loadBranches(){ try{ const c=await window.HR.loadConfig(); (c.branches||[]).forEach(b=>BRANCHES[b.branch_id]=b.name); }catch(e){} }
function branchName(id){ return BRANCHES[id]||id||'(ไม่มีสาขาประจำ)'; }

$('goBtn').onclick=async()=>{
  const id=$('empId').value.trim(); if(!id){ toast('err','กรอกรหัสพนักงาน'); return; }
  $('goBtn').innerHTML='<span class="spin"></span>';
  try{
    const emp=await window.HR.lookupEmployee(id);
    if(!emp){ toast('err','ไม่พบรหัสพนักงานนี้'); $('goBtn').textContent='เริ่ม'; return; }
    if(emp.active===false){ toast('err','รหัสนี้ถูกปิดใช้งาน'); $('goBtn').textContent='เริ่ม'; return; }
    EMP=emp;
    $('m_nm').textContent=emp.nickname||emp.name;
    $('m_sub').textContent='รหัส '+emp.emp_id+' · '+branchName(emp.branch_id);
    show('step_menu');
  }catch(e){ toast('err','เกิดข้อผิดพลาด'); }
  $('goBtn').textContent='เริ่ม';
};
$('changeBtn').onclick=()=>{ EMP=null; $('empId').value=''; show('step_id'); };

// ============ เมนู 1: หัวหน้าผลัด ============
$('bMenu1').onclick=openM1;
$('l_back').onclick=()=>show('step_menu');
async function openM1(){
  show('step_m1'); $('m1_panel').classList.add('hide');
  $('m1_gate').innerHTML='<div class="card muted">กำลังโหลด…</div>';
  let info; try{ info=await window.HR.leaderInfo(EMP.emp_id); }catch(e){ $('m1_gate').innerHTML='<div class="card muted">'+esc(e.message||'โหลดไม่สำเร็จ')+'</div>'; return; }
  $('l_nm').textContent=EMP.nickname||EMP.name;
  $('l_sub').textContent='กะ '+esc(info.shift_name||'-')+' · '+branchName(info.branch_id);
  if(info.isMe){ $('m1_gate').innerHTML=''; openLeaderPanel(); return; }
  const cur=info.currentLeader;
  $('m1_gate').innerHTML='<div class="card">'
    +(cur?('<div style="margin-bottom:8px">หัวหน้าผลัดวันนี้คือ <b>'+esc(cur.name)+'</b></div><div class="muted" style="margin-bottom:12px">ถ้าจะรับช่วงคุมผลัดแทน กดยืนยันด้านล่าง (คนในผลัดเปลี่ยนกันได้)</div>')
        :('<div style="margin-bottom:8px">กะนี้ยังไม่มีหัวหน้าผลัด</div><div class="muted" style="margin-bottom:12px">กดยืนยันเพื่อรับผิดชอบคุมผลัดทั้งหมดในกะนี้</div>'))
    +'<button class="btn btn-pri" id="l_confirm">'+(cur?'รับช่วงคุมผลัดแทน':'ยืนยันรับผิดชอบคุมผลัด')+'</button></div>';
  $('l_confirm').onclick=async()=>{
    if(!confirm('ยืนยันรับผิดชอบเป็นหัวหน้าผลัดกะนี้?')) return;
    try{ await window.HR.leaderConfirm(EMP.emp_id); toast('ok','รับเป็นหัวหน้าผลัดแล้ว'); $('m1_gate').innerHTML=''; openLeaderPanel(); }
    catch(e){ toast('err',(e.message||'ไม่สำเร็จ')); }
  };
}
let LBOARD=null;
async function openLeaderPanel(){
  $('m1_panel').classList.remove('hide');
  $('l_board').innerHTML='<div class="card muted">กำลังโหลด…</div>';
  let b; try{ b=await window.HR.getShiftBoard(EMP.emp_id, null); LBOARD=b; }catch(e){ $('l_board').innerHTML='<div class="card muted">'+esc(e.message||'')+'</div>'; return; }
  const inShift=new Set((b.members||[]).map(m=>m.emp_id));
  const addable=(b.colleagues||[]).filter(c=>!inShift.has(c.emp_id));
  $('l_addemp').innerHTML=addable.length?addable.map(c=>'<option value="'+esc(c.emp_id)+'">'+esc(c.name)+'</option>').join(''):'<option value="">(ทุกคนอยู่ในกะแล้ว)</option>';
  const memOpts=(b.members||[]).map(m=>'<option value="'+esc(m.emp_id)+'">'+esc(m.name)+'</option>').join('');
  if(!b.defs.length){ $('l_board').innerHTML='<div class="card muted">กะนี้ยังไม่มีรายการงาน (HR ตั้งที่ "ตั้งค่ากะ")</div>'; return; }
  $('l_board').innerHTML=b.defs.map(d=>{
    const a=d.assignment; let body='<div style="font-weight:600;margin-bottom:6px">'+esc(d.title)+(d.require_photo?' <span class="pill muted2">📷</span>':'')+'</div>';
    if(a){ const s=ST(a.status); body+='<div style="margin-bottom:6px"><span class="pill '+s[1]+'">'+s[0]+'</span> <span class="muted">'+esc(a.emp_name||a.emp_id)+'</span></div>'; }
    if(!(b.members||[]).length) body+='<div class="muted">ยังไม่มีคนในกะ — เพิ่มคนด้านบนก่อน</div>';
    else body+='<div class="row2"><select id="lg_'+d.id+'">'+memOpts+'</select><button class="btn btn-sec btn-sm" style="flex:none" data-give="'+d.id+'">'+(a?'เปลี่ยน':'มอบ')+'</button></div>';
    return '<div class="card">'+body+'</div>';
  }).join('');
  document.querySelectorAll('[data-give]').forEach(btn=>btn.onclick=async()=>{
    const def=Number(btn.dataset.give), to=($('lg_'+def)||{}).value; if(!to){ toast('err','เลือกคนก่อน'); return; }
    try{ await window.HR.assignColleague({ byEmpId:EMP.emp_id, toEmpId:to, task_def_id:def, shiftId:b.shift }); toast('ok','แจกงานแล้ว'); openLeaderPanel(); }
    catch(e){ toast('err',(e.message||'ไม่สำเร็จ')); }
  });
}
$('l_addbtn').onclick=async()=>{
  const emp=($('l_addemp')||{}).value; if(!emp){ toast('err','ไม่มีคนให้เพิ่ม'); return; }
  try{ await window.HR.addShiftMember({ branchId:EMP.branch_id, shiftId:(LBOARD&&LBOARD.shift)||null, empId:emp, workDate:(LBOARD&&LBOARD.work_date)||null }); toast('ok','เพิ่มเข้ากะแล้ว'); openLeaderPanel(); }
  catch(e){ toast('err',(e.message||'ไม่สำเร็จ')); }
};

// ============ เมนู 2: งานที่ได้รับมอบหมาย ============
$('bMenu2').onclick=openM2;
$('my_back').onclick=()=>show('step_menu');
async function openM2(){
  show('step_m2'); $('my_nm').textContent=EMP.nickname||EMP.name;
  $('my_body').innerHTML='<div class="card muted">กำลังโหลด…</div>';
  let r; try{ r=await window.HR.getMyAssignments(EMP.emp_id); }catch(e){ $('my_body').innerHTML='<div class="card muted">'+esc(e.message||'')+'</div>'; return; }
  $('my_sub').textContent='กะ '+esc(r.shift_name||'-')+(r.leader?(' · หัวหน้าผลัด: '+esc(r.leader.name)):'');
  let html='';
  // งานของฉัน
  html+='<h3 class="sec">งานของฉัน</h3>';
  if(!r.mine.length) html+='<div class="card muted">ยังไม่มีงานที่มอบหมายให้คุณ</div>';
  else html+=r.mine.map(a=>{
    const s=ST(a.status); const canDo=(a.status==='todo'||a.status==='sent_back');
    const min=(r.unassigned.find(x=>x.id===a.task_def_id)||{}).min_photos; // อาจ undefined → ใช้ require_photo
    let c='<div class="card"><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><div style="font-weight:600;flex:1">'+esc(a.title)+'</div><span class="pill '+s[1]+'">'+s[0]+'</span></div>';
    if(a.status==='sent_back'&&a.review_note) c+='<div style="color:#b91c1c;font-size:13px;margin-bottom:8px">⚠️ ตีกลับ: '+esc(a.review_note)+(a.reviewer?(' (โดย '+esc(a.reviewer)+')'):'')+'</div>';
    if(!canDo) c+=thumbsHtml(a.photos);
    if(!canDo&&a.emp_note) c+='<div class="muted" style="margin-top:6px">หมายเหตุ: '+esc(a.emp_note)+'</div>';
    if(canDo){
      c+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">'
        +'<label class="btn btn-sec" style="font-size:13px;cursor:pointer">📷 ถ่ายรูป<input type="file" accept="image/*" capture="environment" id="mfc_'+a.id+'" style="display:none"></label>'
        +'<label class="btn btn-sec" style="font-size:13px;cursor:pointer">🖼️ แกลเลอรี<input type="file" accept="image/*" multiple id="mfg_'+a.id+'" style="display:none"></label>'
        +'</div>'
        +'<div class="thumbs" id="mt_'+a.id+'" style="margin:2px 0 4px"></div>'
        +'<div class="muted" id="mc_'+a.id+'" style="margin-bottom:8px">'+(a.require_photo?'ต้องแนบรูป — ถ่าย/เลือกได้หลายรูป':'แนบรูปได้ตามต้องการ')+'</div>'
        +'<input type="text" id="mn_'+a.id+'" placeholder="หมายเหตุ (ถ้ามี)" style="margin-bottom:8px">'
        +'<button class="btn btn-pri" data-sub="'+a.id+'">ส่งงาน</button>';
    }
    return c+'</div>';
  }).join('');
  // งานที่ยังว่าง (รายการ)
  html+='<h3 class="sec">งานที่ยังว่าง (ดึงมาทำเองได้)</h3>';
  if(!r.unassigned.length) html+='<div class="muted" style="padding:4px 2px">ไม่มีงานว่าง</div>';
  else html+=r.unassigned.map(d=>'<div class="listrow"><div class="t">'+esc(d.title)+(d.min_photos>0?' <span class="pill muted2">📷'+d.min_photos+'</span>':'')+'</div><button class="btn btn-sec btn-sm" data-pull="'+d.id+'">ดึงมาทำ</button></div>').join('');
  // สถานะทีม
  html+='<h3 class="sec">สถานะทีมในผลัด</h3>';
  if(!r.team.length) html+='<div class="muted" style="padding:4px 2px">ยังไม่มีการมอบหมาย</div>';
  else html+='<div class="card">'+r.team.map(a=>{const s=ST(a.status);return '<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)"><div style="flex:1;font-size:13.5px">'+esc(a.title)+' <span class="muted">· '+esc(a.emp_name||a.emp_id)+'</span></div><span class="pill '+s[1]+'">'+s[0]+'</span></div>';}).join('')+'</div>';
  $('my_body').innerHTML=html;
  // สะสมรูปแบบหลายรูป (ถ่ายทีละรูป/เลือกหลายรูป → append) + พรีวิว
  TASK_PHOTOS={};
  r.mine.forEach(a=>{ if(a.status==='todo'||a.status==='sent_back'){
    TASK_PHOTOS[a.id]=[];
    wireTaskInput('mfc_'+a.id, a.id);   // กล้อง
    wireTaskInput('mfg_'+a.id, a.id);   // แกลเลอรี
  }});
  document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=async()=>{
    const id=Number(b.dataset.sub); const note=($('mn_'+id)||{}).value||'';
    b.innerHTML='<span class="spin"></span>';
    try{ const photos = TASK_PHOTOS[id]||[]; await window.HR.submitTaskMulti({ id, empId:EMP.emp_id, photos, note }); toast('ok','ส่งงานแล้ว'); openM2(); }
    catch(e){ toast('err',(e.message||'ไม่สำเร็จ')); b.textContent='ส่งงาน'; }
  });
  document.querySelectorAll('[data-pull]').forEach(b=>b.onclick=async()=>{
    try{ await window.HR.pullTask({ empId:EMP.emp_id, task_def_id:Number(b.dataset.pull) }); toast('ok','ดึงงานมาเป็นของคุณแล้ว'); openM2(); }
    catch(e){ toast('err',(e.message||'ไม่สำเร็จ')); }
  });
}

// ============ เมนู 3: ตรวจผลัดก่อนหน้า ============
$('bMenu3').onclick=openM3;
$('pv_back').onclick=()=>show('step_menu');
async function openM3(){
  show('step_m3'); $('pv_nm').textContent=EMP.nickname||EMP.name;
  $('pv_body').innerHTML='<div class="card muted">กำลังโหลด…</div>';
  let r; try{ r=await window.HR.getPrevShiftReview(EMP.emp_id); }catch(e){ $('pv_body').innerHTML='<div class="card muted">'+esc(e.message||'')+'</div>'; return; }
  $('pv_sub').textContent='ผลัดของคุณ: '+esc(r.cur_name||'-');
  if(r.isMain===false){ $('pv_body').innerHTML='<div class="card warn">กะของคุณเป็น <b>กะพิเศษ</b> ไม่อยู่ในวงจรตรวจรับผลัด (เช้า/บ่าย/ดึก)<br><span class="muted">ถ้าต้องการให้กะนี้ตรวจผลัดก่อนหน้าได้ ให้ HR ตั้ง "ผลัดหลัก" ของกะนี้ในหน้าตั้งค่ากะ</span></div>'; return; }
  let head='<div class="card"><div style="font-weight:600">ตรวจงานผลัดก่อนหน้า: '+esc(r.prev_name||'-')+'</div><div class="muted">วันที่ '+esc(String(r.prev_date))+'</div>'
    +(r.canReview?'<div class="pill ok" style="margin-top:6px">คุณเป็นหัวหน้าผลัด — ตรวจ/ตีกลับได้</div>':'<div class="pill warn" style="margin-top:6px">ดูได้อย่างเดียว (เฉพาะหัวหน้าผลัดตรวจได้)</div>')+'</div>';
  if(!r.tasks.length){ $('pv_body').innerHTML=head+'<div class="card muted">ผลัดก่อนหน้าไม่มีงานบันทึกไว้</div>'; return; }
  $('pv_body').innerHTML=head+r.tasks.map(a=>{
    const s=ST(a.status); let c='<div class="card"><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><div style="font-weight:600;flex:1">'+esc(a.title)+'</div><span class="pill '+s[1]+'">'+s[0]+'</span></div>';
    c+='<div class="muted">ผู้ทำ: '+esc(a.emp_name||a.emp_id||'—')+(a.submitted_at?(' · ส่ง '+fmt(a.submitted_at)):'')+'</div>';
    if(a.review_note) c+='<div style="color:#b45309;font-size:13px;margin-top:4px">↳ '+esc(a.review_note)+'</div>';
    c+=thumbsHtml(a.photos);
    if(r.canReview && a.status==='submitted') c+='<div class="row2" style="margin-top:10px"><button class="btn btn-pri btn-sm" data-ap="'+a.id+'">✅ ผ่าน</button><button class="btn btn-warn btn-sm" data-rb="'+a.id+'">⤴ ตีกลับ</button></div>';
    return c+'</div>';
  }).join('');
  document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>doPrevReview(Number(b.dataset.ap),'approved'));
  document.querySelectorAll('[data-rb]').forEach(b=>b.onclick=()=>{ const note=prompt('ระบุสิ่งที่ต้องแก้ (ส่งกลับให้ผลัดก่อนหน้า):'); if(note===null) return; doPrevReview(Number(b.dataset.rb),'sent_back',note); });
}
async function doPrevReview(id,status,note){
  try{ await window.HR.reviewPrevTask({ reviewerId:EMP.emp_id, id, status, note }); toast('ok', status==='approved'?'อนุมัติแล้ว':'ตีกลับแล้ว'); openM3(); }
  catch(e){ toast('err',(e.message||'ไม่สำเร็จ')); }
}

// ============ รายงานรับส่งผลัด ============
function todayStr(){ return new Date(Date.now()+7*3600*1000).toISOString().slice(0,10); }
$('bReport').onclick=()=>{ show('step_report'); $('rp_branch').textContent=branchName(EMP.branch_id); if(!$('rp_date').value)$('rp_date').value=todayStr(); loadReport(); };
$('rp_back').onclick=()=>show('step_menu');
$('rp_go').onclick=loadReport;
async function loadReport(){
  $('rp_body').innerHTML='<div class="card muted">กำลังโหลด…</div>';
  let r; try{ r=await window.HR.getHandoverReport({ empId:EMP.emp_id, date:$('rp_date').value }); }catch(e){ $('rp_body').innerHTML='<div class="card muted">'+esc(e.message||'')+'</div>'; return; }
  if(!r.rows.length){ $('rp_body').innerHTML='<div class="card muted">วันที่เลือกยังไม่มีงาน</div>'; return; }
  const shName={}; const order=(r.shifts||[]).map(s=>s.shift_id); (r.shifts||[]).forEach(s=>shName[s.shift_id]=s.name);
  const groups={}; r.rows.forEach(a=>{ (groups[a.shift_id||'']=groups[a.shift_id||'']||[]).push(a); });
  let html=''; Object.keys(groups).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).forEach(k=>{
    html+='<h3 class="sec">กะ '+esc(shName[k]||k||'-')+'</h3>';
    html+=groups[k].map(a=>{ const s=ST(a.status);
      return '<div class="card"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><div style="font-weight:600;flex:1">'+esc(a.title)+'</div><span class="pill '+s[1]+'">'+s[0]+'</span></div>'
        +'<div class="muted">ผู้ทำ: '+esc(a.emp_name||a.emp_id||'—')+(a.submitted_at?(' · ส่ง '+fmt(a.submitted_at)):'')+'</div>'
        +'<div class="muted">ตรวจโดย: '+esc(a.reviewer||'—')+(a.reviewed_at?(' · '+fmt(a.reviewed_at)):'')+'</div>'
        +((a.sent_back_count>0)?'<div style="color:#b45309;font-size:13px">มีการส่งแก้ไข '+a.sent_back_count+' ครั้ง</div>':'')
        +(a.review_note?'<div style="color:#b45309;font-size:13px">↳ '+esc(a.review_note)+'</div>':'')
        +thumbsHtml(a.photos)+'</div>';
    }).join('');
  });
  $('rp_body').innerHTML=html;
}

loadBranches();
</script>
