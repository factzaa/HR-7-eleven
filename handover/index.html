<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>งานผลัด · 7-Eleven</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--green:#00703c;--green-d:#00582f;--green-soft:#e7f3ec;--orange:#f5821f;--red:#e11f26;--bg:#eef1ec;--line:#dbe2dc;--muted:#6b756d;--txt:#1b2a20;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Kanit','Anuphan',sans-serif;background:var(--bg);color:var(--txt);min-height:100dvh;}
  .wrap{max-width:480px;margin:0 auto;min-height:100dvh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.06);}
  .top{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;padding:18px;display:flex;align-items:center;gap:12px;}
  .top .ic{font-size:24px;} .top h1{font-size:18px;font-weight:600;flex:1;}
  .home{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.15);padding:6px 11px;border-radius:9px;}
  .body{padding:18px;flex:1;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 2px;font-weight:500;}
  input[type=text],textarea,select{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:11px;padding:12px 13px;background:#fff;color:var(--txt);}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
  textarea{resize:vertical;min-height:48px;}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:transform .08s;}
  .btn:active{transform:scale(.98);}
  .btn-pri{background:var(--green);color:#fff;} .btn-sec{background:#fff;color:var(--txt);border:1.5px solid var(--line);}
  .btn-danger{background:#fff;color:var(--red);border:1.5px solid #f1bcbe;} .btn-warn{background:#fff7ed;color:#9a3412;border:1.5px solid #fed7aa;}
  .btn-sm{padding:9px 12px;font-size:14px;width:auto;}
  .row2{display:flex;gap:8px;} .row2>*{flex:1;}
  .who{display:flex;align-items:center;gap:12px;background:var(--green-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;}
  .who .nm{font-weight:600;font-size:16px;} .who .sub{font-size:12.5px;color:var(--green-d);}
  .who .ch{margin-left:auto;font-size:12.5px;color:var(--green-d);background:#fff;border:1px solid var(--green-soft);padding:5px 10px;border-radius:8px;cursor:pointer;}
  h3.sec{font-size:13px;color:var(--green-d);font-weight:700;margin:16px 2px 8px;}
  .pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;}
  .ok{background:var(--green-soft);color:var(--green-d);} .bad{background:#fdeaea;color:var(--red);} .warn{background:#fff4e0;color:#a06515;} .muted2{background:#eef0ec;color:var(--muted);}
  .photo{width:100%;border-radius:11px;border:1px solid var(--line);margin-top:8px;display:none;}
  .thumbs{display:flex;gap:6px;overflow-x:auto;padding:2px 0;margin-top:6px;-webkit-overflow-scrolling:touch;}
  .thumbs img{height:66px;border-radius:8px;flex:none;border:1px solid var(--line);cursor:pointer;}
  .listrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:8px;}
  .stephead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:#00582f;
    background:#eaf5ef;border:1px solid #cfe6da;border-radius:10px;padding:7px 11px;margin:14px 0 8px;line-height:1.45}
  .stephead .n{flex:none;width:22px;height:22px;border-radius:7px;background:#00582f;color:#fff;
    display:grid;place-items:center;font-size:12px}
  .stephead .c{margin-left:auto;font-weight:600;color:#5b7d6b;font-size:12px}
  /* หัวข้อขั้นตอนแบบพับเก็บได้ */
  .stepsec{margin:14px 0 8px}
  .stepsec>.stephead{cursor:pointer;-webkit-user-select:none;user-select:none;margin:0;-webkit-tap-highlight-color:transparent}
  .stepsec>.stephead:active{background:#dceee4}
  .stepsec>.stephead>.cv{flex:none;width:17px;height:17px;color:#3f7a5c;transition:transform .16s ease}
  .stepsec.col>.stephead>.cv{transform:rotate(-90deg)}
  .stepsec>.stepbody{margin-top:8px}
  .stepsec.col>.stepbody{display:none}
  .stepsec>.stephead>.c{margin-left:auto}
  .stepdone>.stephead{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
  .stepdone>.stephead>.n{background:#16a34a}
  .stepdone>.stephead>.cv{color:#16a34a}
  .taskcard{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
  .taskcard .top{display:flex;align-items:center;gap:10px}
  .taskcard .t{flex:1;font-size:14.5px;font-weight:600;line-height:1.5}
  .listrow .t{flex:1;font-size:14.5px;}
  .muted{color:var(--muted);font-size:13.5px;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:12px 18px;border-radius:11px;color:#fff;font-weight:500;font-size:14.5px;display:none;z-index:50;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.18);text-align:center;}
  .toast.ok{background:var(--green);} .toast.err{background:var(--red);} .toast.show{display:block;}
  .hide{display:none;} .spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .mainbtn{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;font-size:16px;font-weight:600;width:100%;text-align:left;}
  .mainbtn .e{font-size:22px;} .mainbtn .d{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px;}
  .mainbtn.pri{background:var(--green);color:#fff;border-color:var(--green);} .mainbtn.pri .d{color:#d7e7dd;}
  .imgbtn{display:block;width:100%;padding:0;margin:0 0 12px;border:none;background:none;cursor:pointer;border-radius:14px;}
  .imgbtn img{display:block;width:100%;height:auto;border-radius:14px;}
  .imgbtn:active{transform:scale(.99);}
</style>

      <div class="card" style="padding:12px"><label>วันที่</label><input id="rp_date" type="date"><div style="height:8px"></div><button class="btn btn-pri btn-sm" id="rp_go" style="width:100%">ดูรายงาน</button></div>

<script>
const $=id=>document.getElementById(id);
function toast(t,m){const e=$('toast');e.textContent=m;e.className='toast show '+(t||'ok');setTimeout(()=>e.className='toast',3000);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function show(id){['step_id','step_menu','step_m1','step_m2','step_m3','step_goods','step_report'].forEach(s=>$(s).classList.add('hide'));$(id).classList.remove('hide');}
function fmt(t){try{return new Date(t).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'});}catch(e){return '';}}
function ST(s){return s==='approved'?['ผ่านแล้ว','ok']:s==='submitted'?['รอตรวจ','warn']:s==='sent_back'?['ตีกลับ','bad']:s==='closed'?['ปิดงาน · ทำไม่ได้','muted2']:['มอบหมายแล้ว','muted2'];}
// ★ ย่อรูป + ปั๊มวันเวลาก่อนอัปโหลด
//   เดิม: ถ้าเครื่องถอดรหัสรูปไม่ได้ (HEIC จากไอโฟน / ไฟล์ใหญ่เกิน / แรมไม่พอ) img.onload จะไม่ยิงเลย
//   → Promise ค้างตลอดกาล → รูปหายเงียบ ๆ โดยไม่มี error (พนักงานคิดว่าแนบแล้ว แต่ในระบบไม่มีรูป)
//   ใหม่: มี onerror + timeout + fallback ใช้ไฟล์ต้นฉบับ · ถอดรหัสไม่ได้จริง ๆ จะคืน null เพื่อให้ฟ้องได้
// ===== แก้รูปกลับหัว / ตะแคง (15 ก.ย. 69) =====
// กล้องมือถือไม่ได้หมุนไฟล์จริง แต่เขียน "ทิศที่ต้องหมุน" ไว้ใน EXIF แทน
// เบราว์เซอร์ในแอป (LINE ฯลฯ) บางตัวไม่อ่าน EXIF → พอเอาไปวาดลง canvas รูปเลยกลับหัว
// วิธีแก้: อ่าน EXIF เอง แล้วหมุนไฟล์ให้ตั้งตรงก่อน ค่อยส่งเข้าขั้นตอนย่อ/ปั๊มวันเวลา
function _exifOri(file){
  return new Promise(function(res){
    try{
      if(!file || !/^image\/jpe?g$/i.test(String(file.type||''))) return res(1);
      var r=new FileReader();
      r.onerror=function(){ res(1); };
      r.onload=function(e){
        try{
          var v=new DataView(e.target.result), len=v.byteLength, off=2;
          if(len<4 || v.getUint16(0,false)!==0xFFD8) return res(1);
          while(off+4<=len){
            var marker=v.getUint16(off,false); off+=2;
            if(marker===0xFFE1){
              if(off+8>len || v.getUint32(off+2,false)!==0x45786966) return res(1);
              var tiff=off+8;
              if(tiff+8>len) return res(1);
              var little=(v.getUint16(tiff,false)===0x4949);
              var ifd=tiff+v.getUint32(tiff+4,little);
              if(ifd+2>len) return res(1);
              var n=v.getUint16(ifd,little);
              for(var i=0;i<n;i++){
                var ent=ifd+2+i*12;
                if(ent+12>len) break;
                if(v.getUint16(ent,little)===0x0112){
                  var o=v.getUint16(ent+8,little);
                  return res((o>=1&&o<=8)?o:1);
                }
              }
              return res(1);
            }
            if((marker & 0xFF00)!==0xFF00) return res(1);
            if(off+2>len) return res(1);
            off += v.getUint16(off,false);
          }
          res(1);
        }catch(_e){ res(1); }
      };
      r.readAsArrayBuffer(file.slice(0, 262144));
    }catch(_e){ res(1); }
  });
}
function _orientFile(file){
  var work=(async function(){
    var ori=await _exifOri(file);
    if(!(ori>1)) return file;                       // ตั้งตรงอยู่แล้ว
    if(typeof createImageBitmap!=='function') return file;
    var bmp;
    try{ bmp=await createImageBitmap(file,{imageOrientation:'none'}); }
    catch(_e){ return file; }                       // เบราว์เซอร์เก่า → ปล่อยให้ทางเดิมจัดการ
    try{
      var w=bmp.width, h=bmp.height, sw=(ori>=5)?h:w, sh=(ori>=5)?w:h;
      var c=document.createElement('canvas'); c.width=sw; c.height=sh;
      var x=c.getContext('2d');
      if(ori===2) x.transform(-1,0,0,1,w,0);
      else if(ori===3) x.transform(-1,0,0,-1,w,h);
      else if(ori===4) x.transform(1,0,0,-1,0,h);
      else if(ori===5) x.transform(0,1,1,0,0,0);
      else if(ori===6) x.transform(0,1,-1,0,h,0);
      else if(ori===7) x.transform(0,-1,-1,0,h,w);
      else if(ori===8) x.transform(0,-1,1,0,0,w);
      x.drawImage(bmp,0,0);
      var blob=await new Promise(function(r){ c.toBlob(r,'image/jpeg',0.92); });
      return blob || file;
    }catch(_e){ return file; }
    finally{ try{ bmp.close && bmp.close(); }catch(_e2){} }
  })();
  // กันค้าง: ถ้าหมุนไม่เสร็จใน 10 วิ ใช้ไฟล์เดิมไปก่อน
  return Promise.race([ work, new Promise(function(r){ setTimeout(function(){ r(file); },10000); }) ])
    .catch(function(){ return file; });
}
// ★ 17 ก.ย. 69 — กลับไปใช้แบบเดิม ไม่หมุนรูปเองตาม EXIF
//   เบราว์เซอร์สมัยใหม่หมุนรูปตาม EXIF ให้เองอยู่แล้วตอนสร้างภาพ
//   พอเราหมุนซ้ำเอง รูปเลยหมุนสองรอบ — ออกมาเอียง/กลับด้านแทบทุกรูป
//   คง _exifOri/_orientFile ไว้เฉย ๆ เผื่อเครื่องเก่าที่ไม่หมุนให้ จะได้เปิดกลับได้ทันที
async function resizeFile(file){
  return _resizeFileRaw(file);
}
function _resizeFileRaw(file){
  return new Promise(res=>{
    let done=false;
    const finish=(v)=>{ if(done) return; done=true; res(v); };
    const to=setTimeout(()=>finish(null), 15000);          // กันค้างถาวร

    const r=new FileReader();
    r.onerror=()=>{ clearTimeout(to); finish(null); };
    r.onload=ev=>{
      const raw=ev.target.result;
      const img=new Image();
      // ถอดรหัสรูปไม่ได้ → ใช้ไฟล์ต้นฉบับไปเลย ถ้าเป็น jpeg/png (ถ้าเป็น HEIC จะคืน null ให้ฟ้อง)
      img.onerror=()=>{ clearTimeout(to); finish(/^data:image\/(jpeg|jpg|png)/i.test(String(raw))?raw:null); };
      img.onload=()=>{
        clearTimeout(to);
        try{
          const max=1000,sc=Math.min(1,max/Math.max(img.width,img.height));
          const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
          const x=c.getContext('2d'); x.drawImage(img,0,0,c.width,c.height);
          // ปั๊มวันเวลา + สาขา + ผู้ถ่าย ลงบนรูป (กันใช้รูปซ้ำ/รูปเก่า)
          try{
            const now=new Date();
            const ts=now.toLocaleString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' น.';
            const sub=(typeof EMP!=='undefined'&&EMP)?((EMP.nickname||EMP.name||'')+' · '+branchName(EMP.branch_id)):'';
            const pad=Math.round(c.width*0.022), fs=Math.max(13,Math.round(c.width*0.033));
            const bh=fs*2+pad*2.4;
            x.fillStyle='rgba(0,0,0,.5)'; x.fillRect(0,c.height-bh,c.width,bh);
            x.textBaseline='alphabetic'; x.fillStyle='#fff';
            x.font='700 '+fs+'px Anuphan,Sarabun,sans-serif'; x.fillText(ts, pad, c.height-fs-pad*0.6);
            if(sub){ x.font='400 '+Math.round(fs*0.8)+'px Anuphan,Sarabun,sans-serif'; x.fillText(sub, pad, c.height-pad*0.7); }
          }catch(e){}
          const out=c.toDataURL('image/jpeg',0.85);         // ★ บังคับเป็น JPEG เสมอ (LINE ไม่รองรับ HEIC/WebP)
          finish(/^data:image\/jpeg/i.test(out) ? out : (/^data:image\/(jpeg|jpg|png)/i.test(String(raw))?raw:null));
        }catch(e){ finish(/^data:image\/(jpeg|jpg|png)/i.test(String(raw))?raw:null); }
      };
      img.src=raw;
    };
    r.readAsDataURL(file);
  });
}
// ★ คืนเฉพาะรูปที่แปลงสำเร็จ + ฟ้องทันทีถ้ามีรูปที่ใช้ไม่ได้ (เดิมหายเงียบ)
async function filesToData(files){
  const out=[]; let failed=0;
  for(const f of files){
    const d=await resizeFile(f);
    if(d) out.push(d); else failed++;
  }
  if(failed){
    toast('err', failed+' รูปใช้ไม่ได้ (ไฟล์เสีย หรือเป็นไฟล์ HEIC จากไอโฟน) — ให้ถ่ายใหม่ด้วยกล้องในแอป หรือตั้งกล้องไอโฟนเป็น "รูปแบบที่เข้ากันได้มากที่สุด"');
  }
  return out;
}

// ===== ร่างงานค้าง (WIP) — กันรูป/หมายเหตุหายเวลาสลับแอป/รีโหลด/คนอื่นหยิบมือถือไปใช้ =====
//   เก็บลง IndexedDB (รองรับรูปขนาดใหญ่) · กลับมาทำต่อได้โดยไม่ต้องถ่ายใหม่ · ลบเมื่อส่งงานสำเร็จ
const WIP_DB='hr_wip', WIP_ST='drafts';
function wipOpen(){ return new Promise((res,rej)=>{ let r; try{ r=indexedDB.open(WIP_DB,1);}catch(e){ return rej(e); } r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains(WIP_ST)) db.createObjectStore(WIP_ST); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function wipSave(key,val){ try{ const db=await wipOpen(); await new Promise((res,rej)=>{ const tx=db.transaction(WIP_ST,'readwrite'); tx.objectStore(WIP_ST).put({...val,at:Date.now()},key); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }catch(e){} }
async function wipGet(key){ try{ const db=await wipOpen(); return await new Promise(res=>{ const tx=db.transaction(WIP_ST,'readonly'); const g=tx.objectStore(WIP_ST).get(key); g.onsuccess=()=>res(g.result||null); g.onerror=()=>res(null); }); }catch(e){ return null; } }
async function wipDel(key){ try{ const db=await wipOpen(); await new Promise(res=>{ const tx=db.transaction(WIP_ST,'readwrite'); tx.objectStore(WIP_ST).delete(key); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} }
async function wipCleanup(maxAgeMs){ try{ const db=await wipOpen(); const tx=db.transaction(WIP_ST,'readwrite'); const st=tx.objectStore(WIP_ST); st.openCursor().onsuccess=e=>{ const c=e.target.result; if(!c) return; const v=c.value; if(!v||!v.at||(Date.now()-v.at)>maxAgeMs) st.delete(c.key); c.continue(); }; }catch(e){} }
// ★ แก้ 15 ก.ย. 69 — คีย์ร่างต้องมี emp_id ผสม ไม่งั้นรูปของคนก่อนถูก restore ให้คนใหม่ส่งในชื่อตัวเอง
function _dkey(k){ return ((typeof EMP!=='undefined'&&EMP&&EMP.emp_id)?EMP.emp_id:'x')+':'+k; }
function taskDraftSave(id){ wipSave('t:'+_dkey(id),{ photos:TASK_PHOTOS[id]||[], note:($('mn_'+id)||{}).value||'' }); }
// ตัวช่วยกลางสำหรับทุกจุดที่ถ่ายรูปส่ง (งานพิเศษ/เชลฟ์/งานแก้/งาน ผจก.) — arrKey=คีย์ใน TASK_PHOTOS
function wipPut(storeKey, arrKey, noteId){ wipSave(storeKey, { photos: TASK_PHOTOS[arrKey]||[], note: (noteId?(($(noteId)||{}).value||''):'') }); }
function wipRestore(storeKey, arrKey, noteId, renderFn, renderArg){ wipGet(storeKey).then(d=>{ if(!d) return; if(Array.isArray(d.photos)&&d.photos.length) TASK_PHOTOS[arrKey]=d.photos.slice(); if(noteId){ const el=$(noteId); if(el && d.note && !el.value) el.value=d.note; } if(renderFn){ try{ renderFn(renderArg); }catch(e){} } }); }
try{ wipCleanup(3*86400000); }catch(e){}   // ล้างร่างเก่าเกิน 3 วัน

// ===== แนบรูปงานแบบหลายรูป (ถ่ายทีละรูปสะสม / เลือกหลายรูปได้) =====
let TASK_PHOTOS={};
function renderTaskThumbs(id){
  const arr=TASK_PHOTOS[id]||[]; const t=$('mt_'+id); const c=$('mc_'+id);
  if(t) t.innerHTML=arr.map((u,i)=>'<span style="position:relative;display:inline-block;margin:0 6px 6px 0"><img src="'+esc(u)+'" style="width:56px;height:56px;object-fit:cover;border-radius:8px;display:block"><button type="button" onclick="rmTaskPhoto('+id+','+i+')" style="position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;cursor:pointer">×</button></span>').join('');
  if(c) c.textContent = arr.length ? ('แนบแล้ว '+arr.length+' รูป') : 'ยังไม่ได้แนบรูป';
}
function rmTaskPhoto(id,i){
  if(!TASK_PHOTOS[id]) return;
  const url=TASK_PHOTOS[id][i];
  TASK_PHOTOS[id].splice(i,1); renderTaskThumbs(id); taskDraftSave(id);
  // ★ 15 ก.ย. 69 — รูปที่อัปขึ้นแล้ว ต้องลบออกจากร่างบนเซิร์ฟเวอร์ด้วย ไม่งั้นเครื่องอื่นยังเห็น
  if(typeof url==='string' && /^https?:/i.test(url) && /^\d+$/.test(String(id))){
    window.HR.taskDraftDrop({ empId:EMP.emp_id, id:Number(id), url }).catch(()=>{});
  }
}
function wireTaskInput(inpId, taskId){
  const inp=$(inpId); if(!inp) return;
  inp.addEventListener('change',async()=>{
    if(!inp.files||!inp.files.length) return;
    const added=await filesToData(inp.files);
    inp.value='';            // เคลียร์เพื่อให้ถ่าย/เลือกเพิ่มได้อีก
    if(!added.length) return;
    // แสดงรูปทันทีก่อน (ไม่ต้องรอเน็ต) แล้วค่อยอัปโหลดทีละรูป
    TASK_PHOTOS[taskId]=(TASK_PHOTOS[taskId]||[]).concat(added);
    renderTaskThumbs(taskId); taskDraftSave(taskId);
    // ★ 15 ก.ย. 69 — อัปโหลดขึ้น storage ทันทีที่ถ่าย แล้วสลับ data URL เป็น URL จริง
    //   ทำให้เปิดอีกเครื่องแล้วเห็นรูปที่ถ่ายค้างไว้ · และรูปไม่หายถ้ามือถือดับ
    const st=$('mc_'+taskId); const oldTxt=st?st.textContent:'';
    if(st) st.textContent='กำลังอัปโหลด '+added.length+' รูป…';
    let failed=0;
    for(const d of added){
      try{
        const r=await window.HR.taskDraftPush({ empId:EMP.emp_id, id:Number(taskId), photo:d });
        const arr=TASK_PHOTOS[taskId]||[]; const at=arr.indexOf(d);
        if(at>=0 && r && r.url){ arr[at]=r.url; }
      }catch(e){ failed++; }
    }
    renderTaskThumbs(taskId); taskDraftSave(taskId);
    if(st && failed) st.textContent='อัปโหลดไม่สำเร็จ '+failed+' รูป — รูปยังอยู่ในเครื่องนี้ กดส่งงานได้ตามปกติ';
    else if(st && !/^แนบแล้ว/.test(st.textContent)) st.textContent=oldTxt;
  });
}

async function discDoAck(){
  const a=DISC_QUEUE[DISC_IDX]; if(!a) return;
  const btn=document.getElementById('discAckBtn'), err=document.getElementById('discErr');
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  const r=await window.HR.ackDiscAction(a.id, EMP.emp_id, document.getElementById('discNote').value.trim());
  if(!r.ok){
    err.textContent=r.error||'บันทึกไม่สำเร็จ'; err.style.display='block';
    btn.disabled=false; btn.textContent='✓ ข้าพเจ้ารับทราบแล้ว';
    return;

    document.getElementById('discOverlay').style.display='none';
    const done=DISC_RESOLVE; DISC_RESOLVE=null;

  } else discRender();
}

async function ensureDiscAcked(emp){

  try{ pend=await window.HR.getPendingDiscAcks(emp.emp_id); }catch(e){ return true; }

  ensureDiscOverlay();
  DISC_QUEUE=pend; DISC_IDX=0;
  return new Promise(res=>{ DISC_RESOLVE=res; discRender(); });
}

async function annDoAck(){
  const a=ANN_QUEUE[ANN_IDX]; if(!a) return;
  const btn=document.getElementById('annAckBtn');
  const err=document.getElementById('annErr');
  const sel=document.querySelector('input[name="annq"]:checked');
  const hasQuiz=!!(a.quiz_q && Array.isArray(a.quiz_choices) && a.quiz_choices.length);
  if(hasQuiz && !sel){ err.textContent='กรุณาเลือกคำตอบก่อน'; err.style.display='block'; return; }
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  const r=await window.HR.ackAnnouncement(a.id, EMP.emp_id, EMP.nickname||EMP.name, EMP.branch_id, sel?Number(sel.value):null);
  if(!r.ok){
    btn.disabled=false; btn.textContent='✓ รับทราบแล้ว';
    if(r.quiz_wrong){ const s=document.querySelector('input[name="annq"]:checked'); if(s){ const lb=s.closest('label'); if(lb) lb.checked=false; } document.querySelectorAll('input[name="annq"]').forEach(x=>x.checked=false); annWarnShow(r.quiz_tries||0); return; }
    err.textContent=r.error||'บันทึกไม่สำเร็จ'; err.style.display='block';
    return;
  }
  if(hasQuiz){ annSuccessShow(annAdvance); return; }   // ตอบถูก → หน้าต่างขอบคุณก่อนไปต่อ
  annAdvance();
}
function annAdvance(){
  ANN_IDX++;
  if(ANN_IDX>=ANN_QUEUE.length){
    document.getElementById('annOverlay').style.display='none';
    const done=ANN_RESOLVE; ANN_RESOLVE=null;
    toast('ok','รับทราบประกาศครบแล้ว');
    if(done) done(true);
  } else annRender();
}

        +' · ส่งงาน '+st.submitted.done+'/'+st.submitted.total+(st.submitted.closed?(' · ปิดงาน '+st.submitted.closed):'')
        +'<br>รายงานถูกส่งเข้าไลน์กลุ่มแล้ว ผลัดถัดไปตรวจงานได้เลย</div></div>';
  }
  var ok=st.pending.length===0;
  var h='<div class="card" style="border-left:3px solid '+(ok?'#16a34a':'#dc2626')+'">'
    +'<div style="font-weight:700">ส่งผลัด</div>'
    +'<div class="muted" style="font-size:12.5px;margin:3px 0 7px">ส่งงานแล้ว '+st.done+'/'+st.total+' งาน'
      +(st.closed.length?(' · ปิดงาน '+st.closed.length+' งาน'):'')
      +(ok?'<br>กดส่งผลัดเพื่อส่งรายงานเข้าไลน์กลุ่มทันที ผลัดถัดไปจะได้ตรวจงานตอนที่ทีมยังอยู่'
         :('<br>ยังเหลืองานค้าง '+st.pending.length+' รายการ — ทำให้เสร็จ หรือปิดงานพร้อมระบุเหตุผลก่อน'))+'</div>';
  if(!ok) h+='<div style="font-size:12.5px;color:#b91c1c;line-height:1.7;margin-bottom:7px">'
    +st.pending.slice(0,8).map(function(x){ return '• '+esc(x.title)+(x.emp_name?(' <span class="muted">· '+esc(x.emp_name)+'</span>'):''); }).join('<br>')
    +(st.pending.length>8?('<br><span class="muted">…และอีก '+(st.pending.length-8)+' รายการ</span>'):'')+'</div>';
  if(!st.is_lead) h+='<div class="muted" style="font-size:12.5px">ส่งผลัดได้เฉพาะหัวหน้าผลัด'
    +(st.lead?(' (' + esc(st.lead.emp_name||st.lead.emp_id) + ')'):' — ยังไม่มีใครรับเป็นหัวหน้าผลัด')+'</div>';
  else h+='<button class="btn '+(ok?'btn-pri':'btn-sec')+'" id="bShiftSend"'+(ok?'':' disabled style="opacity:.55"')+'>'
    +'ส่งผลัด · ยืนยันงานพร้อมให้ตรวจ</button>';
  return h+'</div>';
}
// ★ ปุ่มปิดงาน / เปิดงานใหม่ (หัวหน้าผลัด)
function wireCloseTask(){
  document.querySelectorAll('[data-close]').forEach(function(b){ b.onclick=async function(){
    var id=Number(b.dataset.close);
    var why=prompt('ปิดงานนี้เพราะทำไม่ได้จริง\n\nระบุเหตุผลให้ครบถ้วน (อย่างน้อย 15 ตัวอักษร)\nเช่น "เครื่องชงกาแฟเสีย ช่างนัดเข้ามาซ่อมพรุ่งนี้เช้า แจ้ง ผจก. แล้ว"\n\nเหตุผลนี้จะขึ้นในรายงานสิ้นผลัดและส่งให้ ผจก. รับทราบ');
    if(why===null) return;
    if(String(why).trim().length<15){ toast('err','เหตุผลสั้นเกินไป ต้องอย่างน้อย 15 ตัวอักษร'); return; }
    b.disabled=true;
    try{ await window.HR.taskCloseCannotDo({ empId:EMP.emp_id, task_def_id:id, reason:String(why).trim() });
         toast('ok','ปิดงานแล้ว — เหตุผลถูกบันทึกไว้'); openLeaderPanel(); }
    catch(e){ b.disabled=false; toast('err',(e.message||'ไม่สำเร็จ')); }
  }; });
  document.querySelectorAll('[data-reopen]').forEach(function(b){ b.onclick=async function(){
    if(!confirm('เปิดงานนี้กลับมาทำต่อ?')) return;
    b.disabled=true;
    try{ await window.HR.taskReopen({ empId:EMP.emp_id, task_def_id:Number(b.dataset.reopen) });
         toast('ok','เปิดงานกลับมาแล้ว'); openLeaderPanel(); }
    catch(e){ b.disabled=false; toast('err',(e.message||'ไม่สำเร็จ')); }
  }; });
}
// ★ ปุ่มส่งผลัด — ยืนยันด้วยรหัสหัวหน้าผลัดเท่านั้น
// ★ การ์ดส่งผลัดบนหน้าแรก — โหลดสถานะแล้ววาดใหม่ทุกครั้งที่กลับมาหน้าเมนู
async function refreshSendCard(){
  var box=$('hoSendCard'); if(!box) return;
  try{ SS_STATE=await window.HR.shiftSubmitState(EMP.emp_id);
       IS_LEAD=!!(SS_STATE&&SS_STATE.is_lead); SHIFT_SENT=!!(SS_STATE&&SS_STATE.submitted);
  }catch(e){ SS_STATE=null; IS_LEAD=false; SHIFT_SENT=false; }
  box.innerHTML=shiftSendHTML(SS_STATE);
  wireShiftSend();
}
function wireShiftSend(){
  var b=$('bShiftSend'); if(!b) return;
  b.onclick=async function(){
    var st=SS_STATE; if(!st||!st.lead) return;
    if(st.pending.length){ toast('err','ยังมีงานค้างอยู่'); return; }
    var code=prompt('ยืนยันส่งผลัด\n\nส่งงาน '+st.done+'/'+st.total+' งาน'
      +(st.closed.length?(' · ปิดงาน '+st.closed.length+' งาน'):'')
      +'\n\nกดส่งแล้วระบบจะส่งรายงานเข้าไลน์กลุ่มทันที\n\nกรอกรหัสพนักงานของหัวหน้าผลัดเพื่อยืนยัน:');
    if(code===null) return;
    if(!String(code).trim()){ toast('err','ต้องกรอกรหัสยืนยัน'); return; }
    b.disabled=true; b.textContent='กำลังส่ง…';
    try{
      var r=await window.HR.shiftSubmit({ empId:EMP.emp_id, confirmEmpId:String(code).trim() });
      toast('ok', r.line_sent ? 'ส่งผลัดแล้ว — รายงานเข้าไลน์กลุ่มเรียบร้อย'
        : 'ส่งผลัดแล้ว (ส่งไลน์ไม่สำเร็จ ให้แจ้ง ผจก.)');
      refreshSendCard();
    }catch(e){ b.disabled=false; b.textContent='ส่งผลัด · ยืนยันงานพร้อมให้ตรวจ'; toast('err',(e.message||'ไม่สำเร็จ')); }
  };
}
async function openLeaderPanel(){
  $('m1_panel').classList.remove('hide');
  $('l_board').innerHTML='<div class="card muted">กำลังโหลด…</div>';
  try{ SS_STATE=await window.HR.shiftSubmitState(EMP.emp_id);
       IS_LEAD=!!(SS_STATE&&SS_STATE.is_lead); SHIFT_SENT=!!(SS_STATE&&SS_STATE.submitted);
  }catch(e){ SS_STATE=null; IS_LEAD=false; SHIFT_SENT=false; }
  let b; try{ b=await window.HR.getShiftBoard(EMP.emp_id, null); LBOARD=b; window.CUR_SHIFT=b.shift||''; }catch(e){ $('l_board').innerHTML='<div class="card muted">'+esc(e.message||'')+'</div>'; return; }
  const inShift=new Set((b.members||[]).map(m=>m.emp_id));
  populateAddList();
  // ★ 20 ก.ย. 69 — มอบงานให้คน "นอกกะ" ได้เลย โดยไม่ต้องเพิ่มเข้ากะก่อน
  //   เดิม: ดรอปดาวน์มีแต่คนในกะ → จะมอบคนนอกกะต้องกด "เพิ่มเข้ากะ" ก่อน
  //         ซึ่งไปสร้างแถวตารางเวรจริง → ถ้าเขาไม่มาลงเวลา กลายเป็น "ขาดงาน" ปลอม (เคส 19/09/69)
  //   ใหม่: มอบตรง ๆ ได้เลย ไม่แตะตารางเวร · งานยังอยู่ใต้กะนี้ หัวหน้าผลัดกะนี้เป็นคนตรวจเหมือนเดิม
  //   ปุ่ม "เพิ่มเข้ากะ" ยังเก็บไว้ — ใช้เมื่อคนมาทำงานจริงแต่ ผจก. ยังไม่ได้จัดเวรให้
  const _optOf=m=>'<option value="'+esc(m.emp_id)+'">'+esc(m.name)+'</option>';
  const _outList=(b.colleagues||[]).filter(c=>!inShift.has(c.emp_id));
  const _outOpts=_outList.length
    ? '<optgroup label="\u0e19\u0e2d\u0e01\u0e01\u0e30 \u2014 \u0e21\u0e2d\u0e1a\u0e44\u0e14\u0e49\u0e40\u0e25\u0e22 \u0e44\u0e21\u0e48\u0e01\u0e23\u0e30\u0e17\u0e1a\u0e15\u0e32\u0e23\u0e32\u0e07\u0e40\u0e27\u0e23">'+_outList.map(_optOf).join('')+'</optgroup>'
    : '';
  const _inOpts=(b.members||[]).map(_optOf).join('');
  const memOpts=(_inOpts?('<optgroup label="\u0e04\u0e19\u0e43\u0e19\u0e01\u0e30\u0e19\u0e35\u0e49">'+_inOpts+'</optgroup>'):'')+_outOpts;
  // ★ งานของ ผจก. — เลือกชื่อ ผจก. ไว้ให้ก่อนในดรอปดาวน์
  const mgrId=((b.managers||[])[0]||{}).emp_id||'';
  const _inOptsMgr=(b.members||[]).map(m=>'<option value="'+esc(m.emp_id)+'"'+(m.emp_id===mgrId?' selected':'')+'>'+esc(m.name)+'</option>').join('');
  const memOptsMgr=(_inOptsMgr?('<optgroup label="\u0e04\u0e19\u0e43\u0e19\u0e01\u0e30\u0e19\u0e35\u0e49">'+_inOptsMgr+'</optgroup>'):'')+_outOpts;
  if(!b.defs.length){ $('l_board').innerHTML='<div class="card muted">กะนี้ยังไม่มีรายการงาน (ผู้จัดการตั้งที่ "ตั้งค่ากะ")</div>'; return; }
  const _defCard=(d)=>{
    const a=d.assignment;
    // ★ ปิดงานที่ทำไม่ได้จริง — ปุ่มเล็กมุมขวาบน ไม่มีข้อความชวนกด (หัวหน้าผลัดเท่านั้น)
    let _corner='';
    if(IS_LEAD && !SHIFT_SENT){
      if(a && a.status==='closed')
        _corner='<button type="button" data-reopen="'+d.id+'" title="เปิดงานนี้กลับมาทำ" aria-label="เปิดงานนี้กลับมาทำ" '
          +'style="position:absolute;top:8px;right:8px;width:24px;height:24px;padding:0;display:grid;place-items:center;'
          +'border:1px solid var(--line);border-radius:7px;background:#fff;color:#64748b;cursor:pointer">'
          +'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'
          +'<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>';
      else if(!a || (a.status!=='submitted' && a.status!=='approved'))
        _corner='<button type="button" data-close="'+d.id+'" title="ปิดงาน — เฉพาะกรณีทำไม่ได้จริง" aria-label="ปิดงาน" '
          +'style="position:absolute;top:8px;right:8px;width:24px;height:24px;padding:0;display:grid;place-items:center;'
          +'border:0;border-radius:7px;background:transparent;color:#cbd5e1;cursor:pointer;opacity:.75">'
          +'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'
          +'<circle cx="12" cy="12" r="8.5"/><path d="M6.2 6.2l11.6 11.6"/></svg></button>';
    }
    let body='<div style="font-weight:600;margin-bottom:6px'+(_corner?';padding-right:28px':'')+'">'+esc(d.title)+(d.mgr_owner?' <span class="pill" style="background:#fef3c7;color:#92400e;font-weight:700">ผจก.</span>':'')+(d.require_photo?' <span class="pill muted2"><svg class="ei" viewBox="0 0 24 24"><path d="M14.5 4h-5L8 6H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/></svg></span>':'')+'</div>';
    if(a){ const s=ST(a.status); body+='<div style="margin-bottom:6px"><span class="pill '+s[1]+'">'+s[0]+'</span> <span class="muted">'+esc(a.emp_name||a.emp_id)+'</span></div>'; }
    // ★ งานที่ปิดเพราะทำไม่ได้ — โชว์เหตุผทและปุ่มเปิดกลับ
    if(a && a.status==='closed'){
      body+='<div style="background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:12.5px;line-height:1.6">'
        +'<b>เหตุผลที่ทำไม่ได้</b><div style="margin-top:2px">'+esc(a.closed_reason||'')+'</div>'
        +'<div class="muted" style="font-size:11.5px;margin-top:3px">ปิดโดย '+esc(a.closed_by_name||a.closed_by||'')
          +(a.closed_ack_at?(' · ผจก. รับทราบแล้ว'):' · รอ ผจก. รับทราบ')+'</div></div>';
    }
    body+=taskDetailHTML(d,{noShelf:true});
    if(!(b.members||[]).length) body+='<div class="muted">ยังไม่มีคนในกะ — เพิ่มคนด้านบนก่อน</div>';
    // ★ 16 ก.ย. 69 — เลือกชื่อแล้วมอบทันที (เดิมต้องเลือกชื่อแล้วกดปุ่มมอบอีกที — ช้า)
    else if(!a || a.status!=='closed'){
      // ต้องไม่มี selected ค้างเลย — ไม่งั้นกดชื่อที่ถูกเลือกค้างไว้จะไม่เกิด change → มอบไม่ได้
      var _opts = ((d.mgr_owner&&mgrId)?memOptsMgr:memOpts).replace(/ selected/g,'');
      var _ph = a ? ('ตอนนี้: '+(a.emp_name||a.emp_id||'')+' — แตะเพื่อเปลี่ยนคน')
                  : '— แตะเพื่อมอบงาน —';
      body+='<div class="row2"><select id="lg_'+d.id+'" data-giveSel="'+d.id+'" style="flex:1">'
        +'<option value="" selected>'+esc(_ph)+'</option>'+_opts+'</select></div>';
    }
    return '<div class="card" data-defcard="'+d.id+'" style="position:relative">'+_corner+body+'</div>';
  };
  // ★ 17 ก.ย. 69 — มอบงานแล้วอัปเดต "เฉพาะการ์ดใบนั้น" ไม่วาดกระดานใหม่ทั้งหน้า
  //   ของเดิมเรียก openLeaderPanel() ทุกครั้งที่มอบ 1 งาน → l_board.innerHTML ถูกเขียนทับหมด
  //   หน้าเด้งกลับบนสุด + ขั้นตอนที่มอบครบจะพับเก็บอัตโนมัติ ทำให้งานถัดไปเลื่อนหนีทุกครั้ง
  //   ต้องไถหาใหม่ทุกงาน (ผลัดหนึ่งมี 20-40 งาน = ไถ 20-40 รอบ)
  const _lgWireGive=()=>{
    document.querySelectorAll('[data-giveSel]').forEach(function(sel){
      if(sel._wired) return; sel._wired=true;
      sel.onchange=async function(){
        const def=Number(sel.getAttribute('data-giveSel')), to=sel.value;
        if(!to) return;                                  // เลือกหัวข้อว่าง = ไม่ทำอะไร
        const _name=(sel.options[sel.selectedIndex]||{}).textContent||'';
        sel.disabled=true;                               // กันกดซ้ำระหว่างรอเน็ต
        try{
          await window.HR.assignColleague({ byEmpId:EMP.emp_id, toEmpId:to, task_def_id:def, shiftId:b.shift });
          toast('ok','มอบให้ '+_name+' แล้ว');
          // ปะการ์ดใบเดียว — ตำแหน่งที่ไถค้างไว้ไม่ขยับ งานถัดไปอยู่ที่เดิม
          if(!_lgPatch(def,{ emp_id:to, emp_name:_name, status:'todo' })) openLeaderPanel();
        }catch(e){ sel.disabled=false; toast('err',(e.message||'ไม่สำเร็จ')); openLeaderPanel(); }
      };
    });
  };
  // ★ มอบครบทั้งหมวด → พับหมวดนั้นเก็บให้เอง (เพราะมอบงานกันเป็นหมวด พับแล้วหมวดถัดไปเลื่อนขึ้นมาพอดี)
  //   พับเฉพาะ "จังหวะที่เพิ่งครบ" เท่านั้น — หมวดที่พับอยู่แล้วหรือยังไม่ครบ ไม่ไปยุ่ง
  const _lgSyncCounts=(focusStep)=>{
    groupSteps(b.defs, function(d){ return (d.step!=null?Number(d.step):0); }).forEach(function(gp){
      var key='lg:'+gp[0];
      var sec=document.querySelector('.stepsec[data-sk="'+key+'"]'); if(!sec) return;
      var c=sec.querySelector('.stephead .c');
      var tot=gp[1].length, got=gp[1].filter(function(x){ return !!x.assignment; }).length;
      if(c) c.textContent='มอบแล้ว '+got+'/'+tot;
      if(tot && got>=tot && !sec.classList.contains('col')){
        sec.classList.add('col');
        HO_COL[key]=true; _hoColSave();     // จำไว้ให้ตรงกับตอนโหลดใหม่
        // เลื่อนหัวหมวดที่เพิ่งพับมาไว้บนจอ — หมวดถัดไปจะอยู่ใต้มันพอดี ไม่ต้องไถหา
        if(focusStep!=null && Number(focusStep)===Number(gp[0])){
          try{ sec.scrollIntoView({block:'start',behavior:'smooth'}); }catch(e){}
        }
      }
    });
  };
  const _lgPatch=(defId,asg)=>{
    try{
      var d=(b.defs||[]).filter(function(x){ return Number(x.id)===Number(defId); })[0];
      var node=document.querySelector('[data-defcard="'+defId+'"]');
      if(!d||!node||!node.parentNode) return false;
      d.assignment=Object.assign({}, d.assignment||{}, asg);
      var tmp=document.createElement('div'); tmp.innerHTML=_defCard(d);
      var fresh=tmp.firstElementChild; if(!fresh) return false;
      node.parentNode.replaceChild(fresh,node);
      _lgSyncCounts(d.step!=null?Number(d.step):0); wireCloseTask(); _lgWireGive();
      return true;
    }catch(e){ return false; }
  };
  // จัดหมวดตามขั้นตอนการทำงาน + ย่อ/ขยายได้ (ขั้นตอนที่มอบครบแล้วจะพับเก็บให้อัตโนมัติ)
  $('l_board').innerHTML=groupSteps(b.defs, function(d){ return (d.step!=null?Number(d.step):0); })
    .map(function(gp){
      var tot=gp[1].length, got=gp[1].filter(function(x){ return !!x.assignment; }).length;
      return stepSection('lg',gp[0],stepLabel(gp[0]),'มอบแล้ว '+got+'/'+tot,
        gp[1].map(_defCard).join(''), got>=tot);
    }).join('');
  wireCloseTask();
  // ★ เลือกชื่อใน dropdown → มอบงานทันที ไม่ต้องกดปุ่มซ้ำ
  _lgWireGive();
}
function populateAddList(){
  const b=LBOARD||{}; const inShift=new Set((b.members||[]).map(m=>m.emp_id));
  const cross=$('l_addx')&&$('l_addx').checked;
  let list;
  if(cross){ list=(b.all_staff||[]).filter(c=>!inShift.has(c.emp_id)&&!c.same_branch).map(c=>({emp_id:c.emp_id,name:c.name+' · '+(c.branch_name||c.branch_id||'')})); }
  else { list=(b.colleagues||[]).filter(c=>!inShift.has(c.emp_id)); }
  $('l_addemp').innerHTML=list.length?list.map(c=>'<option value="'+esc(c.emp_id)+'">'+esc(c.name)+'</option>').join(''):'<option value="">'+(cross?'(ไม่มีคนสาขาอื่น)':'(ทุกคนอยู่ในกะแล้ว)')+'</option>';
}
if($('l_addx')) $('l_addx').onchange=populateAddList;
$('l_addbtn').onclick=async()=>{
  const emp=($('l_addemp')||{}).value; if(!emp){ toast('err','ไม่มีคนให้เพิ่ม'); return; }

    if(!canDo) c+=flowStepsHTML(a)+thumbsHtml(a.photos);
    if(!canDo&&a.emp_note) c+='<div class="muted" style="margin-top:6px">หมายเหตุ: '+esc(a.emp_note)+'</div>';
    // ★ 15 ก.ย. 69 — งานที่ผูกกับระบบรับสินค้า ใช้หน้าบันทึกรับสินค้าแทนการ์ดถ่ายรูปปกติ
    const _lk = String(((window.TASK_DET||{})[a.task_def_id]||{}).link_kind||'');
    if(_lk === 'รับสินค้า'){
      c+='<div class="muted" style="font-size:12.5px;margin:4px 0 8px">บันทึกใบรับสินค้าแต่ละคลัง แล้วกดยืนยันปิดงานที่หน้ารับสินค้า — รูปจากใบรับจะแนบเป็นหลักฐานให้อัตโนมัติ ถ้าผลัดนี้ไม่มีของส่ง ติ๊ก "ไม่มีสินค้าจัดส่ง" เพื่อปิดงานได้</div>'

  _MY_FIN_HTML = _mFin.length ? stepSection('myfin','done',

  TASK_PHOTOS={};
  // ===== wire งานที่ต้องแก้ (ผจก.ตีกลับ) =====
  wireFixTasks(fx.rows||[]);

      // ★ 15 ก.ย. 69 — งานที่ยังไม่ส่ง: โหลด "ร่างรูป" จากเซิร์ฟเวอร์ → เปิดเครื่องไหนก็เห็นรูปที่ถ่ายค้างไว้

        : (Array.isArray(a.draft_photos) ? a.draft_photos.slice() : []);

          clearTimeout(_nt); _nt=setTimeout(()=>{ window.HR.taskDraftNote({ empId:EMP.emp_id, id:Number(a.id), note:nInp.value }).catch(()=>{}); }, 1200); };
      }

          const cur=TASK_PHOTOS[a.id]||[];
          const pend=d.photos.filter(u=>typeof u==='string' && !/^https?:/i.test(u) && cur.indexOf(u)<0);
          if(pend.length) TASK_PHOTOS[a.id]=cur.concat(pend);

        renderTaskThumbs(a.id); });
    }});
    document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=async()=>{
      const id=Number(b.dataset.sub); const note=($('mn_'+id)||{}).value||'';

      catch(e){ toast('err',(e.message||'ไม่สำเร็จ')); b.textContent='ส่งงาน'; b.disabled=false; }
    });
    document.querySelectorAll('[data-goods]').forEach(b=>b.onclick=()=>{ GD_FROM_TASK=true; openGoods(); });
    document.querySelectorAll('[data-pull]').forEach(b=>b.onclick=async()=>{
      try{ await window.HR.pullTask({ empId:EMP.emp_id, task_def_id:Number(b.dataset.pull) }); toast('ok','ดึงงานมาเป็นของคุณแล้ว'); openM2(); }
      catch(e){ toast('err',(e.message||'ไม่สำเร็จ')); }
    });
  }

function fmtDeadline(dl){

  const dtxt=d.toLocaleString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' น.';
  let tag='';
  if(diff<0) tag=' <span style="color:#dc2626;font-weight:700">· เลยกำหนดแล้ว</span>';
  else if(diff<24*3600*1000) tag=' <span style="color:#b45309;font-weight:700">· ใกล้ครบกำหนด</span>';
  return '<div class="muted" style="margin-top:2px"><svg class="ei" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg> ครบกำหนด: '+dtxt+tag+'</div>';
}

// ============ ลำดับขั้นการตรวจงานในกะ (กันพนักงานเข้าใจผิดว่าไม่ต้องตรวจผลัดก่อนหน้า) ============
// ส่งงาน → หัวหน้าผลัดถัดไปตรวจ → (ถ้าเป็นงานที่ ผจก.ต้องตรวจ) ผู้จัดการตรวจซ้ำ
function flowStepsHTML(a){
  if(a.status!=='submitted' && a.status!=='approved') return '';
  const needMgr = (a.needs_mgr===true);
  const checked = !!a.checked_at || a.status==='approved';
  const mgrDone = !!a.mgr_checked_at;

  const step=(n,label,state,detail)=>{
    const col = state==='done' ? '#16a34a' : (state==='now' ? '#d97706' : '#9ca3af');
    const bg  = state==='now' ? '#fffbeb' : 'transparent';
    const icon= state==='done' ? '✓' : (state==='now' ? String(n) : String(n));
    return '<div style="display:flex;gap:8px;align-items:flex-start;padding:5px 7px;border-radius:8px;background:'+bg+'">'
      +'<span style="flex:none;width:20px;height:20px;border-radius:50%;background:'+col+';color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px">'+icon+'</span>'
      +'<span style="font-size:12.5px;line-height:1.45"><b style="color:'+col+'">'+label+'</b>'
      +(state==='now'?' <span style="color:#d97706">← ตอนนี้อยู่ขั้นนี้</span>':'')
      +(detail?('<div class="muted" style="font-size:11.5px">'+detail+'</div>'):'')+'</span></div>';
  };

  let h='<div style="border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:#fafafa">'
    +'<div style="font-size:12px;font-weight:700;color:#374151;margin-bottom:4px">ลำดับการตรวจงานนี้</div>';
  h+=step(1,'คุณส่งงานแล้ว','done', a.submitted_at?('ส่งเมื่อ '+fmt(a.submitted_at)):'');
  h+=step(2,'หัวหน้าผลัดถัดไปตรวจ', checked?'done':'now',
        checked ? ('ตรวจผ่านแล้ว'+(a.checked_by_name?(' โดย '+esc(a.checked_by_name)):''))
                : 'ยังไม่ถูกตรวจ — <b style="color:#b45309">งานนี้ต้องให้ผลัดถัดไปตรวจก่อน</b>');
  if(needMgr){
    h+=step(3,'ผู้จัดการตรวจซ้ำ', mgrDone?'done':(checked?'now':'wait'),
        mgrDone ? 'ผู้จัดการตรวจแล้ว' : (checked ? 'รอผู้จัดการตรวจซ้ำ' : 'จะเริ่มหลังผลัดถัดไปตรวจเสร็จ'));
  }
  if(a.status==='submitted'){
    h+='<div class="muted" style="font-size:11.5px;margin-top:5px;border-top:1px dashed var(--line);padding-top:5px">แก้ไข/เพิ่ม/ลบรูป แล้วส่งใหม่ได้เรื่อย ๆ จนกว่าจะถูกตรวจ (รูปเดิมอยู่ด้านล่าง)</div>';
  }
  return h+'</div>';
}

      +'<label class="btn2" style="display:inline-block;cursor:pointer"><svg class="ei" viewBox="0 0 24 24"><path d="M14.5 4h-5L8 6H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/></svg> ถ่ายรูปที่แก้แล้ว<input type="file" accept="image/*" capture="environment" multiple id="fxc_'+a.id+'" style="display:none"></label>'

      +'<button class="btn" data-fixsub="'+a.id+'">ส่งงานที่แก้แล้ว</button></div>';

function wireFixTasks(rows){
  (rows||[]).forEach(a=>{
    // โหลด "รูปเดิม" เข้าชุดแก้ไข → นับรวมกับรูปขั้นต่ำ ไม่ต้องถ่ายใหม่ทั้งหมด (ลบเฉพาะรูปที่ผิดได้)
    TASK_PHOTOS['fx_'+a.id]=(Array.isArray(a.photos)?a.photos.slice():[]);
    FIX_MIN['fx_'+a.id]=Number(a.min_photos||0);
    renderFixThumbs(a.id);
    const nInp=$('fxn_'+a.id); if(nInp) nInp.oninput=()=>wipPut('fx:'+a.id,'fx_'+a.id,'fxn_'+a.id);
    wipRestore('fx:'+a.id,'fx_'+a.id,'fxn_'+a.id,renderFixThumbs,a.id);   // ★ กู้ร่างที่แก้ค้างไว้

      if(!inp.files||!inp.files.length) return;

        TASK_PHOTOS['fx_'+a.id]=(TASK_PHOTOS['fx_'+a.id]||[]).concat(added);
        renderFixThumbs(a.id);

      }catch(err){ toast('err','อ่านรูปไม่สำเร็จ: '+((err&&err.message)||'')); }
      inp.value='';
    };
  });
  document.querySelectorAll('[data-fixsub]').forEach(b=>b.onclick=async()=>{
    const id=Number(b.dataset.fixsub);

    catch(e){ toast('err',(e.message||'ไม่สำเร็จ')); b.textContent='ส่งงานที่แก้แล้ว'; b.disabled=false; }
  });

let FIX_MIN={};   // จำนวนรูปขั้นต่ำของงานที่ถูกตีกลับ (ต่อใบ)

}

async function mkLoadBlob(url){
  try{ const m=url.match(/\/object\/(?:public|sign|authenticated)\/([^/]+)\/([^?]+)/); if(m&&window.HR&&window.HR.sb){ const {data,error}=await window.HR.sb.storage.from(decodeURIComponent(m[1])).download(decodeURIComponent(m[2])); if(!error&&data) return URL.createObjectURL(data); } }catch(e){}
  try{ const r=await fetch(url,{mode:'cors'}); if(r.ok) return URL.createObjectURL(await r.blob()); }catch(e){}
  return url;
}
function mkEnsureUI(){

  o.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{ MK.tool=b.dataset.tool; o.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on',x===b)); });

  document.getElementById('mkCancel').onclick=()=>{ o.style.display='none'; MK=null; };
  document.getElementById('mkSend').onclick=mkSend;
  const cv=document.getElementById('mkCanvas');
  const pos=e=>{ const r=cv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return {x:(p.clientX-r.left)/r.width,y:(p.clientY-r.top)/r.height}; };
  let drawing=false,cur=null;
  const down=e=>{ if(!MK)return; drawing=true; const p=pos(e); cur=MK.tool==='pen'?{t:'pen',pts:[p]}:{t:MK.tool,x:p.x,y:p.y,x2:p.x,y2:p.y}; MK.imgs[MK.cur].shapes.push(cur); e.preventDefault(); };
  const move=e=>{ if(!drawing||!MK)return; const p=pos(e); if(cur.t==='pen')cur.pts.push(p); else{cur.x2=p.x;cur.y2=p.y;} mkRedraw(); e.preventDefault(); };
  const up=()=>{ drawing=false;cur=null; };
  cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',up);

function mkShapes(ctx,shapes,W,H){ ctx.strokeStyle='#ef4444'; ctx.lineWidth=Math.max(3,Math.round(W*0.006)); ctx.lineJoin='round'; ctx.lineCap='round';
  shapes.forEach(s=>{ if(s.t==='rect') ctx.strokeRect(s.x*W,s.y*H,(s.x2-s.x)*W,(s.y2-s.y)*H);
    else if(s.t==='circle'){ ctx.beginPath(); ctx.ellipse((s.x+s.x2)/2*W,(s.y+s.y2)/2*H,Math.abs(s.x2-s.x)/2*W,Math.abs(s.y2-s.y)/2*H,0,0,Math.PI*2); ctx.stroke(); }
    else if(s.t==='pen'){ ctx.beginPath(); s.pts.forEach((p,i)=>i?ctx.lineTo(p.x*W,p.y*H):ctx.moveTo(p.x*W,p.y*H)); ctx.stroke(); } }); }
function mkRedraw(){ const im=MK.imgs[MK.cur]; if(!im||!im.el)return; const cv=document.getElementById('mkCanvas'); const maxW=Math.min(720,window.innerWidth-24),maxH=window.innerHeight-210; let W=im.el.naturalWidth,H=im.el.naturalHeight; const sc=Math.min(maxW/W,maxH/H,1); cv.width=Math.round(W*sc); cv.height=Math.round(H*sc); const ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height); ctx.drawImage(im.el,0,0,cv.width,cv.height); mkShapes(ctx,im.shapes,cv.width,cv.height); document.getElementById('mkNav').textContent=(MK.cur+1)+'/'+MK.imgs.length; }
async function mkLoadCur(){ const im=MK.imgs[MK.cur]; if(!im.el){ const src=/^https?:/i.test(im.src)?await mkLoadBlob(im.src):im.src; await new Promise(res=>{ const g=new Image(); g.onload=()=>{im.el=g;res();}; g.onerror=()=>res(); g.src=src; }); } mkRedraw(); }
async function openMarkupEditor(t){
  if(!t){ toast('err','ไม่พบงาน'); return; }
  const photos=(Array.isArray(t.photos)&&t.photos.length)?t.photos:(t.photo_url?[t.photo_url]:[]);
  if(!photos.length){ const note=prompt('งานนี้ไม่มีรูป — ระบุสิ่งที่ต้องแก้ (ส่งกลับ):'); if(note===null)return; doPrevReview(t.id,'sent_back',note); return; }
  mkEnsureUI(); MK={ task:t, tool:'circle', cur:0, imgs:photos.map(u=>({src:u,el:null,shapes:[]})) };
  document.querySelectorAll('#mkOverlay [data-tool]').forEach(x=>x.classList.toggle('on',x.dataset.tool==='circle'));
  document.getElementById('mkNote').value=''; document.getElementById('mkOverlay').style.display='flex'; await mkLoadCur();

async function mkSend(){
  if(!MK)return; const note=document.getElementById('mkNote').value.trim();
  const marked=MK.imgs.filter(im=>im.shapes.length&&im.el);
  if(!marked.length&&!note){ toast('err','วาดชี้จุด หรือพิมพ์สิ่งที่ต้องแก้ อย่างน้อยอย่างใดอย่างหนึ่ง'); return; }
  document.getElementById('mkSend').disabled=true;
  const out=[];
  for(const im of marked){ const W=Math.min(im.el.naturalWidth,1280),H=Math.round(im.el.naturalHeight*(W/im.el.naturalWidth)); const c=document.createElement('canvas'); c.width=W;c.height=H; const ctx=c.getContext('2d'); ctx.drawImage(im.el,0,0,W,H); mkShapes(ctx,im.shapes,W,H); out.push(c.toDataURL('image/jpeg',0.9)); }
  await doPrevReview(MK.task.id,'sent_back',note,out);

}

const CO_GRACE_MIN=15;
function coEffEnd(row, shift){
  if(!shift || !shift.end_time) return null;
  const st=(shift.start_time||'').slice(0,5), en=shift.end_time.slice(0,5);
  const overnight = st && en <= st;
  const base=new Date(row.work_date+'T00:00:00');
  if(overnight) base.setDate(base.getDate()+1);
  const [h,m]=en.split(':').map(Number); base.setHours(h,m,0,0);
  return base;
}
async function refreshCoCard(){
  const box=$('hoCoCard'); if(!box) return;
  if(!EMP){ box.innerHTML=''; return; }
  let s; try{ s=await window.HR.getCheckoutState(EMP.emp_id); }catch(e){ box.innerHTML=''; return; }
  if(!s || s.none || !s.row){ box.innerHTML=''; return; }
  const row=s.row;
  if(row.check_out && row.auto_closed){
    box.innerHTML='<div style="background:#fff4e0;border:1px solid #f3d38a;border-radius:12px;padding:12px;font-size:13px;color:#a06515">'
      +'<div style="font-weight:600">ระบบบันทึกเวลาออกให้แล้ว</div>'
      +'<div style="margin-top:2px">ถ้าคุณออกจริงหลังเวลาเลิกกะ กดยื่นแก้ไขเวลาออกเพื่อให้หัวหน้า/ผู้จัดการ ตรวจสอบ</div>'
      +'<button class="btn btn-sec btn-sm" id="hoCorrBtn" style="margin-top:8px">ยื่นแก้ไขเวลาออกจริง</button></div>';
    $('hoCorrBtn').onclick=()=>openCorrForm(row);
    return;
  }
  if(!row.check_out){
    const eff=coEffEnd(row, s.shift);
    if(eff && Date.now() >= eff.getTime()+CO_GRACE_MIN*60000){
      const endTxt=s.shift?s.shift.end_time.slice(0,5):'';
      box.innerHTML='<div style="background:#fff4e0;border:1px solid #f3d38a;border-radius:12px;padding:12px;font-size:13px;color:#a06515">'
        +'<div style="font-weight:600"><svg class="ei" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg> อย่าลืมกดออกงาน</div>'
        +'<div style="margin-top:2px">กะเลิก '+esc(endTxt)+' แล้ว — ถ้าเลิกแล้วไปกด "ออกงาน" ที่หน้าลงเวลา หรือถ้ายังทำต่อ (ควบกะ) เลือกด้านล่าง</div>'
        +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'
        +'<button class="btn btn-sec btn-sm" data-ext="2">ควบกะต่อ +2 ชม.</button>'
        +'<button class="btn btn-sec btn-sm" data-ext="4">+4 ชม.</button>'
        +'<button class="btn btn-sec btn-sm" data-ext="12">จนกว่าจะกดออกเอง</button>'
        +'</div></div>';
      box.querySelectorAll('[data-ext]').forEach(b=>b.onclick=async()=>{
        const hrs=Number(b.dataset.ext); const until=new Date(Date.now()+hrs*3600000).toISOString();
        try{ await window.HR.extendShift({ empId:EMP.emp_id, untilIso:until }); toast('ok','บันทึกควบกะต่อแล้ว — อย่าลืมกดออกงานเมื่อเลิกจริง'); refreshCoCard(); }
        catch(e){ toast('err', e.message||'ไม่สำเร็จ'); }
      });
      return;
    }
  }
  box.innerHTML='';

// ===== แจ้งเตือนงานบนมือถือพนักงาน (Web Push) =====
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('../sw.js',{updateViaCache:'none'}).then(function(r){try{r.update();}catch(e){}}).catch(function(){}); }); }
(function(){
  const btn=$('bNotify'); if(!btn) return;
  const supported=('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);
  if(!supported){ btn.style.display='none'; return; }
  function b64ToU8(s){ const pad='='.repeat((4-s.length%4)%4); const b=(s+pad).replace(/-/g,'+').replace(/_/g,'/'); const raw=atob(b); const arr=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i); return arr; }
  async function cur(){ const reg=await navigator.serviceWorker.ready; return reg.pushManager.getSubscription(); }
  async function refresh(){ btn.style.display=''; try{ const s=await cur(); btn.textContent=s?'แจ้งเตือนงานเปิดอยู่ (แตะเพื่อปิด)':'เปิดแจ้งเตือนงานบนมือถือนี้'; }catch(e){} }
  window.refreshNotifyBtn=refresh;
  btn.onclick=async()=>{
    if(!EMP){ toast('err','กรอกรหัสพนักงานก่อน'); return; }
    if(typeof window.VAPID_PUBLIC!=='string' || window.VAPID_PUBLIC.length<20){ toast('err','ระบบยังไม่ตั้งค่าแจ้งเตือน'); return; }
    btn.disabled=true;
    try{
      const s=await cur();
      if(s){ try{ await window.HR.sb.from('push_subscriptions').delete().eq('endpoint',s.endpoint); }catch(e){} await s.unsubscribe(); toast('ok','ปิดแจ้งเตือนแล้ว'); }
      else{
        const perm=await Notification.requestPermission();
        if(perm!=='granted'){ toast('err','ไม่ได้รับอนุญาตแจ้งเตือน — เปิดสิทธิ์ในเบราว์เซอร์ก่อน'); btn.disabled=false; return; }
        const reg=await navigator.serviceWorker.ready;
        const sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToU8(window.VAPID_PUBLIC) });
        const j=sub.toJSON();
        const { error }=await window.HR.sb.from('push_subscriptions').upsert({ endpoint:sub.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, label:(EMP.nickname||EMP.name||'พนักงาน'), emp_id:EMP.emp_id, branch_id:EMP.branch_id||null }, { onConflict:'endpoint' });
        if(error){ toast('err','บันทึกไม่สำเร็จ: '+error.message); btn.disabled=false; return; }
        toast('ok','เปิดแจ้งเตือนงานแล้ว — จะเตือนเมื่อมีงานใหม่/ใกล้ครบกำหนด');
      }
      refresh();
    }catch(e){ toast('err','ทำรายการไม่สำเร็จ'); }
    btn.disabled=false;
  };
})();
</script>

             2:{t:'จุดที่ต้องทำความสะอาด',s:'ตารางที่ 2'},
             3:{t:'อุปกรณ์ที่ต้องทำความสะอาด',s:'ตารางที่ 3'},
             4:{t:'กลุ่มสินค้าที่ต้องสั่ง',s:'ตารางที่ 4'}};
var QSS_SHN={M:'ผลัดเช้า',A:'ผลัดบ่าย',N:'ผลัดดึก',MNG:'ผู้จัดการร้าน'};
function qssShift(){ return String(window.CUR_SHIFT||'').toUpperCase(); }
function qssBtnHTML(d){
  var t=Number(d&&d.qss_table||0); if(!t||!QSS_TBL[t]) return '';
  var sh=qssShift(), shn=QSS_SHN[sh]||'';
  var box='qss_'+d.id+'_'+Math.floor(Math.random()*100000);
  return '<div style="margin:6px 0 2px">'
    +'<button type="button" class="btn btn-sec btn-sm" style="font-size:12px" '
    +'data-qss="'+t+'" data-qssbox="'+box+'" data-qsssh="'+esc(sh)+'">'
    +'<svg class="ei" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg> '
    +esc(QSS_TBL[t].t)+(shn?(' \u00b7 '+esc(shn)):'')+'</button>'
    +'<div id="'+box+'" style="display:none;margin-top:6px"></div></div>';
}
function qssRenderHTML(t,sh,r){
  var meta=QSS_TBL[t]||{t:'ตารางอ้างอิง',s:''}, shn=QSS_SHN[sh]||'';
  var h='<div style="font-size:12.5px;line-height:1.7;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:9px">'
    +'<div style="font-weight:700;margin-bottom:2px">'+esc(meta.t)+(shn?(' — '+esc(shn)):'')+'</div>'
    +'<div class="muted" style="font-size:11.5px;margin-bottom:6px">'+esc(meta.s)+' QSS Standard \u00b7 '+r.total+' รายการ</div>';
  if(!r.total){
    h+='<div style="color:#b45309">ตารางอ้างอิงไม่ได้กำหนดรายการของผลัดนี้ไว้</div>'
      +'<button type="button" class="btn btn-sec btn-sm" style="font-size:11.5px;margin-top:6px" '
      +'data-qss="'+t+'" data-qssbox="'+esc(r._box||'')+'" data-qsssh="">ดูทั้งตาราง ('+(r.all_total||0)+' รายการ)</button>';
    return h+'</div>';
  }
  (r.groups||[]).forEach(function(g){
    if(g.section_label) h+='<div style="font-weight:700;color:#0f766e;margin:8px 0 2px">'+esc(g.section_label)+'</div>';
    if(g.grp) h+='<div style="font-weight:600;margin:5px 0 1px">'+esc(g.grp)+'</div>';
    g.items.forEach(function(it){
      h+='<div style="padding:5px 0;border-top:1px solid var(--line)">'
        +'<div><span class="muted" style="font-size:11.5px">'+esc(it.code)+'</span> '+esc(it.name)
        +(it.cycle?(' <span class="muted" style="font-size:11px">\u00b7 '+esc(it.cycle)+'</span>'):'')+'</div>'
        +'<div style="font-size:11.5px;color:#475569;margin-top:1px">'
        +(it.freq?esc(it.freq):'')+(it.roles?(' \u00b7 '+esc(it.roles)):'')+'</div>'
        +(it.note?('<div style="font-size:11.5px;color:#64748b;margin-top:1px">'+esc(it.note)+'</div>'):'')
        +'</div>';
    });
  });
  h+='<div class="muted" style="font-size:11px;margin-top:8px">อ้างอิงคู่มือมาตรฐาน QSS Standard \u2014 ใช้ภายในร้านเท่านั้น</div>';
  return h+'</div>';
}
var QSS_DONE={};
document.addEventListener('click', function(ev){
  var b=ev.target.closest && ev.target.closest('[data-qss]'); if(!b) return;
  var t=Number(b.getAttribute('data-qss')||0), box=b.getAttribute('data-qssbox')||'';
  var sh=b.getAttribute('data-qsssh')||'';
  var el=document.getElementById(box); if(!el) return;
  var key=t+'|'+sh;
  if(QSS_DONE[box]===key && el.style.display!=='none'){ el.style.display='none'; return; }
  el.style.display='block';
  if(QSS_DONE[box]===key) return;
  el.innerHTML='<div class="muted" style="font-size:12px">กำลังโหลดตารางอ้างอิง…</div>';
  window.HR.qssRef({ table_no:t, shift:sh }).then(function(r){
    r._box=box; el.innerHTML=qssRenderHTML(t,sh,r); QSS_DONE[box]=key;
  }).catch(function(e){
    el.innerHTML='<div style="color:#b91c1c;font-size:12px">โหลดตารางอ้างอิงไม่ได้: '+esc(e.message||'')+'</div>';
  });
});
function taskDetailHTML(d,opts){
  if(!d) return '';
  opts=opts||{};
  var extra='';
  // ★ งานที่เป็นหน้าที่ของ ผจก. โดยตรง
  if(d.mgr_owner){
    extra += '<div style="margin:6px 0 2px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:9px 10px;font-size:12.5px;line-height:1.65;color:#92400e">'
      + '<b>งานของผู้จัดการร้าน</b><div style="margin-top:2px">ระบบมอบงานนี้ให้ ผจก. ของสาขาอัตโนมัติ — ถ้า ผจก. ไม่อยู่ หัวหน้าผลัดเปลี่ยนคนทำได้</div></div>';
  }
  // ★ งานที่ผูกกับ Shelf ที่รับผิดชอบ — ดึงรายการ Shelf ของพนักงานคนนี้มาแสดง
  if(String(d.link_kind||'')==='Shelf' && !opts.noShelf){
    var sv=(window.MY_SHELVES||[]);
    extra += '<div style="margin:6px 0 2px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:9px 10px;font-size:12.5px;line-height:1.65">'
      + '<b>Shelf ที่คุณรับผิดชอบเดือนนี้ ('+sv.length+')</b>'
      + (sv.length ? ('<div style="margin-top:4px">'+sv.map(function(x){
            return '• '+esc((x.code?(x.code+' '):'')+(x.name||''))+(x.detail?(' <span style="color:#64748b">'+esc(x.detail)+'</span>'):''); }).join('<br>')+'</div>'
          + '<div style="color:#1d4ed8;margin-top:5px">ตรวจ/ทำงานนี้เฉพาะ Shelf ข้างบนนี้ของคุณ</div>')
        : '<div style="margin-top:4px;color:#b45309">ยังไม่ได้รับมอบหมาย Shelf เดือนนี้ — แจ้งผู้จัดการร้านให้มอบหมายก่อน</div>')
      + '</div>';
  }
  // ★ งานที่ระบบสุ่มวันจากตารางเวรของคุณ
  if(String(d.auto_day||'')==='random_scheduled'){
    var pk=(window.AUTO_PICKS||{})[d.id];
    extra += '<div style="margin:6px 0 2px;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:10px;padding:9px 10px;font-size:12.5px;line-height:1.65">'
      + '<b>ระบบสุ่มวันให้จากตารางเวรของคุณ</b>'
      + (pk ? ('<div style="margin-top:3px">รอบนี้ตรงกับวันที่ <b>'+esc(String(pk.work_date))+'</b>'+(pk.shift_id?(' · กะ '+esc(pk.shift_id)):'')+'</div>') : '')
      + '<div style="color:#6d28d9;margin-top:3px">'+(String(d.freq||'')==='monthly'?'ทำ 1 ครั้งต่อเดือน':'ทำ 1 ครั้งต่อสัปดาห์')+' — ทำไม่ทันวันที่สุ่ม ยังทำต่อได้จนจบรอบ</div>'
      + '</div>';
  }
  // ★ ตารางอ้างอิง QSS — กดดูรายการที่ต้องทำเฉพาะผลัดนี้
  extra += qssBtnHTML(d);
  if(!d.how_to && !d.criteria && !d.photo_hint) return extra;
  var li=function(t){ return String(t||'').split('\n').filter(function(x){return x.trim();})
    .map(function(x){ return '<li>'+esc(x.replace(/^\u2022\s*/,''))+'</li>'; }).join(''); };
  var id='dtl_'+d.id+'_'+Math.floor(Math.random()*100000);
  return extra+'<div style="margin:6px 0 2px">'
   +'<button type="button" class="btn btn-sec btn-sm" style="font-size:12px" onclick="var e=document.getElementById(\''+id+'\');e.style.display=(e.style.display===\'none\'?\'block\':\'none\')">วิธีทำ / เกณฑ์ตรวจ</button>'
   +'<div id="'+id+'" style="display:none;margin-top:6px;font-size:12.5px;line-height:1.7;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:9px">'
   +(d.how_to?'<div style="font-weight:700">วิธีทำ</div><ul style="margin:3px 0 6px;padding-left:18px">'+li(d.how_to)+'</ul>':'')
   +(d.criteria?'<div style="font-weight:700">เกณฑ์การตรวจสอบ</div><ul style="margin:3px 0 6px;padding-left:18px">'+li(d.criteria)+'</ul>':'')
   +(d.photo_hint?'<div style="font-weight:700">วิธีถ่ายรูป</div><div>'+esc(d.photo_hint)+'</div>':'')
   +sampleShotHTML(d)
   +'</div></div>';
}
window.TASK_DET={};
var HO_STEPS={1:'เตรียมความพร้อมก่อนรับผลัด',2:'การรับผลัด',3:'ดำเนินการขายและให้บริการ',
 4:'การจัดการสินค้า',5:'การจัดการคุณภาพสินค้าอาหารและเครื่องดื่ม (QA)',6:'Shift Survey ตรวจสอบเงินสดระหว่างผลัด',
 7:'การปิดผลัดและส่งผลัด',8:'On-line ข้อมูลการขายและส่งเอกสารสิ้นวัน',9:'การนำเงินฝากธนาคาร'};
function stepOfDef(id){ var d=(window.TASK_DET||{})[id]; return (d && d.step!=null) ? Number(d.step) : 0; }
function stepHead(k,n){
  return '<div class="stephead">'+(k? ('<span class="n">'+k+'</span>'+esc(HO_STEPS[k]||('ขั้นตอน '+k)))
    : '<span class="n">•</span>งานอื่น ๆ')+'<span class="c">'+n+' งาน</span></div>';
}
function groupSteps(items, getStep){
  var g={}; (items||[]).forEach(function(x){ var k=getStep(x)||0; (g[k]=g[k]||[]).push(x); });
  return Object.keys(g).map(Number).sort(function(a,b){ return (a===0?99:a)-(b===0?99:b); })
    .map(function(k){ return [k, g[k]]; });
}
// ===== หัวข้อขั้นตอนแบบย่อ/ขยายได้ (จำสถานะไว้ต่อเครื่อง) =====
function _hoDay(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
var HO_COL=(function(){ try{ var o=JSON.parse(localStorage.getItem('ho_stepcol')||'{}')||{};
  return (o && o.d===_hoDay() && o.v) ? o.v : {}; }catch(e){ return {}; } })();
function _hoColSave(){ try{ localStorage.setItem('ho_stepcol', JSON.stringify({d:_hoDay(), v:HO_COL})); }catch(e){} }
function stepLabel(k){ return k? ('<span class="n">'+k+'</span>'+esc(HO_STEPS[k]||('\u0e02\u0e31\u0e49\u0e19\u0e15\u0e2d\u0e19 '+k)))
  : '<span class="n">\u2022</span>\u0e07\u0e32\u0e19\u0e2d\u0e37\u0e48\u0e19 \u0e46'; }
function stepSection(scope,k,label,cnt,inner,defCol,cls){
  var key=scope+':'+k;
  var col=(HO_COL[key]!==undefined)?!!HO_COL[key]:!!defCol;
  return '<div class="stepsec'+(col?' col':'')+(cls?(' '+cls):'')+'" data-sk="'+esc(key)+'">'
   +'<div class="stephead">'+label+'<span class="c">'+esc(String(cnt))+'</span>'
   +'<svg class="ei cv" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>'
   +'<div class="stepbody">'+inner+'</div></div>';
}
document.addEventListener('click', function(ev){
  var t=ev.target; if(!t||!t.closest) return;
  var h=t.closest('.stephead'); if(!h) return;
  var sec=h.parentNode; if(!sec||!sec.classList||!sec.classList.contains('stepsec')) return;
  var col=sec.classList.toggle('col');
  var key=sec.getAttribute('data-sk')||''; if(key){ HO_COL[key]=col; _hoColSave(); }
}, false);
</script>
