<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00703c">
<title>QA สินค้า · 7-Eleven</title>
<link rel="manifest" href="../manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--green:#00703c;--green-d:#00582f;--green-soft:#e7f3ec;--orange:#f5821f;--red:#e11f26;--bg:#eef1ec;--line:#dbe2dc;--muted:#6b756d;--txt:#1b2a20;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Kanit','Anuphan',sans-serif;background:var(--bg);color:var(--txt);min-height:100dvh;}
  .wrap{max-width:480px;margin:0 auto;min-height:100dvh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.06);}
  .top{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;padding:18px;display:flex;align-items:center;gap:12px;}
  .top .ic{font-size:24px;} .top h1{font-size:18px;font-weight:600;flex:1;}
  .home{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.15);padding:6px 11px;border-radius:9px;}
  .body{padding:18px;flex:1;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 2px;font-weight:500;}
  input[type=text],input[type=number],input[type=date],textarea,select{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:11px;padding:12px 13px;background:#fff;color:var(--txt);}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
  textarea{resize:vertical;min-height:48px;}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:transform .08s;}
  .btn:active{transform:scale(.98);}
  .btn-pri{background:var(--green);color:#fff;} .btn-sec{background:#fff;color:var(--txt);border:1.5px solid var(--line);}
  .btn-danger{background:#fff;color:var(--red);border:1.5px solid #f1bcbe;} .btn-warn{background:#fff7ed;color:#9a3412;border:1.5px solid #fed7aa;}
  .btn-sm{padding:9px 12px;font-size:14px;width:auto;}
  .row2{display:flex;gap:8px;} .row2>*{flex:1;}
  .who{display:flex;align-items:center;gap:12px;background:var(--green-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;}
  .who .nm{font-weight:600;font-size:16px;} .who .sub{font-size:12.5px;color:var(--green-d);}
  .who .ch{margin-left:auto;font-size:12.5px;color:var(--green-d);background:#fff;border:1px solid var(--green-soft);padding:5px 10px;border-radius:8px;cursor:pointer;}
  h3.sec{font-size:13px;color:var(--green-d);font-weight:700;margin:16px 2px 8px;}
  .pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;}
  .ok{background:var(--green-soft);color:var(--green-d);} .bad{background:#fdeaea;color:var(--red);} .warn{background:#fff4e0;color:#a06515;} .muted2{background:#eef0ec;color:var(--muted);}
  .thumbs{display:flex;gap:6px;overflow-x:auto;padding:2px 0;margin-top:6px;-webkit-overflow-scrolling:touch;}
  .thumbs img{height:66px;border-radius:8px;flex:none;border:1px solid var(--line);cursor:pointer;}
  .muted{color:var(--muted);font-size:13.5px;}
  /* ★ 24 ก.ย. 69 — แถบค้นหาในรายการสินค้า */
  .qchip{display:inline-block;font-size:13px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--txt);cursor:pointer;white-space:nowrap;}
  .qchip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600;}
  .itbar input[type=text],.itbar input[type=date]{font-size:15px;padding:10px 12px;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:12px 18px;border-radius:11px;color:#fff;font-weight:500;font-size:14.5px;display:none;z-index:90;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.18);text-align:center;}
  .toast.ok{background:var(--green);} .toast.err{background:var(--red);} .toast.show{display:block;}
  .hide{display:none;} .spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .fcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;cursor:pointer;border-left:3px solid var(--green);}
  .badge{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;}
  #scanOverlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;}
  #scanOverlay video{width:94%;max-width:440px;border-radius:14px;background:#000;}
  .scanhint{color:#fff;margin:14px;text-align:center;font-size:14px;}
  .scanframe{position:relative;width:94%;max-width:440px;}
  .scanframe::after{content:'';position:absolute;left:8%;right:8%;top:50%;height:2px;background:rgba(245,130,31,.9);box-shadow:0 0 8px rgba(245,130,31,.8);}
</style>
<style id="ui-refresh">
.ei{width:1em;height:1em;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;display:inline-block}

</style>

<script>
const $=id=>document.getElementById(id);
function toast(t,m){const e=$('toast');e.textContent=m;e.className='toast show '+(t||'ok');setTimeout(()=>e.className='toast',3000);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function show(id){['step_id','step_folders','step_items','step_add'].forEach(s=>$(s).classList.add('hide'));$(id).classList.remove('hide');}
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector('script[data-lib="'+src+'"]')){ res(); return; } const s=document.createElement('script'); s.src=src; s.dataset.lib=src; s.onload=res; s.onerror=()=>rej(new Error('load fail')); document.head.appendChild(s); }); }

let EMP=null, BRANCHES={}, CUR_FOLDER=null, ADD_PHOTOS=[];
// บริบทเมื่อเปิดมาจากงานดูแลเชลฟ์: mode = removed(เก็บออก) / watch(เฝ้าระวัง)
const QP=new URLSearchParams(location.search);
const SHELF_MODE=QP.get('mode')||'', SHELF_NAME=QP.get('shelf')||'', SHELF_BACK=QP.get('back')||'';
const OPEN_FID=QP.get('folder')||'';   // เปิดโฟลเดอร์นี้อัตโนมัติ (จาก deep-link แจ้งเตือน)
let _qaAutoOpened=false;
function curMonthStr(){ try{ return window.HR.bangkokDate().slice(0,7); }catch(e){ return new Date().toISOString().slice(0,7); } }
async function loadBranches(){ try{ const c=await window.HR.loadConfig(); (c.branches||[]).forEach(b=>BRANCHES[b.branch_id]=b.name); }catch(e){} }
function branchName(id){ return BRANCHES[id]||id||'(ไม่มีสาขาประจำ)'; }

// ===== รูป: ปั๊มวันเวลา + สาขา + ผู้ถ่าย =====
// ★ แก้ 15 ก.ย. 69 — ยกเวอร์ชันที่มี onerror/timeout จาก handover มาใช้
//   เดิมไม่มี onerror เลย รูป HEIC จาก iPhone ทำให้ Promise ค้างตลอดกาล หน้าเงียบ งานไม่ถูกบันทึก
// ===== แก้รูปกลับหัว / ตะแคง (15 ก.ย. 69) =====
// กล้องมือถือไม่ได้หมุนไฟล์จริง แต่เขียน "ทิศที่ต้องหมุน" ไว้ใน EXIF แทน
// เบราว์เซอร์ในแอป (LINE ฯลฯ) บางตัวไม่อ่าน EXIF → พอเอาไปวาดลง canvas รูปเลยกลับหัว
// วิธีแก้: อ่าน EXIF เอง แล้วหมุนไฟล์ให้ตั้งตรงก่อน ค่อยส่งเข้าขั้นตอนย่อ/ปั๊มวันเวลา
function _exifOri(file){
  return new Promise(function(res){
    try{
      if(!file || !/^image\/jpe?g$/i.test(String(file.type||''))) return res(1);
      var r=new FileReader();
      r.onerror=function(){ res(1); };
      r.onload=function(e){
        try{
          var v=new DataView(e.target.result), len=v.byteLength, off=2;
          if(len<4 || v.getUint16(0,false)!==0xFFD8) return res(1);
          while(off+4<=len){
            var marker=v.getUint16(off,false); off+=2;
            if(marker===0xFFE1){
              if(off+8>len || v.getUint32(off+2,false)!==0x45786966) return res(1);
              var tiff=off+8;
              if(tiff+8>len) return res(1);
              var little=(v.getUint16(tiff,false)===0x4949);
              var ifd=tiff+v.getUint32(tiff+4,little);
              if(ifd+2>len) return res(1);
              var n=v.getUint16(ifd,little);
              for(var i=0;i<n;i++){
                var ent=ifd+2+i*12;
                if(ent+12>len) break;
                if(v.getUint16(ent,little)===0x0112){
                  var o=v.getUint16(ent+8,little);
                  return res((o>=1&&o<=8)?o:1);
                }
              }
              return res(1);
            }
            if((marker & 0xFF00)!==0xFF00) return res(1);
            if(off+2>len) return res(1);
            off += v.getUint16(off,false);
          }
          res(1);
        }catch(_e){ res(1); }
      };
      r.readAsArrayBuffer(file.slice(0, 262144));
    }catch(_e){ res(1); }
  });
}
function _orientFile(file){
  var work=(async function(){
    var ori=await _exifOri(file);
    if(!(ori>1)) return file;                       // ตั้งตรงอยู่แล้ว
    if(typeof createImageBitmap!=='function') return file;
    var bmp;
    try{ bmp=await createImageBitmap(file,{imageOrientation:'none'}); }
    catch(_e){ return file; }                       // เบราว์เซอร์เก่า → ปล่อยให้ทางเดิมจัดการ
    try{
      var w=bmp.width, h=bmp.height, sw=(ori>=5)?h:w, sh=(ori>=5)?w:h;
      var c=document.createElement('canvas'); c.width=sw; c.height=sh;
      var x=c.getContext('2d');
      if(ori===2) x.transform(-1,0,0,1,w,0);
      else if(ori===3) x.transform(-1,0,0,-1,w,h);
      else if(ori===4) x.transform(1,0,0,-1,0,h);
      else if(ori===5) x.transform(0,1,1,0,0,0);
      else if(ori===6) x.transform(0,1,-1,0,h,0);
      else if(ori===7) x.transform(0,-1,-1,0,h,w);
      else if(ori===8) x.transform(0,-1,1,0,0,w);
      x.drawImage(bmp,0,0);
      var blob=await new Promise(function(r){ c.toBlob(r,'image/jpeg',0.92); });
      return blob || file;
    }catch(_e){ return file; }
    finally{ try{ bmp.close && bmp.close(); }catch(_e2){} }
  })();
  // กันค้าง: ถ้าหมุนไม่เสร็จใน 10 วิ ใช้ไฟล์เดิมไปก่อน
  return Promise.race([ work, new Promise(function(r){ setTimeout(function(){ r(file); },10000); }) ])
    .catch(function(){ return file; });
}
// ★ 17 ก.ย. 69 — กลับไปใช้แบบเดิม ไม่หมุนรูปเองตาม EXIF
//   เบราว์เซอร์สมัยใหม่หมุนรูปตาม EXIF ให้เองอยู่แล้วตอนสร้างภาพ
//   พอเราหมุนซ้ำเอง รูปเลยหมุนสองรอบ — ออกมาเอียง/กลับด้านแทบทุกรูป
//   คง _exifOri/_orientFile ไว้เฉย ๆ เผื่อเครื่องเก่าที่ไม่หมุนให้ จะได้เปิดกลับได้ทันที
async function resizeFile(file){
  return _resizeFileRaw(file);
}
function _resizeFileRaw(file){
  return new Promise(res=>{
    let done=false;
    const finish=(v)=>{ if(done) return; done=true; res(v); };
    const to=setTimeout(()=>finish(null), 15000);          // กันค้างถาวร

    const r=new FileReader();
    r.onerror=()=>{ clearTimeout(to); finish(null); };
    r.onload=ev=>{
      const raw=ev.target.result;
      const img=new Image();
      // ถอดรหัสรูปไม่ได้ → ใช้ไฟล์ต้นฉบับไปเลย ถ้าเป็น jpeg/png (ถ้าเป็น HEIC จะคืน null ให้ฟ้อง)
      img.onerror=()=>{ clearTimeout(to); finish(/^data:image\/(jpeg|jpg|png)/i.test(String(raw))?raw:null); };
      img.onload=()=>{
        clearTimeout(to);
        try{
          const max=1000,sc=Math.min(1,max/Math.max(img.width,img.height));
          const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
          const x=c.getContext('2d'); x.drawImage(img,0,0,c.width,c.height);
          // ปั๊มวันเวลา + สาขา + ผู้ถ่าย ลงบนรูป (กันใช้รูปซ้ำ/รูปเก่า)
          try{
            const now=new Date();
            const ts=now.toLocaleString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' น.';
            let sub=''; try{ sub=(typeof EMP!=='undefined'&&EMP)?((EMP.nickname||EMP.name||'')+((typeof branchName==='function')?(' · '+branchName(EMP.branch_id)):'')):''; }catch(_e){ sub=''; }
            const pad=Math.round(c.width*0.022), fs=Math.max(13,Math.round(c.width*0.033));
            const bh=fs*2+pad*2.4;
            x.fillStyle='rgba(0,0,0,.5)'; x.fillRect(0,c.height-bh,c.width,bh);
            x.textBaseline='alphabetic'; x.fillStyle='#fff';
            x.font='700 '+fs+'px Anuphan,Sarabun,sans-serif'; x.fillText(ts, pad, c.height-fs-pad*0.6);
            if(sub){ x.font='400 '+Math.round(fs*0.8)+'px Anuphan,Sarabun,sans-serif'; x.fillText(sub, pad, c.height-pad*0.7); }
          }catch(e){}
          const out=c.toDataURL('image/jpeg',0.85);         // ★ บังคับเป็น JPEG เสมอ (LINE ไม่รองรับ HEIC/WebP)
          finish(/^data:image\/jpeg/i.test(out) ? out : (/^data:image\/(jpeg|jpg|png)/i.test(String(raw))?raw:null));
        }catch(e){ finish(/^data:image\/(jpeg|jpg|png)/i.test(String(raw))?raw:null); }
      };
      img.src=raw;
    };
    r.readAsDataURL(file);
  });
}

// ===== รายการสินค้าในโฟลเดอร์ =====
function daysLeft(dstr){ const d=new Date(dstr+'T00:00:00'); const n=new Date(); n.setHours(0,0,0,0); return Math.round((d-n)/86400000); }
function statusPill(s){ return s==='sold'?['ขายแล้ว','ok']:s==='removed'?['เก็บออกแล้ว','muted2']:['ยังอยู่บนเชลฟ์','warn']; }
function expiryText(dstr){
  const dl=daysLeft(dstr); const dt=new Date(dstr+'T00:00:00').toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'});
  let col='var(--muted)', tag='';
  if(dl<0){ col='var(--red)'; tag=' · หมดอายุแล้ว '+(-dl)+' วัน'; }
  else if(dl<=3){ col='var(--red)'; tag=' · เหลือ '+dl+' วัน'; }
  else if(dl<=7){ col='#b45309'; tag=' · เหลือ '+dl+' วัน'; }
  else if(dl<=30){ col='#a06515'; tag=' · เหลือ '+dl+' วัน'; }
  else tag=' · เหลือ '+dl+' วัน';
  return '<span style="color:'+col+';font-weight:600"><svg class="ei" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg> หมดอายุ '+dt+tag+'</span>';
}
// ★ 24 ก.ย. 69 — รายการสินค้าในโฟลเดอร์: ค้นหา/กรอง + ไม่เด้งกลับขึ้นบนเวลาเปลี่ยนสถานะ
//   ของเดิม: กดขายแล้ว/เก็บออก → เรียก openFolder() ใหม่ทั้งก้อน (ยิง API + สร้าง DOM ใหม่)
//            หน้าจึงกระโดดกลับไปบนสุดทุกครั้ง เลื่อนหาสินค้าตัวถัดไปใหม่ทุกที
//   ของใหม่: เก็บรายการไว้ในหน่วยความจำ อัปเดตเฉพาะรายการที่เปลี่ยน แล้ววาดใหม่พร้อมคืนตำแหน่งเลื่อน
let IT_ROWS=[], IT_FILTER='';
function itDaysLeft(d){ try{ return daysLeft(d); }catch(_e){ return 0; } }
function itMatch(it){
  const q=(($('it_q')||{}).value||'').trim().toLowerCase();
  if(q){
    const hay=((it.name||'')+' '+(it.barcode||'')+' '+(it.size||'')+' '+(it.zone||'')).toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  const f=IT_FILTER;
  if(f==='on_shelf'||f==='sold'||f==='removed'){ if(String(it.status||'')!==f) return false; }
  else if(f==='d:exp'){ if(itDaysLeft(it.expiry_date)>=0) return false; }
  else if(f==='d:7'){ const d=itDaysLeft(it.expiry_date); if(d<0||d>7) return false; }
  else if(f==='d:30'){ const d=itDaysLeft(it.expiry_date); if(d<0||d>30) return false; }
  const from=(($('it_from')||{}).value||''), to=(($('it_to')||{}).value||'');
  const ex=String(it.expiry_date||'').slice(0,10);
  if(from && ex && ex<from) return false;
  if(to   && ex && ex>to)   return false;
  return true;
}
function itCardHTML(it){
  const sp=statusPill(it.status);
  let c='<div class="card" data-itcard="'+it.id+'"><div style="display:flex;gap:8px;align-items:flex-start"><div style="flex:1"><div style="font-weight:700">'+esc(it.name)+'</div>';
  c+='<div class="muted" style="margin-top:2px">'+(it.barcode?('รหัส '+esc(it.barcode)+' · '):'')+(it.size?('ขนาด '+esc(it.size)+' · '):'')+'จำนวน '+(it.qty||1)+' ชิ้น'+(it.zone?(' · โซน '+esc(it.zone)):'')+'</div>';
  c+='<div style="margin-top:4px;font-size:13.5px">'+expiryText(it.expiry_date)+'</div>';
  c+='</div><span class="pill '+sp[1]+'">'+sp[0]+'</span></div>';
  if(it.photos&&it.photos.length) c+='<div class="thumbs">'+it.photos.map(u=>'<img src="'+esc(u)+'" onclick="lightbox(this.src)">').join('')+'</div>';
  c+='<div class="row2" style="margin-top:10px">'
    +'<button class="btn btn-sm '+(it.status==='on_shelf'?'btn-warn':'btn-sec')+'" data-st="on_shelf" data-id="'+it.id+'">ยังอยู่</button>'
    +'<button class="btn btn-sm '+(it.status==='sold'?'btn-pri':'btn-sec')+'" data-st="sold" data-id="'+it.id+'">ขายแล้ว</button>'
    +'<button class="btn btn-sm '+(it.status==='removed'?'btn-danger':'btn-sec')+'" data-st="removed" data-id="'+it.id+'" title="ต้องถ่ายรูปหลักฐานก่อนบันทึก">เก็บออก 📷</button>'
    +'</div>';
  return c+'</div>';
}
function renderItems(keepScroll){
  const box=$('items_body'); if(!box) return;
  const y = keepScroll ? (window.pageYOffset||document.documentElement.scrollTop||0) : null;
  const rows=IT_ROWS.filter(itMatch);
  const cnt=$('it_count');
  if(cnt) cnt.textContent = IT_ROWS.length
    ? ('แสดง '+rows.length+' จาก '+IT_ROWS.length+' รายการ'
       +' · ยังอยู่ '+IT_ROWS.filter(x=>x.status==='on_shelf').length
       +' · ขายแล้ว '+IT_ROWS.filter(x=>x.status==='sold').length
       +' · เก็บออก '+IT_ROWS.filter(x=>x.status==='removed').length)
    : '';
  box.innerHTML = IT_ROWS.length
    ? (rows.length ? rows.map(itCardHTML).join('') : '<div class="card muted">ไม่พบสินค้าตามเงื่อนไขที่ค้นหา</div>')
    : '<div class="card muted">ยังไม่มีสินค้าในโฟลเดอร์นี้ กด "＋ เพิ่มสินค้า"</div>';
  box.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>itSetStatus(b));
  if(y!=null){ try{ window.scrollTo(0,y); }catch(_e){} }   // ★ คืนตำแหน่งเดิม ไม่เด้งขึ้นบน
}
async function itSetStatus(b){
  const id=Number(b.dataset.id), st=b.dataset.st;
  if(st==='removed'){ rmPhotoFlow(id); return; }           // เก็บออก = ต้องถ่ายรูปหลักฐานก่อนเสมอ
  const prev=b.textContent; b.disabled=true; b.textContent='…';
  try{
    await window.HR.qaUpdateItemStatus({ item_id:id, empId:EMP.emp_id, status:st });
    itApplyLocal(id, st);                                   // อัปเดตในหน่วยความจำ ไม่โหลดใหม่ทั้งหน้า
    toast('ok', st==='sold'?'บันทึกขายแล้ว':'อัปเดตสถานะแล้ว');
  }catch(e){ toast('err',(e.message||'ไม่สำเร็จ')); b.disabled=false; b.textContent=prev; }
}
// อัปเดตสถานะรายการเดียวในหน่วยความจำ แล้ววาดใหม่โดยคงตำแหน่งเลื่อน
function itApplyLocal(id, st, photos){
  const it=IT_ROWS.find(x=>Number(x.id)===Number(id));
  if(it){ it.status=st; if(photos && photos.length) it.photos=(it.photos||[]).concat(photos); }
  renderItems(true);
}
async function openFolder(f){
  if(!f) return; CUR_FOLDER=f;
  show('step_items'); $('it_title').textContent=''+f.title; $('it_sub').textContent=f.target_month||'';
  $('items_body').innerHTML='<div class="card muted">กำลังโหลด…</div>';
  let r; try{ r=await window.HR.getQaItems(f.id); }catch(e){ $('items_body').innerHTML='<div class="card muted">'+esc(e.message||'')+'</div>'; return; }
  IT_ROWS=r.rows||[];
  renderItems(false);
}

// ★ เก็บออกต้องมีรูปหลักฐาน — เปิดกล้อง/เลือกรูปก่อน แล้วค่อยบันทึก (ยกเลิกได้ ไม่มีอะไรเปลี่ยน)
// ★ 20 ก.ย. 69 — แก้ "กล้องไม่เปิด" ตอนกดเก็บออกในเมนู QA
//   ต้นเหตุ 2 อย่างที่ทับกันอยู่ในช่องรับไฟล์ตัวนี้ (เป็นที่เดียวในระบบที่สร้างด้วย JS):
//     1) ตั้ง multiple ไว้พร้อมกับ capture — เบราว์เซอร์จะ "ไม่สนใจ capture" ทันทีที่มี multiple
//        เพราะโหมดถ่ายภาพคืนได้ครั้งละ 1 ไฟล์ → เด้งเป็นหน้าเลือกไฟล์แทนกล้องทุกครั้ง
//     2) เซ็ต capture เป็น property (inp.capture=...) บางเบราว์เซอร์ไม่สะท้อนเป็น attribute
//        ปุ่มถ่ายรูปที่อื่นในระบบประกาศเป็น attribute ใน HTML จึงใช้ได้ปกติ ต่างกันตรงนี้
//   แก้: ตัด multiple + ใช้ setAttribute · ถ่ายหลายรูปได้ด้วยแผงยืนยันที่กด "ถ่ายเพิ่ม" เอง
//        (ห้ามสั่ง click เองหลัง confirm เพราะหลุด user gesture มือถือจะบล็อกไม่เปิดกล้อง)
function _rmInput(){
  let inp=document.getElementById('rm_photo');
  if(!inp){ inp=document.createElement('input'); inp.id='rm_photo'; inp.style.display='none'; document.body.appendChild(inp); }
  inp.type='file';
  inp.setAttribute('accept','image/*');
  inp.setAttribute('capture','environment');
  inp.removeAttribute('multiple'); inp.multiple=false;
  inp.value='';
  return inp;
}
function _rmPanel(){
  let el=document.getElementById('rm_panel');
  if(el) return el;
  el=document.createElement('div'); el.id='rm_panel';
  el.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:none;align-items:flex-end;justify-content:center';
  el.innerHTML='<div style="background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:16px 16px 20px">'
    +'<div style="font-weight:700;font-size:15px;margin-bottom:3px">รูปหลักฐานการเก็บออก</div>'
    +'<div id="rm_cnt" style="font-size:12.5px;color:var(--muted);margin-bottom:10px"></div>'
    +'<div id="rm_thumbs" style="display:flex;gap:7px;overflow-x:auto;padding-bottom:10px"></div>'
    +'<div style="display:flex;gap:8px">'
      +'<button type="button" id="rm_more" class="btn btn-sec" style="flex:1;padding:12px">📷 ถ่ายเพิ่ม</button>'
      +'<button type="button" id="rm_save" class="btn" style="flex:1;padding:12px;background:var(--green);color:#fff;border:0;border-radius:10px;font:inherit;font-weight:700">บันทึกเก็บออก</button>'
    +'</div>'
    +'<button type="button" id="rm_cancel" style="width:100%;margin-top:8px;padding:10px;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer">ยกเลิก</button>'
  +'</div>';
  document.body.appendChild(el);
  return el;
}
function rmPhotoFlow(item_id){
  const inp=_rmInput(), panel=_rmPanel();
  const shots=[];
  const paint=()=>{
    document.getElementById('rm_cnt').textContent='ถ่ายแล้ว '+shots.length+' รูป · ต้องมีอย่างน้อย 1 รูป';
    document.getElementById('rm_thumbs').innerHTML=shots.map((u,i)=>
      '<span style="position:relative;flex:none"><img src="'+u+'" style="height:74px;border-radius:8px">'
      +'<button type="button" data-rmdel="'+i+'" style="position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;cursor:pointer">×</button></span>').join('')
      ||'<div style="font-size:12.5px;color:var(--muted)">ยังไม่มีรูป</div>';
    document.getElementById('rm_save').disabled=!shots.length;
    document.getElementById('rm_save').style.opacity=shots.length?'1':'.5';
    panel.querySelectorAll('[data-rmdel]').forEach(b=>b.onclick=()=>{ shots.splice(Number(b.dataset.rmdel),1); paint(); });
  };

// ===== สแกนบาร์โค้ด =====
// ★ 24 ก.ย. 69 — เขียนใหม่ทั้งก้อน หลังพบว่า "สแกนไม่ติดทุกเครื่อง"
//   ของเดิม: ปล่อยให้ ZXing เปิดกล้องเอง (decodeFromConstraints) ไม่ขอความละเอียด ไม่ขอโฟกัส
//     → ได้ภาพ 640×480 โฟกัสไม่เข้า และ ZXing ไล่อ่าน "ทุกรูปแบบ" ทั้งเฟรม
//     → บาร์โค้ด EAN-13 บนซองมันวาว/แสงร้านสะดวกซื้อ แทบไม่มีโอกาสอ่านติด
//     → error ทุกชนิดถูกยุบเป็นข้อความเดียว "เปิดกล้องไม่ได้" แยกไม่ออกว่าติดอะไร
//   ของใหม่:
//     1) ใช้ตัวอ่านบาร์โค้ดของตัวเครื่อง (BarcodeDetector) ก่อน — เร็วและแม่นกว่ามาก
//     2) ถ้าไม่มี ค่อยใช้ ZXing แต่จำกัดเฉพาะรูปแบบที่ร้านใช้จริง + TRY_HARDER
//     3) ขอกล้องหลังความละเอียดสูง + โฟกัสต่อเนื่อง + ปุ่มไฟฉาย
//     4) ครอบเฉพาะ "แถบกลางจอ" มาอ่าน (ที่เส้นส้ม) สลับกับเต็มเฟรม — เร็วขึ้นและแม่นขึ้น
//     5) บอกสาเหตุจริงเมื่อเปิดกล้องไม่ได้ (ไม่อนุญาต / ไม่มีกล้อง / แอปอื่นใช้อยู่ / ไม่ใช่ https)
//     6) สำรอง: ถ่ายรูปบาร์โค้ดแล้วให้ระบบอ่านจากรูป
let zxReader=null, zxActive=false, zxStream=null, zxTrack=null, zxTimer=null, zxDetector=null, zxTick=0, zxTorchOn=false;
const zxCanvas=document.createElement('canvas');
const BC_NATIVE=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar','qr_code'];

let SCAN_TARGET='add';                      // ★ 'add' = ใส่ช่องบาร์โค้ดตอนเพิ่มสินค้า · 'search' = ใช้ค้นหาในรายการ
$('ai_scan').onclick=()=>{ SCAN_TARGET='add'; openScanner(); };
$('scanClose').onclick=closeScanner;
$('scanManualOk').onclick=()=>{ const v=($('scanManual').value||'').trim(); if(v){ onBarcode(v); } };
$('scanShotBtn').onclick=()=>$('scanShot').click();
$('scanShot').onchange=async()=>{ const f=$('scanShot').files&&$('scanShot').files[0]; $('scanShot').value=''; if(f) await decodeFromFile(f); };
$('scanTorch').onclick=async()=>{
  if(!zxTrack) return;
  try{ zxTorchOn=!zxTorchOn; await zxTrack.applyConstraints({ advanced:[{ torch:zxTorchOn }] });
    $('scanTorch').style.background = zxTorchOn ? '#f59e0b' : ''; $('scanTorch').style.color = zxTorchOn ? '#fff' : '';
  }catch(e){ scanMsg('เปิดไฟฉายไม่ได้บนเครื่องนี้','err'); }
};
function scanMsg(t,cls){ const el=$('scanMsg'); if(el){ el.textContent=t||''; el.style.color = cls==='err' ? '#fca5a5' : '#fff'; } }
function scanDiag(t){ const el=$('scanDiag'); if(el) el.textContent=t||''; }

async function openScanner(){
  $('scanManual').value='';
  $('scanOverlay').style.display='flex';
  $('scanTorch').style.display='none'; zxTorchOn=false;
  scanMsg('กำลังเปิดกล้อง…'); scanDiag('');
  if(!window.isSecureContext){ scanMsg('เปิดกล้องไม่ได้ — ต้องเปิดหน้านี้ผ่าน https (ไม่ใช่ไฟล์ในเครื่อง)','err'); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ scanMsg('เบราว์เซอร์นี้เปิดกล้องจากเว็บไม่ได้ — ลองเปิดด้วย Chrome หรือ Safari','err'); return; }
  // ขอกล้องหลังความละเอียดสูง (ของเดิมไม่ได้ขอ เลยได้ 640×480 อ่านบาร์โค้ดไม่ออก)
  try{
    zxStream = await navigator.mediaDevices.getUserMedia({ audio:false, video:{
      facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 }, frameRate:{ ideal:30 } } });
  }catch(e1){
    try{ zxStream = await navigator.mediaDevices.getUserMedia({ audio:false, video:true }); }
    catch(e2){
      const n=String((e2&&e2.name)||(e1&&e1.name)||'');
      scanMsg(
        n==='NotAllowedError' ? 'ยังไม่ได้อนุญาตให้ใช้กล้อง — กดไอคอนซ้ายช่อง URL → สิทธิ์ → อนุญาต "กล้อง" แล้วเปิดใหม่'
      : n==='NotFoundError'   ? 'ไม่พบกล้องบนเครื่องนี้'
      : n==='NotReadableError'? 'กล้องถูกแอปอื่นใช้อยู่ — ปิดแอปกล้อง/วิดีโอคอลแล้วลองใหม่'
      : ('เปิดกล้องไม่ได้ ('+(n||'ไม่ทราบสาเหตุ')+')'), 'err');
      scanDiag('ระหว่างนี้ใช้ปุ่ม "ถ่ายรูปบาร์โค้ด" หรือพิมพ์เลขเองได้');
      return;
    }
  }
  const v=$('scanVideo');
  v.srcObject=zxStream; v.setAttribute('playsinline',''); v.muted=true;
  try{ await v.play(); }catch(_e){}
  zxTrack=(zxStream.getVideoTracks()||[])[0]||null;
  if(zxTrack){
    try{ await zxTrack.applyConstraints({ advanced:[{ focusMode:'continuous' }] }); }catch(_e){}
    try{ const caps=zxTrack.getCapabilities?zxTrack.getCapabilities():{}; if(caps && caps.torch) $('scanTorch').style.display=''; }catch(_e){}
  }
  zxActive=true; zxTick=0;
  // 1) ตัวอ่านของเครื่อง — เร็วและแม่นสุด
  zxDetector=null;
  if('BarcodeDetector' in window){
    try{
      const sup=await window.BarcodeDetector.getSupportedFormats();
      const use=BC_NATIVE.filter(f=>sup.indexOf(f)>=0);
      if(use.length){ zxDetector=new window.BarcodeDetector({ formats:use }); }
    }catch(_e){ zxDetector=null; }
  }
  // 2) ZXing (สำรอง) — จำกัดรูปแบบเฉพาะที่ร้านใช้ + TRY_HARDER
  if(!zxDetector){
    try{
      await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js');
      if(!window.ZXing) throw new Error('no lib');
      zxReader=zxMakeReader();
      if(!zxReader) throw new Error('no reader');
    }catch(e){
      scanMsg('โหลดตัวอ่านบาร์โค้ดไม่ได้ (เน็ตช้าหรือออฟไลน์)','err');
      scanDiag('ใช้ปุ่ม "ถ่ายรูปบาร์โค้ด" หรือพิมพ์เลขเองได้');
      return;
    }
  }
  const st=(zxTrack&&zxTrack.getSettings)?zxTrack.getSettings():{};
  scanMsg('เล็งบาร์โค้ดให้อยู่กลางเส้นส้ม ห่าง 10–20 ซม.');
  scanDiag('ตัวอ่าน: '+(zxDetector?'ของเครื่อง':'ZXing')+' · ภาพ '+(st.width||'?')+'×'+(st.height||'?'));
  scanLoop();
}
// อ่านทีละเฟรม: สลับ "แถบกลางจอ" (บาร์โค้ด 1 มิติ) กับ "เต็มเฟรม" (QR)
async function scanLoop(){
  if(!zxActive) return;
  const v=$('scanVideo');
  try{
    if(v && v.readyState>=2 && v.videoWidth){
      const cw=v.videoWidth, ch=v.videoHeight;
      const band=(zxTick++%3!==2);
      const bh=band?Math.max(80,Math.round(ch*0.40)):ch;
      const y =band?Math.round((ch-bh)/2):0;
      zxCanvas.width=cw; zxCanvas.height=bh;
      const g=zxCanvas.getContext('2d',{willReadFrequently:true});
      g.drawImage(v, 0,y,cw,bh, 0,0,cw,bh);
      const code=await decodeCanvas(zxCanvas);
      if(code){ onBarcode(code); return; }
    }
  }catch(_e){}
  zxTimer=setTimeout(scanLoop, 110);
}
// ★ สำคัญ: ไลบรารี ZXing รุ่นนี้ "ไม่มี" decodeFromCanvas (ตรวจกับไฟล์จริงบน CDN แล้ว)
//   ต้องประกอบเอง: canvas → LuminanceSource → HybridBinarizer → BinaryBitmap → MultiFormatReader.decode
//   ทดสอบแล้วอ่าน EAN-13 ติดแม้แท่งกว้างแค่ 1 พิกเซล
function zxMakeReader(){
  try{
    if(!window.ZXing || !ZXing.MultiFormatReader) return null;
    const H=new Map();
    H.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,  ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.CODABAR, ZXing.BarcodeFormat.QR_CODE ]);
    H.set(ZXing.DecodeHintType.TRY_HARDER, true);
    const m=new ZXing.MultiFormatReader(); m.setHints(H); return m;
  }catch(_e){ return null; }
}
async function decodeCanvas(cvs){
  if(zxDetector){
    try{ const r=await zxDetector.detect(cvs); if(r && r.length && r[0].rawValue) return String(r[0].rawValue); }catch(_e){}
    return '';
  }
  if(zxReader){
    try{
      const src=new ZXing.HTMLCanvasElementLuminanceSource(cvs);
      const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
      const r=zxReader.decode(bmp);
      if(r) return r.getText();
    }catch(_e){}                      // ไม่เจอบาร์โค้ดในเฟรมนี้ = ปกติ
    finally{ try{ zxReader.reset(); }catch(_e){} }
  }
  return '';
}
// สำรอง: อ่านจากรูปที่ถ่าย (ใช้ได้ตอนแสงน้อย/ซองมันวาว — ถ่ายนิ่ง ๆ อ่านง่ายกว่า)
async function decodeFromFile(file){
  scanMsg('กำลังอ่านจากรูป…');
  try{
    const bmp = ('createImageBitmap' in window)
      ? await createImageBitmap(file)
      : await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
    const W=bmp.width||bmp.naturalWidth, H=bmp.height||bmp.naturalHeight;
    const sc=Math.min(1, 2000/Math.max(W,H));
    zxCanvas.width=Math.round(W*sc); zxCanvas.height=Math.round(H*sc);
    zxCanvas.getContext('2d',{willReadFrequently:true}).drawImage(bmp,0,0,zxCanvas.width,zxCanvas.height);
    if(!zxDetector && !zxReader){
      try{
        await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js');
        zxReader=zxMakeReader();
      }catch(_e){}
      if('BarcodeDetector' in window && !zxDetector){ try{ zxDetector=new window.BarcodeDetector({formats:BC_NATIVE}); }catch(_e){} }
    }
    const code=await decodeCanvas(zxCanvas);
    if(code){ onBarcode(code); return; }
    scanMsg('อ่านจากรูปไม่ได้ — ถ่ายให้บาร์โค้ดเต็มกรอบ ตรง ๆ ไม่เอียง แสงพอ แล้วลองใหม่','err');
  }catch(e){ scanMsg('อ่านรูปไม่สำเร็จ','err'); }
}
function closeScanner(){
  zxActive=false;
  if(zxTimer){ clearTimeout(zxTimer); zxTimer=null; }
  try{ if(zxTrack && zxTorchOn) zxTrack.applyConstraints({ advanced:[{ torch:false }] }); }catch(_e){}
  try{ if(zxStream) zxStream.getTracks().forEach(t=>t.stop()); }catch(_e){}
  try{ const v=$('scanVideo'); if(v){ v.pause(); v.srcObject=null; } }catch(_e){}
  try{ if(zxReader && zxReader.reset) zxReader.reset(); }catch(_e){}   // ล้างสถานะตัวอ่าน (ตัวอ่านใช้ซ้ำได้)
  zxStream=null; zxTrack=null; zxTorchOn=false;
  $('scanOverlay').style.display='none';
}
function onBarcode(code){
  code=String(code||'').trim(); if(!code) return;
  try{ if(navigator.vibrate) navigator.vibrate(60); }catch(_e){}
  const target=SCAN_TARGET; SCAN_TARGET='add';
  closeScanner();
  if(target==='search'){                     // ★ สแกนเพื่อ "ค้นหา" สินค้าในโฟลเดอร์
    const q=$('it_q'); if(q){ q.value=code; }
    IT_FILTER=''; document.querySelectorAll('#it_chips .qchip').forEach(c=>c.classList.toggle('on', c.dataset.f===''));
    renderItems(false);
    const n=IT_ROWS.filter(itMatch).length;
    toast(n?'ok':'err', n ? ('พบ '+n+' รายการ · '+code) : ('ไม่พบสินค้ารหัส '+code+' ในโฟลเดอร์นี้'));
    return;
  }
  $('ai_barcode').value=code;
  lookupBarcode(code).then(()=>qaDupLive());
  toast('ok','อ่านบาร์โค้ด: '+code);
}

// ===== กันบันทึกซ้ำ (สินค้าเดียวกัน + วันหมดอายุเดียวกัน) =====
function qaDupLine(d){

function qaDupAsk(dups){
  return new Promise(res=>{
    const o=document.createElement('div');
    o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:130;display:flex;align-items:center;justify-content:center;padding:16px';
    o.innerHTML='<div style="background:#fff;border-radius:14px;max-width:420px;width:100%;padding:16px 16px 14px">'
      +'<div style="font-weight:800;font-size:16px;color:#b45309;margin-bottom:4px">⚠ สินค้านี้บันทึกไปแล้ว</div>'
      +'<div style="font-size:13px;color:#57534e;margin-bottom:8px">สินค้าตัวเดียวกัน วันหมดอายุเดียวกัน มีในระบบแล้ว '+dups.length+' รายการ</div>'
      +'<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:2px 10px 6px;max-height:40vh;overflow:auto">'+dups.slice(0,10).map(qaDupLine).join('')+'</div>'
      +'<div style="font-size:12px;color:#78716c;margin:8px 0 10px">ถ้าเป็นล็อตเดียวกัน ไม่ต้องบันทึกซ้ำ · ถ้ามีเพิ่มจริง (คนละชั้น/คนละล็อต) กด "บันทึกซ้ำ"</div>'
      +'<div style="display:flex;gap:8px"><button class="btn btn-sec" data-a="0" style="flex:1">ยกเลิก</button><button class="btn" data-a="1" style="flex:1;background:#d97706;color:#fff">บันทึกซ้ำ</button></div></div>';
    o.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ o.remove(); res(b.dataset.a==='1'); });
    document.body.appendChild(o);
  });
}
// เตือนล่วงหน้าทันทีที่กรอกบาร์โค้ด/ชื่อ + วันหมดอายุครบ
let _qaDupT=null;
async function qaDupLive(){
  const box=$('ai_dup'); const exp=$('ai_expiry').value; const bc=$('ai_barcode').value.trim(); const nm=$('ai_name').value.trim();
  if(!exp || (!bc && !nm) || !EMP){ box.style.display='none'; box.innerHTML=''; return; }
  try{
    const dups=await window.HR.qaFindDuplicate({ branch_id:EMP.branch_id, barcode:bc, name:nm, size:$('ai_size').value, expiry_date:exp });
    if(dups.length){ box.innerHTML='<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:7px 10px"><div style="font-weight:700;color:#b45309;font-size:13px">⚠ สินค้านี้ (วันหมดอายุเดียวกัน) บันทึกไปแล้ว '+dups.length+' รายการ</div>'+dups.slice(0,3).map(qaDupLine).join('')+'</div>'; box.style.display='block'; }
    else { box.style.display='none'; box.innerHTML=''; }
  }catch(e){}
}
['ai_expiry','ai_barcode','ai_name','ai_size'].forEach(id=>{ const el=$(id); if(el) el.addEventListener('change',()=>{ clearTimeout(_qaDupT); _qaDupT=setTimeout(qaDupLive,250); }); });

// ===== บันทึกสินค้า =====
$('ai_save').onclick=async()=>{
  const name=$('ai_name').value.trim(); const expiry=$('ai_expiry').value;
  if(!name){ toast('err','กรอกชื่อสินค้า'); return; }
  if(!expiry){ toast('err','เลือกวันหมดอายุ'); return; }
  const st=SHELF_MODE==='removed'?'removed':'on_shelf';
  if(st==='removed'&&!ADD_PHOTOS.length){ toast('err','การเก็บออกต้องถ่ายรูปหลักฐานก่อน'); return; }
  const label=SHELF_MODE==='removed'?'บันทึกเก็บออก':(SHELF_MODE==='watch'?'บันทึกเฝ้าระวัง':'บันทึกสินค้า');
  const btn=$('ai_save'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> กำลังบันทึก…';
  try{
    const payload={ folder_id:CUR_FOLDER.id, empId:EMP.emp_id, barcode:$('ai_barcode').value, name, size:$('ai_size').value, qty:$('ai_qty').value, expiry_date:expiry, zone:$('ai_zone').value, photos:ADD_PHOTOS, status:st };
    try{ await window.HR.qaAddItem(payload); }
    catch(e){
      if(e && e.code==='QA_DUP'){
        // ★ บันทึกซ้ำ: สินค้าตัวเดียวกัน + วันหมดอายุเดียวกัน มีคนบันทึกไว้แล้ว → ถามก่อน
        const go=await qaDupAsk(e.dups||[]);
        if(!go){ toast('ok','ยกเลิก — ไม่บันทึกซ้ำ'); btn.disabled=false; btn.textContent=label; return; }
        payload.allow_dup=true; await window.HR.qaAddItem(payload);
      } else throw e;
    }
    toast('ok',st==='removed'?'บันทึกเก็บออกแล้ว':'บันทึกสินค้าแล้ว');
    openFolder(CUR_FOLDER);   // มีรายการใหม่จริง จึงต้องดึงใหม่
  }catch(e){ toast('err',(e.message||'ไม่สำเร็จ')); btn.disabled=false; btn.textContent=label; return; }
  btn.disabled=false; btn.textContent=label;
};

// ===== lightbox =====
function lightbox(src){ const o=document.createElement('div'); o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:120;display:flex;align-items:center;justify-content:center;cursor:zoom-out'; o.innerHTML='<img src="'+src+'" style="max-width:92%;max-height:90%;border-radius:8px">'; o.onclick=()=>o.remove(); document.body.appendChild(o); }

// ===== แถบกลับหน้าเชลฟ์ + เปิดมาจากงานดูแลเชลฟ์ =====
if(SHELF_BACK){
  const bar=$('shelfBar'); bar.style.display='flex';
  $('shelfCtx').innerHTML=(SHELF_NAME?('เชลฟ์: '+esc(SHELF_NAME)+'<br>'):'')+(SHELF_MODE==='removed'?'บันทึกสินค้าที่ <b>เก็บออก</b>':(SHELF_MODE==='watch'?'บันทึกสินค้า <b>เฝ้าระวัง ~4 เดือน</b>':''));
  $('shelfBack').onclick=()=>{ location.href=SHELF_BACK; };
}
loadBranches().then(()=>{
  const pre=QP.get('emp')||(function(){ try{return HRSession.getEmp();}catch(_e){return '';} })();
  if(pre){ $('empId').value=pre; $('goBtn').click(); }
});

// ===== แจ้งเตือนบนมือถือ (Web Push) =====
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('../sw.js',{updateViaCache:'none'}).then(function(r){try{r.update();}catch(e){}}).catch(function(){}); }); }
(function(){
  const btn=$('bNotify'); if(!btn) return;
  const supported=('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);
  if(!supported){ btn.style.display='none'; return; }
  function b64ToU8(s){ const pad='='.repeat((4-s.length%4)%4); const b=(s+pad).replace(/-/g,'+').replace(/_/g,'/'); const raw=atob(b); const arr=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i); return arr; }
  async function cur(){ const reg=await navigator.serviceWorker.ready; return reg.pushManager.getSubscription(); }
  async function refresh(){ btn.style.display=''; try{ const s=await cur(); btn.textContent=s?'แจ้งเตือนเปิดอยู่ (แตะเพื่อปิด)':'เปิดแจ้งเตือนงานบนมือถือนี้'; }catch(e){} }
  window.refreshNotifyBtn=refresh;
  btn.onclick=async()=>{
    if(!EMP){ toast('err','กรอกรหัสพนักงานก่อน'); return; }
    if(typeof window.VAPID_PUBLIC!=='string' || window.VAPID_PUBLIC.length<20){ toast('err','ระบบยังไม่ตั้งค่าแจ้งเตือน'); return; }
    btn.disabled=true;
    try{
      const s=await cur();
      if(s){ try{ await window.HR.sb.from('push_subscriptions').delete().eq('endpoint',s.endpoint); }catch(e){} await s.unsubscribe(); toast('ok','ปิดแจ้งเตือนแล้ว'); }
      else{
        const perm=await Notification.requestPermission();
        if(perm!=='granted'){ toast('err','ไม่ได้รับอนุญาตแจ้งเตือน'); btn.disabled=false; return; }
        const reg=await navigator.serviceWorker.ready;
        const sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToU8(window.VAPID_PUBLIC) });
        const j=sub.toJSON();
        const { error }=await window.HR.sb.from('push_subscriptions').upsert({ endpoint:sub.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, label:(EMP.nickname||EMP.name||'พนักงาน'), emp_id:EMP.emp_id, branch_id:EMP.branch_id||null }, { onConflict:'endpoint' });
        if(error){ toast('err','บันทึกไม่สำเร็จ: '+error.message); btn.disabled=false; return; }
        toast('ok','เปิดแจ้งเตือนแล้ว');
      }
      refresh();
    }catch(e){ toast('err','ทำรายการไม่สำเร็จ'); }
    btn.disabled=false;
  };
})();
</script>
